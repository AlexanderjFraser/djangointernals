<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 414 787">
  <!-- the server, outside Django, above -->
  <rect class="ground dashed" x="0.5" y="0.5" width="186" height="47" rx="4"/>
  <text x="12" y="20"><tspan class="strong">the server</tspan><tspan class="quiet">, outside Django</tspan></text>
  <text class="quiet" x="12" y="38">a WSGI or an ASGI server</text>
  <text class="quiet" x="22" y="68">calls the handler, once for each request</text>

  <!-- Django's region -->
  <rect class="ground" x="20.5" y="80.5" width="393" height="639" rx="8"/>
  <text class="strong" x="401.5" y="102" text-anchor="end">Django</text>

  <!-- on top: the contrib applications and, beside them, the developer's tools -->
  <text class="quiet" x="33" y="102">on top, built on the rest</text>
  <rect class="box" x="32.5" y="112.5" width="204" height="148" rx="4"/>
  <text class="strong" x="44" y="135">the applications of</text>
  <text class="name" x="44" y="154">django.contrib</text>
  <text x="44" y="173"><tspan class="name">auth</tspan>, <tspan class="name">sessions</tspan>, <tspan class="name">messages</tspan>,</text>
  <text x="44" y="192"><tspan class="name">admin</tspan>, <tspan class="name">contenttypes</tspan>,</text>
  <text x="44" y="211"><tspan class="name">staticfiles</tspan> and the others,</text>
  <text class="quiet" x="44" y="230">each an application like</text>
  <text class="quiet" x="44" y="249">the project's own</text>
  <rect class="box" x="248.5" y="112.5" width="153" height="148" rx="4"/>
  <text class="strong" x="260" y="135">the developer's tools</text>
  <text x="260" y="154">the management</text>
  <text x="260" y="173">commands,</text>
  <text x="260" y="192">the test framework</text>

  <!-- the request side: in down the left, the view at the foot, out up the right -->
  <rect class="box" x="32.5" y="272.5" width="369" height="159" rx="4"/>
  <text class="strong" x="44" y="295">the request side</text>
  <text x="82" y="326" text-anchor="middle">handler</text>
  <text x="82" y="368" text-anchor="middle">middleware</text>
  <text class="quiet" x="128" y="368">the way in</text>
  <text x="82" y="410" text-anchor="middle">resolver</text>
  <rect class="mark-box" x="189.5" y="391.5" width="56" height="28" rx="4"/>
  <text x="217.5" y="410" text-anchor="middle">view</text>
  <text class="quiet" x="307" y="368" text-anchor="end">the way out</text>
  <text x="353" y="368" text-anchor="middle">middleware</text>
  <text x="353" y="326" text-anchor="middle">response</text>

  <!-- beneath the view: the data side and the presentation side, the view over the seam between them -->
  <text class="quiet" x="217.5" y="451" text-anchor="middle">beneath the view, which uses them</text>
  <rect class="box" x="32.5" y="461.5" width="179" height="74" rx="4"/>
  <text class="strong" x="44" y="484">the data side</text>
  <text x="44" y="503">models, querysets, SQL,</text>
  <text x="44" y="522">backends, migrations</text>
  <rect class="box" x="223.5" y="461.5" width="178" height="74" rx="4"/>
  <text class="strong" x="235" y="484">the presentation side</text>
  <text x="235" y="503">templates, forms</text>

  <!-- beneath those, the services -->
  <rect class="box" x="32.5" y="547.5" width="369" height="74" rx="4"/>
  <text x="44" y="570"><tspan class="strong">the services</tspan><tspan class="quiet">, which any part may call on</tspan></text>
  <text x="44" y="589">signals, files, cache, mail, tasks,</text>
  <text x="44" y="608">serialization, the system checks</text>

  <!-- the floor -->
  <rect class="box" x="32.5" y="633.5" width="369" height="74" rx="4"/>
  <text x="44" y="656"><tspan class="strong">the floor</tspan><tspan class="quiet">, which nearly every part imports</tspan></text>
  <text x="44" y="675">the settings, the app registry,</text>
  <text x="44" y="694">the utilities, the core exceptions</text>

  <!-- the database, outside Django, below -->
  <rect class="ground dashed" x="0.5" y="739.5" width="210" height="47" rx="4"/>
  <text x="12" y="759"><tspan class="strong">the database</tspan><tspan class="quiet">, outside Django</tspan></text>
  <text class="quiet" x="12" y="777">reached through its driver</text>

  <!-- the server's call, down the left and into the handler -->
  <path class="mark-line" d="M10 48 V322 H44"/>
  <polygon class="head mark" points="54,322 44,317 44,327"/>
  <!-- the way in, down the left: handler, middleware, resolver, then across to the view -->
  <path class="mark-line" d="M82 331 V345"/>
  <polygon class="head mark" points="82,355 77,345 87,345"/>
  <path class="mark-line" d="M82 373 V387"/>
  <polygon class="head mark" points="82,397 77,387 87,387"/>
  <path class="mark-line" d="M112 406 H179.5"/>
  <polygon class="head mark" points="189.5,406 179.5,401 179.5,411"/>
  <!-- the way out, from the view across and up the right: middleware, response -->
  <path class="mark-line" d="M245.5 406 H353 V381"/>
  <polygon class="head mark" points="353,371 348,381 358,381"/>
  <path class="mark-line" d="M353 355 V342"/>
  <polygon class="head mark" points="353,332 348,342 358,342"/>

  <!-- the data side's link to the database, through its driver -->
  <path class="line" d="M32 498.5 H10 V729.5"/>
  <polygon class="head" points="10,739.5 5,729.5 15,729.5"/>
</svg>
