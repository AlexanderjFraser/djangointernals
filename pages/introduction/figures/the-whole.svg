<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 800 579">
  <!-- the server, outside Django, above -->
  <rect class="ground dashed" x="0.5" y="0.5" width="198" height="50" rx="4"/>
  <text x="12.5" y="21.5"><tspan class="strong">the server</tspan><tspan class="quiet">, outside Django</tspan></text>
  <text class="quiet" x="12.5" y="39.5">a WSGI or an ASGI server</text>
  <text class="quiet" x="28" y="71">calls the handler, once for each request</text>

  <!-- Django's region -->
  <rect class="ground" x="32.5" y="82.5" width="767" height="422" rx="8"/>
  <text class="strong" x="787.5" y="104.5" text-anchor="end">Django</text>

  <!-- on top: the contrib applications and, beside them, the developer's tools -->
  <text class="quiet" x="44.5" y="104.5">on top, built on the rest</text>
  <rect class="box" x="44.5" y="116.5" width="528" height="68" rx="4"/>
  <text x="56.5" y="137.5"><tspan class="strong">the applications of </tspan><tspan class="name">django.contrib</tspan></text>
  <text x="56.5" y="155.5"><tspan class="name">auth</tspan>, <tspan class="name">sessions</tspan>, <tspan class="name">messages</tspan>, <tspan class="name">admin</tspan>, <tspan class="name">contenttypes</tspan>, <tspan class="name">staticfiles</tspan> and the others,</text>
  <text class="quiet" x="56.5" y="173.5">each an application like the project's own</text>
  <rect class="box" x="584.5" y="116.5" width="203" height="68" rx="4"/>
  <text class="strong" x="596.5" y="137.5">the developer's tools</text>
  <text x="596.5" y="155.5">the management commands,</text>
  <text x="596.5" y="173.5">the test framework</text>

  <!-- the request side, left to right, the view at its centre -->
  <rect class="box" x="44.5" y="196.5" width="743" height="88" rx="4"/>
  <text class="strong" x="56.5" y="218.5">the request side</text>
  <text x="76" y="253.5">handler</text>
  <text x="196.2" y="253.5">middleware</text>
  <text class="quiet" x="231.2" y="271.5" text-anchor="middle">the way in</text>
  <text x="339.7" y="253.5">resolver</text>
  <rect class="mark-box" x="453.5" y="232.5" width="56" height="32" rx="4"/>
  <text x="481.5" y="253.5" text-anchor="middle">view</text>
  <text x="575" y="253.5">middleware</text>
  <text class="quiet" x="610" y="271.5" text-anchor="middle">the way out</text>
  <text x="718.5" y="253.5">response</text>

  <!-- beneath the view: the data side and the presentation side, the view over the seam between them -->
  <text class="quiet" x="481.5" y="305" text-anchor="middle">beneath the view, which uses them</text>
  <rect class="box" x="44.5" y="318.5" width="431" height="50" rx="4"/>
  <text class="strong" x="56.5" y="339.5">the data side</text>
  <text x="56.5" y="357.5">models, querysets, SQL; connections, backends, migrations</text>
  <rect class="box" x="487.5" y="318.5" width="300" height="50" rx="4"/>
  <text class="strong" x="499.5" y="339.5">the presentation side</text>
  <text x="499.5" y="357.5">templates, forms</text>

  <!-- beneath those, the services -->
  <rect class="box" x="44.5" y="380.5" width="743" height="50" rx="4"/>
  <text x="56.5" y="401.5"><tspan class="strong">the services</tspan><tspan class="quiet">, which any part may call on</tspan></text>
  <text x="56.5" y="419.5">signals, files, cache, mail, tasks, serialization, the system checks</text>

  <!-- the floor -->
  <rect class="box" x="44.5" y="442.5" width="743" height="50" rx="4"/>
  <text x="56.5" y="463.5"><tspan class="strong">the floor</tspan><tspan class="quiet">, which nearly every part imports</tspan></text>
  <text x="56.5" y="481.5">the settings, the app registry, the utilities, the core exceptions</text>

  <!-- the database, outside Django, below -->
  <rect class="ground dashed" x="0.5" y="528.5" width="198" height="50" rx="4"/>
  <text x="12.5" y="549.5"><tspan class="strong">the database</tspan><tspan class="quiet">, outside Django</tspan></text>
  <text class="quiet" x="12.5" y="567.5">reached through its driver</text>

  <!-- the server's call, down the left and into the handler -->
  <path class="mark-line" d="M16 50.5 V248.5 H58"/>
  <polygon class="head mark" points="68,248.5 58,243.5 58,253.5"/>
  <!-- the way in: handler, middleware, resolver, view -->
  <path class="mark-line" d="M130.7 248.5 H178.2"/>
  <polygon class="head mark" points="188.2,248.5 178.2,243.5 178.2,253.5"/>
  <path class="mark-line" d="M274.2 248.5 H321.7"/>
  <polygon class="head mark" points="331.7,248.5 321.7,243.5 321.7,253.5"/>
  <path class="mark-line" d="M395.9 248.5 H443.5"/>
  <polygon class="head mark" points="453.5,248.5 443.5,243.5 443.5,253.5"/>
  <!-- the way out: view, middleware, response -->
  <path class="mark-line" d="M509.5 248.5 H557"/>
  <polygon class="head mark" points="567,248.5 557,243.5 557,253.5"/>
  <path class="mark-line" d="M653 248.5 H700.5"/>
  <polygon class="head mark" points="710.5,248.5 700.5,243.5 700.5,253.5"/>

  <!-- the data side's way out to the database, through its driver -->
  <path class="line" d="M44.5 343.5 H16 V518.5"/>
  <polygon class="head" points="16,528.5 11,518.5 21,518.5"/>
</svg>
