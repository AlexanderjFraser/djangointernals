<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 606">
  <!-- the server, outside Django, above -->
  <rect class="ground dashed" x="0.5" y="0.5" width="186" height="47" rx="4"/>
  <text x="12" y="20"><tspan class="strong">the server</tspan><tspan class="quiet">, outside Django</tspan></text>
  <text class="quiet small" x="12" y="38">a WSGI or an ASGI server</text>
  <text class="quiet small" x="28" y="68">calls the handler, once for each request</text>

  <!-- Django's region -->
  <rect class="ground" x="32.5" y="80.5" width="613" height="458" rx="8"/>
  <text class="strong" x="633" y="104" text-anchor="end">Django</text>

  <!-- on top: the contrib applications and the developer's tools -->
  <text class="quiet small" x="45" y="102">on top, built on the rest</text>
  <rect class="box" x="44.5" y="112.5" width="350" height="92" rx="4"/>
  <text x="56" y="134"><tspan class="strong">the applications of </tspan><tspan class="name">django.contrib</tspan></text>
  <text x="56" y="156"><tspan class="name">auth</tspan>, <tspan class="name">sessions</tspan>, <tspan class="name">messages</tspan>, <tspan class="name">admin</tspan>,</text>
  <text x="56" y="174"><tspan class="name">contenttypes</tspan>, <tspan class="name">staticfiles</tspan> and the others,</text>
  <text class="quiet small" x="56" y="192">each an application like the project's own</text>
  <rect class="box" x="406.5" y="112.5" width="227" height="92" rx="4"/>
  <text class="strong" x="418" y="134">the developer's tools</text>
  <text x="418" y="156">the management commands,</text>
  <text x="418" y="174">the test framework</text>

  <!-- the request side, left to right, the view at its centre -->
  <rect class="box" x="44.5" y="216.5" width="589" height="82" rx="4"/>
  <text class="strong" x="56" y="238">the request side</text>
  <text x="66" y="268">handler</text>
  <text x="155" y="268">middleware</text>
  <text class="quiet small" x="190" y="286" text-anchor="middle">the way in</text>
  <text x="267" y="268">resolver</text>
  <rect class="mark-box" x="357.5" y="250.5" width="56" height="28" rx="4"/>
  <text x="385.5" y="268" text-anchor="middle">view</text>
  <text x="455" y="268">middleware</text>
  <text class="quiet small" x="490" y="286" text-anchor="middle">the way out</text>
  <text x="567" y="268">response</text>

  <!-- beneath the view: the data side and the presentation side -->
  <text class="quiet small" x="385.5" y="318" text-anchor="middle">beneath the view, which uses them</text>
  <rect class="box" x="44.5" y="328.5" width="335" height="58" rx="4"/>
  <text class="strong" x="56" y="350">the data side</text>
  <text x="56" y="370">models, querysets, SQL, backends, migrations</text>
  <rect class="box" x="391.5" y="328.5" width="242" height="58" rx="4"/>
  <text class="strong" x="403" y="350">the presentation side</text>
  <text x="403" y="370">templates, forms</text>

  <!-- beneath those, the services -->
  <rect class="box" x="44.5" y="398.5" width="589" height="58" rx="4"/>
  <text x="56" y="420"><tspan class="strong">the services</tspan><tspan class="quiet small">, which any part may call on</tspan></text>
  <text x="56" y="440">signals, files, cache, mail, tasks, serialization, the system checks</text>

  <!-- the floor -->
  <rect class="box" x="44.5" y="468.5" width="589" height="58" rx="4"/>
  <text x="56" y="490"><tspan class="strong">the floor</tspan><tspan class="quiet small">, which every part imports</tspan></text>
  <text x="56" y="510">the settings, the app registry, the utilities, the core exceptions</text>

  <!-- the database, outside Django, below -->
  <rect class="ground dashed" x="0.5" y="558.5" width="210" height="47" rx="4"/>
  <text x="12" y="578"><tspan class="strong">the database</tspan><tspan class="quiet">, outside Django</tspan></text>
  <text class="quiet small" x="12" y="596">reached through its driver</text>

  <!-- the server's call, down the left and into the handler; then the request side's sequence -->
  <path class="mark-line" d="M16 48 V264 H52"/>
  <polygon class="head mark" points="62,264 52,259 52,269"/>
  <path class="mark-line" d="M119 264 H139"/>
  <polygon class="head mark" points="149,264 139,259 139,269"/>
  <path class="mark-line" d="M231 264 H251"/>
  <polygon class="head mark" points="261,264 251,259 251,269"/>
  <path class="mark-line" d="M321 264 H341"/>
  <polygon class="head mark" points="351,264 341,259 341,269"/>
  <path class="mark-line" d="M420 264 H439"/>
  <polygon class="head mark" points="449,264 439,259 439,269"/>
  <path class="mark-line" d="M531 264 H551"/>
  <polygon class="head mark" points="561,264 551,259 551,269"/>

  <!-- the data side's link to the database, through its driver -->
  <path class="line" d="M44 357.5 H16 V548"/>
  <polygon class="head" points="16,558 11,548 21,548"/>
</svg>
