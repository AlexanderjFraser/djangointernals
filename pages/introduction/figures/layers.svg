  <rect class="ground" x="594.5" y="348.5" width="71" height="50" rx="4"/>
  <text class="name" x="630" y="378.5" text-anchor="middle">tasks/</text>
  <rect class="ground" x="682.5" y="348.5" width="71" height="50" rx="4"/>
  <text class="name" x="694.5" y="369.5">core/</text>
  <text class="name" x="694.5" y="387.5">cache/</text>
  <rect class="ground" x="256.5" y="422.5" width="94" height="32" rx="4"/>
