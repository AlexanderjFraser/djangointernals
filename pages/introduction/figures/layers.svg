  <text class="name" x="486" y="89.5" text-anchor="middle">test/</text>
  <rect class="ground" x="529.5" y="68.5" width="149" height="32" rx="4"/>
  <text class="name" x="604" y="89.5" text-anchor="middle">core/management/</text>

  <!-- the request side: urls/ over middleware/ and http/, core/handlers/ over views/ -->
  <rect class="ground" x="156.5" y="124.5" width="197" height="32" rx="4"/>
  <text x="255" y="145.5" text-anchor="middle"><tspan class="name">urls/</tspan><tspan class="quiet small"> with </tspan><tspan class="name">conf/urls/</tspan></text>
  <rect class="ground" x="419.5" y="124.5" width="133" height="32" rx="4"/>
  <text class="name" x="486" y="145.5" text-anchor="middle">core/handlers/</text>
  <rect class="ground" x="156.5" y="180.5" width="110" height="32" rx="4"/>
