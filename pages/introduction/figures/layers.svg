<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 420 887">
  <!-- the layers, top to bottom, each a band with its name at its head -->
  <rect class="box" x="0.5" y="0.5" width="419" height="70" rx="4"/>
  <rect class="box" x="0.5" y="94.5" width="419" height="70" rx="4"/>
  <rect class="box" x="0.5" y="188.5" width="419" height="120" rx="4"/>
  <rect class="box" x="0.5" y="332.5" width="419" height="70" rx="4"/>
  <rect class="box" x="0.5" y="426.5" width="419" height="70" rx="4"/>
  <rect class="box" x="0.5" y="520.5" width="419" height="196" rx="4"/>
  <rect class="box" x="0.5" y="740.5" width="419" height="146" rx="4"/>
  <text class="strong" x="12" y="21">on top</text>
  <text class="strong" x="12" y="115">the tools</text>
  <text class="strong" x="12" y="209">the request side</text>
  <text class="strong" x="12" y="353">the presentation side</text>
  <text class="strong" x="12" y="447">the data side</text>
  <text class="strong" x="12" y="541">the services</text>
  <text class="strong" x="12" y="761">the floor</text>

  <!-- what the paths are under -->
  <text class="quiet small" x="407.5" y="21" text-anchor="end"><tspan class="name">django/</tspan>, in layers from the top</text>

  <!-- on top -->
  <rect class="ground" x="12.5" y="32.5" width="86" height="26" rx="4"/>
  <text class="name" x="55.5" y="50" text-anchor="middle">contrib/</text>

  <!-- the tools -->
  <rect class="ground" x="183.5" y="126.5" width="63" height="26" rx="4"/>
  <text class="name" x="215" y="144" text-anchor="middle">test/</text>
  <rect class="ground" x="258.5" y="126.5" width="149" height="26" rx="4"/>
  <text class="name" x="333" y="144" text-anchor="middle">core/management/</text>

  <!-- the request side, in two rows -->
  <rect class="ground" x="12.5" y="220.5" width="175" height="26" rx="4"/>
  <text x="24.5" y="238"><tspan class="name">urls/</tspan><tspan class="quiet small"> with </tspan><tspan class="name">conf/urls/</tspan></text>
  <rect class="ground" x="227.5" y="220.5" width="133" height="26" rx="4"/>
  <text class="name" x="294" y="238" text-anchor="middle">core/handlers/</text>
  <rect class="ground" x="12.5" y="270.5" width="110" height="26" rx="4"/>
  <text class="name" x="67.5" y="288" text-anchor="middle">middleware/</text>
  <rect class="ground" x="135.5" y="270.5" width="63" height="26" rx="4"/>
  <text class="name" x="167" y="288" text-anchor="middle">http/</text>
  <rect class="ground" x="222.5" y="270.5" width="71" height="26" rx="4"/>
  <text class="name" x="258" y="288" text-anchor="middle">views/</text>

  <!-- the presentation side -->
  <rect class="ground" x="12.5" y="364.5" width="125" height="26" rx="4"/>
  <text class="name" x="75" y="382" text-anchor="middle">templatetags/</text>
  <rect class="ground" x="150.5" y="364.5" width="94" height="26" rx="4"/>
  <text class="name" x="197.5" y="382" text-anchor="middle">template/</text>
  <rect class="ground" x="266.5" y="364.5" width="71" height="26" rx="4"/>
  <text class="name" x="302" y="382" text-anchor="middle">forms/</text>

  <!-- the data side -->
  <rect class="ground" x="12.5" y="458.5" width="395" height="26" rx="4"/>
  <text class="name" x="24" y="476">db/</text>

  <!-- the services, in two rows; dispatch/ and core/mail/ beneath them -->
  <rect class="ground" x="12.5" y="552.5" width="118" height="26" rx="4"/>
  <text class="name" x="71.5" y="570" text-anchor="middle">core/checks/</text>
  <rect class="ground" x="155.5" y="552.5" width="71" height="26" rx="4"/>
  <text class="name" x="191" y="570" text-anchor="middle">tasks/</text>
  <rect class="ground" x="253.5" y="552.5" width="118" height="46" rx="4"/>
  <text class="name" x="265.5" y="570">core/</text>
  <text class="name" x="265.5" y="589">serializers/</text>
  <rect class="ground" x="12.5" y="622.5" width="141" height="26" rx="4"/>
  <text class="name" x="83" y="640" text-anchor="middle">core/signals.py</text>
  <rect class="ground" x="170.5" y="622.5" width="110" height="26" rx="4"/>
  <text class="name" x="225.5" y="640" text-anchor="middle">core/files/</text>
  <rect class="ground" x="297.5" y="622.5" width="110" height="26" rx="4"/>
  <text class="name" x="352.5" y="640" text-anchor="middle">core/cache/</text>
  <rect class="ground" x="59.5" y="678.5" width="94" height="26" rx="4"/>
  <text class="name" x="106.5" y="696" text-anchor="middle">dispatch/</text>
  <rect class="ground" x="252.5" y="678.5" width="102" height="26" rx="4"/>
  <text class="name" x="303.5" y="696" text-anchor="middle">core/mail/</text>

  <!-- the floor; utils/ beneath the rest -->
  <rect class="ground" x="12.5" y="772.5" width="63" height="26" rx="4"/>
  <text class="name" x="44" y="790" text-anchor="middle">conf/</text>
  <rect class="ground" x="87.5" y="772.5" width="63" height="26" rx="4"/>
  <text class="name" x="119" y="790" text-anchor="middle">apps/</text>
  <rect class="ground" x="161.5" y="772.5" width="126" height="46" rx="4"/>
  <text class="name" x="173.5" y="790">core/</text>
  <text class="name" x="173.5" y="809">exceptions.py</text>
  <rect class="ground" x="12.5" y="848.5" width="395" height="26" rx="4"/>
  <text class="name" x="24" y="866">utils/</text>

  <!-- with the layers: contrib/ to every layer -->
  <path class="line" d="M55.5 59 V84.5"/>
  <polygon class="head" points="55.5,94.5 50.5,84.5 60.5,84.5"/>
  <text class="quiet small" x="66" y="86">every layer</text>

  <!-- with the layers: the tools -->
  <path class="line" d="M237 153 V210.5"/>
  <polygon class="head" points="237,220.5 232,210.5 242,210.5"/>
  <path class="line" d="M374 153 V448.5"/>
  <polygon class="head" points="374,458.5 369,448.5 379,448.5"/>

  <!-- with the layers: the request side, within it and down -->
  <path class="line" d="M45 270 V256.5"/>
  <polygon class="head" points="45,246.5 40,256.5 50,256.5"/>
  <path class="line" d="M150 247 V260.5"/>
  <polygon class="head" points="150,270.5 145,260.5 155,260.5"/>
  <path class="line" d="M262 247 V260.5"/>
  <polygon class="head" points="262,270.5 257,260.5 267,260.5"/>
  <path class="line" d="M222 283.5 H208.5"/>
  <polygon class="head" points="198.5,283.5 208.5,278.5 208.5,288.5"/>
  <path class="line" d="M350 247 V448.5"/>
  <polygon class="head" points="350,458.5 345,448.5 355,448.5"/>
  <path class="line" d="M232 297 V354.5"/>
  <polygon class="head" points="232,364.5 227,354.5 237,354.5"/>
  <path class="line" d="M282 297 V354.5"/>
  <polygon class="head" points="282,364.5 277,354.5 287,354.5"/>

  <!-- with the layers: the presentation side -->
  <path class="line" d="M266 377.5 H254.5"/>
  <polygon class="head" points="244.5,377.5 254.5,372.5 254.5,382.5"/>
  <path class="line" d="M296 391 V448.5"/>
  <polygon class="head" points="296,458.5 291,448.5 301,448.5"/>

  <!-- with the layers: the data side -->
  <path class="line" d="M100 485 V542.5"/>
  <polygon class="head" points="100,552.5 95,542.5 105,542.5"/>
  <path class="line" d="M143 485 V612.5"/>
  <polygon class="head" points="143,622.5 138,612.5 148,612.5"/>
  <path class="line" d="M240 485 V612.5"/>
  <polygon class="head" points="240,622.5 235,612.5 245,612.5"/>

  <!-- with the layers: the services, every package to the floor, and the floor -->
  <path class="line" d="M106.5 649 V668.5"/>
  <polygon class="head" points="106.5,678.5 101.5,668.5 111.5,668.5"/>
  <path class="line" d="M30 717 V730.5"/>
  <polygon class="head" points="30,740.5 25,730.5 35,730.5"/>
  <text class="quiet small" x="42" y="733">every package but <tspan class="name">core/signals.py</tspan></text>
  <path class="line" d="M32 799 V838.5"/>
  <polygon class="head" points="32,848.5 27,838.5 37,838.5"/>

  <!-- against the layers: from the presentation side -->
  <path class="mark-line" d="M182 364 V306.5"/>
  <polygon class="head mark" points="182,296.5 177,306.5 187,306.5"/>
  <path class="mark-line" d="M158 364 V320.5 H95 V306.5"/>
  <polygon class="head mark" points="95,296.5 90,306.5 100,306.5"/>

  <!-- against the layers: from the data side -->
  <path class="mark-line" d="M322 458 V400.5"/>
  <polygon class="head mark" points="322,390.5 317,400.5 327,400.5"/>
  <path class="mark-line" d="M394 458 V162.5"/>
  <polygon class="head mark" points="394,152.5 389,162.5 399,162.5"/>

  <!-- against the layers: from the services -->
  <path class="mark-line" d="M120 552 V494.5"/>
  <polygon class="head mark" points="120,484.5 115,494.5 125,494.5"/>
  <path class="mark-line" d="M191 552 V494.5"/>
  <polygon class="head mark" points="191,484.5 186,494.5 196,494.5"/>
  <path class="mark-line" d="M312 552 V494.5"/>
  <polygon class="head mark" points="312,484.5 307,494.5 317,494.5"/>
  <path class="mark-line" d="M390 622 V494.5"/>
  <polygon class="head mark" points="390,484.5 385,494.5 395,494.5"/>

  <!-- against the layers: from utils/ -->
  <path class="mark-line" d="M56 848 V808.5"/>
  <polygon class="head mark" points="56,798.5 51,808.5 61,808.5"/>
  <path class="mark-line" d="M366 848 V658.5"/>
  <polygon class="head mark" points="366,648.5 361,658.5 371,658.5"/>
  <path class="mark-line" d="M300 848 V714.5"/>
  <polygon class="head mark" points="300,704.5 295,714.5 305,714.5"/>

  <!-- utils/ to http/, far above: drawn short, ending at the name -->
  <path class="mark-line" d="M333 848 V812.5"/>
  <polygon class="head mark" points="333,802.5 328,812.5 338,812.5"/>
  <text class="name mark" x="333" y="790" text-anchor="middle">http/</text>
</svg>
