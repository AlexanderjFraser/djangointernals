  <text class="name" x="322" y="201.5" text-anchor="middle">http/</text>
  <rect class="ground" x="381.5" y="180.5" width="118" height="32" rx="4"/>
  <text class="name" x="440.5" y="201.5" text-anchor="middle">views/</text>

