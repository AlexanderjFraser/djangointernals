  <rect class="ground" x="290.5" y="236.5" width="130" height="32" rx="4"/>
  <text class="name" x="355.5" y="257.5" text-anchor="middle">template/</text>
  <rect class="ground" x="444.5" y="236.5" width="71" height="32" rx="4"/>
