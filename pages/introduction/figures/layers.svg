<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 766 579">
  <!-- the layers: one stack, a band each, its name at the left -->
  <rect class="box" x="0.5" y="0.5" width="765" height="578" rx="4"/>
  <path class="line" d="M0.5 56.5 H765.5"/>
  <path class="line" d="M0.5 112.5 H765.5"/>
  <path class="line" d="M0.5 224.5 H765.5"/>
  <path class="line" d="M0.5 280.5 H765.5"/>
  <path class="line" d="M0.5 336.5 H765.5"/>
  <path class="line" d="M0.5 466.5 H765.5"/>
  <text class="strong" x="12" y="33.5">on top</text>
  <text class="strong" x="12" y="89.5">the tools</text>
  <text class="strong" x="12" y="145.5">the request side</text>
  <text class="strong" x="12" y="257.5">the presentation side</text>
  <text class="strong" x="12" y="313.5">the data side</text>
  <text class="strong" x="12" y="369.5">the services</text>
  <text class="strong" x="12" y="499.5">the floor</text>

  <!-- what the paths are under -->
  <text class="quiet small" x="753.5" y="33.5" text-anchor="end"><tspan class="name">django/</tspan>, in layers from the top</text>

  <!-- on top -->
  <rect class="ground" x="156.5" y="12.5" width="86" height="32" rx="4"/>
  <text class="name" x="199.5" y="33.5" text-anchor="middle">contrib/</text>

  <!-- the tools -->
