  <text class="name" x="188" y="499.5" text-anchor="middle">conf/</text>
  <rect class="ground" x="243.5" y="478.5" width="63" height="32" rx="4"/>
  <text class="name" x="275" y="499.5" text-anchor="middle">apps/</text>
  <rect class="ground" x="330.5" y="478.5" width="164" height="32" rx="4"/>
  <text class="name" x="412.5" y="499.5" text-anchor="middle">core/exceptions.py</text>
  <rect class="ground" x="156.5" y="534.5" width="597" height="32" rx="4"/>
  <text class="name" x="168.5" y="555.5">utils/</text>

