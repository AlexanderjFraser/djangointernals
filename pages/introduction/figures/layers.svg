  <text class="strong" x="13" y="178">the request side</text>
  <text class="strong" x="13" y="252">the presentation side</text>
  <text class="strong" x="13" y="326">the data side</text>
  <text class="strong" x="13" y="400">the services</text>
  <text class="strong" x="13" y="530">the floor</text>

