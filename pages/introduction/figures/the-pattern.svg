<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 508">
  <!-- the setting: an alias, and under it the dotted path of a class, a string -->
  <rect class="ground" x="0.5" y="0.5" width="645" height="114" rx="4"/>
  <text class="name" x="12" y="25">CACHES = {</text>
  <text class="name" x="43.2" y="44">"default": {</text>
  <text class="name" x="74.4" y="63">"BACKEND": <tspan class="mark">"django.core.cache.backends.locmem.LocMemCache"</tspan></text>
  <text class="name" x="43.2" y="82">}</text>
  <text class="name" x="12" y="101">}</text>

  <!-- first use: the handler is asked for the alias -->
  <path class="mark-line" d="M323 115 V155"/>
  <polygon class="head mark" points="323,165 318,155 328,155"/>
  <text class="quiet small" x="339" y="137">when code in a thread or asynchronous context</text>
  <text x="339" y="154"><tspan class="quiet small">first asks for </tspan><tspan class="name">caches["default"]</tspan></text>

  <rect class="box" x="151.5" y="165.5" width="344" height="34" rx="4"/>
  <text class="name" x="323" y="187" text-anchor="middle">CacheHandler.create_connection("default")</text>

  <!-- the string is imported, and the class comes back -->
  <path class="mark-line" d="M323 200 V224"/>
  <polygon class="head mark" points="323,234 318,224 328,224"/>
  <text x="339" y="221"><tspan class="quiet small">the string under </tspan><tspan class="name">"BACKEND"</tspan></text>

  <rect class="box" x="222.5" y="234.5" width="201" height="34" rx="4"/>
  <text x="323" y="256" text-anchor="middle"><tspan class="name">import_string(</tspan>the string<tspan class="name">)</tspan></text>

  <path class="mark-line" d="M323 269 V293"/>
  <polygon class="head mark" points="323,303 318,293 328,293"/>

  <!-- the class, and the base class it subclasses, which nothing tests -->
  <rect class="box" x="238.5" y="303.5" width="170" height="34" rx="4"/>
  <text x="323" y="325" text-anchor="middle">the class <tspan class="name">LocMemCache</tspan></text>

  <path class="line dashed" d="M409 320.5 H541"/>
  <polygon class="head" points="551,320.5 541,315.5 541,325.5"/>
  <text class="quiet small" x="480" y="311" text-anchor="middle">subclasses, unchecked</text>
  <rect class="ground" x="551.5" y="303.5" width="94" height="34" rx="4"/>
  <text class="name" x="598.5" y="325" text-anchor="middle">BaseCache</text>

  <!-- what keeps the instance: drawn first, so that the arrow runs over its edge -->
  <rect class="ground" x="0.5" y="388.5" width="645" height="118" rx="4"/>

  <!-- the class is called -->
  <path class="mark-line" d="M323 338 V396"/>
  <polygon class="head mark" points="323,406 318,396 328,396"/>
  <text x="339" y="359"><tspan class="quiet small">called with </tspan><tspan class="name">"LOCATION"</tspan><tspan class="quiet small"> and the rest</tspan></text>
  <text class="quiet small" x="339" y="376">of the alias's dictionary</text>

  <!-- the instance: one for each context, so a stack -->
  <rect class="mark-box" x="273.5" y="416.5" width="120" height="34" rx="4"/>
  <rect class="mark-box" x="268.5" y="411.5" width="120" height="34" rx="4"/>
  <rect class="mark-box" x="263.5" y="406.5" width="120" height="34" rx="4"/>
  <text x="323" y="428" text-anchor="middle">the instance</text>
  <text x="323" y="474" text-anchor="middle">kept by <tspan class="name">caches</tspan> in a <tspan class="name">Local</tspan> under <tspan class="name">"default"</tspan></text>
  <text class="quiet small" x="323" y="493" text-anchor="middle">one for each alias in each thread or asynchronous context, made on first use and kept</text>
</svg>
