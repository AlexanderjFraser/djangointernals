<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 491">
  <!-- the setting: an alias, and under it the dotted path of a class, a string -->
  <rect class="ground" x="0.5" y="0.5" width="600" height="104" rx="4"/>
  <text class="name" x="12" y="22">CACHES = {</text>
  <text class="name" x="43.2" y="40">"default": {</text>
  <text class="name" x="74.4" y="58">"BACKEND": <tspan class="mark">"django.core.cache.backends.locmem.LocMemCache"</tspan></text>
  <text class="name" x="43.2" y="76">}</text>
  <text class="name" x="12" y="94">}</text>

  <!-- the steps run down one stem at x 300.5, the centre of the setting and of what keeps the instance;
       what each arrow is given stands to its left -->

  <!-- first use: the handler is asked for the alias -->
  <path class="mark-line" d="M300.5 105 V146.5"/>
  <polygon class="head mark" points="300.5,156.5 295.5,146.5 305.5,146.5"/>
  <text class="quiet" x="288" y="126" text-anchor="end">when code in a thread or asynchronous context</text>
  <text x="288" y="144" text-anchor="end"><tspan class="quiet">first asks for </tspan><tspan class="name">caches["default"]</tspan></text>

  <rect class="box" x="128.5" y="156.5" width="344" height="32" rx="4"/>
  <text class="name" x="300.5" y="178" text-anchor="middle">CacheHandler.create_connection("default")</text>

  <!-- the string is imported -->
  <path class="mark-line" d="M300.5 189 V212.5"/>
  <polygon class="head mark" points="300.5,222.5 295.5,212.5 305.5,212.5"/>
  <text x="288" y="210" text-anchor="end"><tspan class="quiet">the string under </tspan><tspan class="name">"BACKEND"</tspan></text>

  <rect class="box" x="200.5" y="222.5" width="200" height="32" rx="4"/>
  <text x="300.5" y="244" text-anchor="middle"><tspan class="name">import_string(</tspan>the string<tspan class="name">)</tspan></text>

  <!-- and the class comes back -->
  <path class="mark-line" d="M300.5 255 V278.5"/>
  <polygon class="head mark" points="300.5,288.5 295.5,278.5 305.5,278.5"/>

  <!-- the class, and the base class it subclasses, which nothing tests: off the stem, to the right -->
  <rect class="box" x="215.5" y="288.5" width="170" height="32" rx="4"/>
  <text x="300.5" y="310" text-anchor="middle">the class <tspan class="name">LocMemCache</tspan></text>

  <path class="line dashed" d="M386 304.5 H541.5"/>
  <polygon class="head" points="551.5,304.5 541.5,299.5 541.5,309.5"/>
  <text class="quiet" x="468.5" y="294" text-anchor="middle">subclasses, unchecked</text>
  <rect class="ground" x="551.5" y="288.5" width="94" height="32" rx="4"/>
  <text class="name" x="598.5" y="310" text-anchor="middle">BaseCache</text>

  <!-- what keeps the instance: drawn first, so that the arrow runs over its edge -->
  <rect class="ground" x="0.5" y="372.5" width="600" height="118" rx="4"/>

  <!-- the class is called -->
  <path class="mark-line" d="M300.5 321 V382.5"/>
  <polygon class="head mark" points="300.5,392.5 295.5,382.5 305.5,382.5"/>
  <text x="288" y="342" text-anchor="end"><tspan class="quiet">called with </tspan><tspan class="name">"LOCATION"</tspan><tspan class="quiet"> and the rest</tspan></text>
  <text class="quiet" x="288" y="360" text-anchor="end">of the alias's dictionary</text>

  <!-- the instance: one for each context, so a stack -->
  <rect class="mark-box" x="250.5" y="402.5" width="120" height="32" rx="4"/>
  <rect class="mark-box" x="245.5" y="397.5" width="120" height="32" rx="4"/>
  <rect class="mark-box" x="240.5" y="392.5" width="120" height="32" rx="4"/>
  <text x="300.5" y="414" text-anchor="middle">the instance</text>

  <!-- who keeps it, and for how long -->
  <text x="300.5" y="458" text-anchor="middle">kept by <tspan class="name">caches</tspan> in a <tspan class="name">Local</tspan> under <tspan class="name">"default"</tspan></text>
  <text class="quiet" x="300.5" y="476" text-anchor="middle">one for each alias in each thread or asynchronous context, made on first use and kept</text>
</svg>
