<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 416 571">
  <!-- the setting: an alias, and under it the dotted path of a class, a string, broken before its last dot -->
  <rect class="ground" x="0.5" y="0.5" width="415" height="152" rx="4"/>
  <text class="name" x="12" y="25">CACHES = {</text>
  <text class="name" x="43.2" y="44">"default": {</text>
  <text class="name" x="74.4" y="63">"BACKEND":</text>
  <text class="name mark" x="105.6" y="82">"django.core.cache.backends.locmem</text>
  <text class="name mark" x="113.4" y="101">.LocMemCache"</text>
  <text class="name" x="43.2" y="120">}</text>
  <text class="name" x="12" y="139">}</text>

  <!-- the steps run down one stem at x 32.5, what each is given to the right of it -->

  <!-- first use: the handler is asked for the alias -->
  <path class="mark-line" d="M32.5 153 V196"/>
  <polygon class="head mark" points="32.5,206 27.5,196 37.5,196"/>
  <text class="quiet" x="48" y="175">when code in a thread or asynchronous context</text>
  <text x="48" y="194"><tspan class="quiet">first asks for </tspan><tspan class="name">caches["default"]</tspan></text>

  <rect class="box" x="0.5" y="206.5" width="344" height="34" rx="4"/>
  <text class="name" x="12" y="228">CacheHandler.create_connection("default")</text>

  <!-- the string is imported -->
  <path class="mark-line" d="M32.5 241 V265"/>
  <polygon class="head mark" points="32.5,275 27.5,265 37.5,265"/>
  <text x="48" y="262"><tspan class="quiet">the string under </tspan><tspan class="name">"BACKEND"</tspan></text>

  <rect class="box" x="0.5" y="275.5" width="201" height="34" rx="4"/>
  <text x="12" y="297"><tspan class="name">import_string(</tspan>the string<tspan class="name">)</tspan></text>

  <!-- and the class comes back -->
  <path class="mark-line" d="M32.5 310 V334"/>
  <polygon class="head mark" points="32.5,344 27.5,334 37.5,334"/>

  <!-- the class, and the base class it subclasses, which nothing tests -->
  <rect class="box" x="0.5" y="344.5" width="170" height="34" rx="4"/>
  <text x="12" y="366">the class <tspan class="name">LocMemCache</tspan></text>

  <path class="line dashed" d="M171 361.5 H311"/>
  <polygon class="head" points="321,361.5 311,356.5 311,366.5"/>
  <text class="quiet" x="246" y="351" text-anchor="middle">subclasses, unchecked</text>
  <rect class="ground" x="321.5" y="344.5" width="94" height="34" rx="4"/>
  <text class="name" x="368.5" y="366" text-anchor="middle">BaseCache</text>

  <!-- what keeps the instance: drawn first, so that the arrow runs over its edge -->
  <rect class="ground" x="0.5" y="431.5" width="415" height="139" rx="4"/>

  <!-- the class is called -->
  <path class="mark-line" d="M32.5 379 V439"/>
  <polygon class="head mark" points="32.5,449 27.5,439 37.5,439"/>
  <text x="48" y="400"><tspan class="quiet">called with </tspan><tspan class="name">"LOCATION"</tspan><tspan class="quiet"> and the rest</tspan></text>
  <text class="quiet" x="48" y="419">of the alias's dictionary</text>

  <!-- the instance: one for each context, so a stack -->
  <rect class="mark-box" x="22.5" y="459.5" width="120" height="34" rx="4"/>
  <rect class="mark-box" x="17.5" y="454.5" width="120" height="34" rx="4"/>
  <rect class="mark-box" x="12.5" y="449.5" width="120" height="34" rx="4"/>
  <text x="72.5" y="471" text-anchor="middle">the instance</text>

  <!-- who keeps it, and for how long -->
  <text x="12" y="518">kept by <tspan class="name">caches</tspan> in a <tspan class="name">Local</tspan> under <tspan class="name">"default"</tspan></text>
  <text class="quiet" x="12" y="537">one for each alias in each thread or asynchronous context,</text>
  <text class="quiet" x="12" y="556">made on first use and kept</text>
</svg>
