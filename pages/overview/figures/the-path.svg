<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 857 1019">
  <!-- the band: what is done once, before the first request -->
  <rect class="box" x="88.5" y="0.5" width="768" height="40" rx="4"/>
  <text x="100" y="25"><tspan class="strong">once, before the first request:</tspan> the settings, the app registry, the handler and its middleware chain</text>

  <!-- a column for each part of Django the request crosses; time runs down -->
  <path class="line" d="M88.5 74 H284.5"/>
  <path class="line" d="M292.5 74 H465.5"/>
  <path class="line" d="M473.5 74 H675.5"/>
  <path class="line" d="M683.5 74 H856.5"/>
  <text class="strong" x="186.5" y="64" text-anchor="middle">the handler and the middleware</text>
  <text class="strong" x="379" y="64" text-anchor="middle">the resolver and the view</text>
  <text class="strong" x="574.5" y="64" text-anchor="middle">the ORM</text>
  <text class="strong" x="770" y="64" text-anchor="middle">the template engine</text>

  <!-- the server, outside Django, on the left: it calls the handler, and later closes the response -->
  <text class="strong" x="0" y="64">the server</text>
  <text class="quiet small" x="0" y="80">outside Django</text>
  <text class="quiet small" x="0" y="109">calls</text>
  <path class="line" d="M0 117 H78"/>
  <polygon class="head" points="88,117 78,112 78,122"/>
  <path class="line" d="M88 899 H10"/>
  <polygon class="head" points="0,899 10,894 10,904"/>
  <text class="quiet small" x="0" y="923">the server</text>
  <text class="quiet small" x="0" y="939">sends the body,</text>
  <text class="quiet small" x="0" y="955">then closes</text>
  <text class="quiet small" x="0" y="971">the response</text>
  <path class="line" d="M0 987 H78"/>
  <polygon class="head" points="88,987 78,982 78,992"/>

  <!-- the request's path, station to station, in the accent -->
  <path class="mark-line" d="M186.5 149 V158"/>
  <polygon class="head mark" points="186.5,168 181.5,158 191.5,158"/>
  <path class="mark-line" d="M285 199 H379 V232"/>
  <polygon class="head mark" points="379,242 374,232 384,232"/>
  <path class="mark-line" d="M379 289 V298"/>
  <polygon class="head mark" points="379,308 374,298 384,298"/>
  <path class="mark-line" d="M466 331 H574.5 V356"/>
  <polygon class="head mark" points="574.5,366 569.5,356 579.5,356"/>
  <path class="mark-line" d="M676 397 H770 V430"/>
  <polygon class="head mark" points="770,440 765,430 775,430"/>
  <path class="mark-line" d="M770 503 V512"/>
  <polygon class="head mark" points="770,522 765,512 775,512"/>
  <path class="mark-line" d="M683 553 H574.5 V586"/>
  <polygon class="head mark" points="574.5,596 569.5,586 579.5,586"/>
  <path class="mark-line" d="M676 635 H770 V676"/>
  <polygon class="head mark" points="770,686 765,676 775,676"/>
  <path class="mark-line" d="M683 709 H379 V734"/>
  <polygon class="head mark" points="379,744 374,734 384,734"/>
  <path class="mark-line" d="M292 767 H186.5 V792"/>
  <polygon class="head mark" points="186.5,802 181.5,792 191.5,792"/>
  <path class="mark-line" d="M186.5 849 V858"/>
  <polygon class="head mark" points="186.5,868 181.5,858 191.5,858"/>

  <!-- the stations, each in its part's column; the query's is accented -->
  <rect class="box" x="88.5" y="86.5" width="196" height="62" rx="4"/>
  <text class="name" x="100" y="105">WSGIHandler.__call__</text>
  <text class="quiet small" x="100" y="122"><tspan class="name">request_started</tspan>;</text>
  <text class="quiet small" x="100" y="138">a <tspan class="name">WSGIRequest</tspan></text>
  <rect class="box" x="88.5" y="168.5" width="196" height="62" rx="4"/>
  <text class="name" x="100" y="187">process_request</text>
  <text class="quiet small" x="100" y="204">the way in: session, host,</text>
  <text class="quiet small" x="100" y="220">user, messages</text>
  <rect class="box" x="292.5" y="242.5" width="173" height="46" rx="4"/>
  <text class="name" x="304" y="261">URLResolver.resolve</text>
  <text class="quiet small" x="304" y="278">a route matches</text>
  <rect class="box" x="292.5" y="308.5" width="173" height="46" rx="4"/>
  <text class="name" x="304" y="327">by_year(year=2026)</text>
  <text class="quiet small" x="304" y="344">the view is called</text>
  <rect class="box" x="473.5" y="366.5" width="202" height="62" rx="4"/>
  <text class="name" x="485" y="385">QuerySet.filter</text>
  <text class="name" x="485" y="402">QuerySet.order_by</text>
  <text class="quiet small" x="485" y="418">a <tspan class="name">Query</tspan> is built; no SQL yet</text>
  <rect class="box" x="683.5" y="440.5" width="173" height="62" rx="4"/>
  <text class="name" x="695" y="459">get_template</text>
  <text class="quiet small" x="695" y="476">the engine, its loaders,</text>
  <text class="quiet small" x="695" y="492">the compile, once a process</text>
  <rect class="box" x="683.5" y="522.5" width="173" height="62" rx="4"/>
  <text class="name" x="695" y="541">Template.render</text>
  <text class="quiet small" x="695" y="558">the context processors,</text>
  <text class="quiet small" x="695" y="574">then the nodes</text>
  <rect class="mark-box" x="473.5" y="596.5" width="202" height="78" rx="4"/>
  <text class="name" x="485" y="615">QuerySet.__len__</text>
  <text class="quiet small" x="485" y="632">from <tspan class="name">{% for %}</tspan>:</text>
  <text class="quiet small" x="485" y="648"><tspan class="name">SQLCompiler</tspan>; connect; SELECT;</text>
  <text class="quiet small" x="485" y="664">rows become instances</text>
  <rect class="box" x="683.5" y="686.5" width="173" height="46" rx="4"/>
  <text class="name" x="695" y="705">VariableNode.render</text>
  <text class="quiet small" x="695" y="722">the loop's values escaped</text>
  <rect class="box" x="292.5" y="744.5" width="173" height="46" rx="4"/>
  <text class="name" x="304" y="763">HttpResponse</text>
  <text class="quiet small" x="304" y="780">the view returns it</text>
  <rect class="box" x="88.5" y="802.5" width="196" height="46" rx="4"/>
  <text class="name" x="100" y="821">process_response</text>
  <text class="quiet small" x="100" y="838">the way out: five headers added</text>
  <rect class="box" x="88.5" y="868.5" width="196" height="62" rx="4"/>
  <text class="name" x="100" y="887">start_response</text>
  <text class="quiet small" x="100" y="904">the status and the headers;</text>
  <text class="quiet small" x="100" y="920">the response is returned</text>
  <rect class="box" x="88.5" y="956.5" width="196" height="62" rx="4"/>
  <text class="name" x="100" y="975">HttpResponseBase.close</text>
  <text class="quiet small" x="100" y="992"><tspan class="name">request_finished</tspan>;</text>
  <text class="quiet small" x="100" y="1008">the connection is closed</text>
</svg>
