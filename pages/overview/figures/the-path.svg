<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 860 620">
  <!-- the band: what is done once, before the first request, across Django's columns -->
  <rect class="box" x="92.5" y="0.5" width="767" height="32" rx="4"/>
  <text x="104" y="21"><tspan class="strong">once, before the first request:</tspan> the settings, the app registry, the handler and its middleware chain</text>

  <!-- below, time runs down; a column for each part of Django the request crosses, and the server on the left, outside Django -->
  <text class="strong" x="0" y="53">the server</text>
  <text class="quiet small" x="0" y="69">outside Django</text>
  <text class="strong" x="92" y="53">the handler and the middleware</text>
  <text class="strong" x="318" y="53">the resolver and the view</text>
  <text class="strong" x="508" y="53">the ORM</text>
  <text class="strong" x="686" y="53">the template engine</text>

  <!-- the server calls the handler -->
  <text class="quiet small" x="0" y="91">calls</text>
  <path class="line" d="M0 99.5 H82.5"/>
  <polygon class="head" points="92.5,99.5 82.5,94.5 82.5,104.5"/>

  <!-- the handler and the middleware: the way in -->
  <rect class="box" x="92.5" y="65.5" width="208" height="68" rx="4"/>
  <text class="name" x="104" y="86">WSGIHandler.__call__</text>
  <text class="quiet" x="104" y="104"><tspan class="name">request_started</tspan>;</text>
  <text class="quiet" x="104" y="122">a <tspan class="name">WSGIRequest</tspan></text>
  <rect class="box" x="92.5" y="151.5" width="208" height="68" rx="4"/>
  <text class="name" x="104" y="172">process_request</text>
  <text class="quiet" x="104" y="190">the way in: session, host,</text>
  <text class="quiet" x="104" y="208">user, messages</text>
  <!-- the resolver and the view -->
  <rect class="box" x="318.5" y="160.5" width="172" height="50" rx="4"/>
  <text class="name" x="330" y="181">URLResolver.resolve</text>
  <text class="quiet" x="330" y="199">a route matches</text>
  <rect class="box" x="318.5" y="228.5" width="172" height="50" rx="4"/>
  <text class="name" x="330" y="249">by_year(year=2026)</text>
  <text class="quiet" x="330" y="267">the view is called</text>
  <!-- the ORM: the view builds the queryset -->
  <rect class="box" x="508.5" y="210.5" width="160" height="86" rx="4"/>
  <text class="name" x="520" y="231">QuerySet.filter</text>
  <text class="name" x="520" y="249">QuerySet.order_by</text>
  <text class="quiet" x="520" y="267">a <tspan class="name">Query</tspan> is built;</text>
  <text class="quiet" x="520" y="285">no SQL yet</text>
  <!-- the template engine -->
  <rect class="box" x="686.5" y="219.5" width="173" height="68" rx="4"/>
  <text class="name" x="698" y="240">get_template</text>
  <text class="quiet" x="698" y="258">the engine, its loaders,</text>
  <text class="quiet" x="698" y="276">the compile, then kept</text>
  <rect class="box" x="686.5" y="305.5" width="173" height="68" rx="4"/>
  <text class="name" x="698" y="326">Template.render</text>
  <text class="quiet" x="698" y="344">the context processors,</text>
  <text class="quiet" x="698" y="362">then the nodes</text>
  <!-- back in the ORM, from the template's loop: the query runs; accented -->
  <rect class="mark-box" x="508.5" y="310.5" width="160" height="104" rx="4"/>
  <text class="name" x="520" y="331">QuerySet.__len__</text>
  <text class="quiet" x="520" y="349">from <tspan class="name">{% for %}</tspan>:</text>
  <text class="quiet" x="520" y="367"><tspan class="name">SQLCompiler</tspan>;</text>
  <text class="quiet" x="520" y="385">connect; SELECT;</text>
  <text class="quiet" x="520" y="403">rows become instances</text>
  <!-- back in the template engine -->
  <rect class="box" x="686.5" y="403.5" width="173" height="50" rx="4"/>
  <text class="name" x="698" y="424">VariableNode.render</text>
  <text class="quiet" x="698" y="442">the loop's values escaped</text>
  <!-- back in the view -->
  <rect class="box" x="318.5" y="403.5" width="172" height="50" rx="4"/>
  <text class="name" x="330" y="424">HttpResponse</text>
  <text class="quiet" x="330" y="442">the view returns it</text>
  <!-- back in the handler and the middleware: the way out -->
  <rect class="box" x="92.5" y="403.5" width="208" height="50" rx="4"/>
  <text class="name" x="104" y="424">process_response</text>
  <text class="quiet" x="104" y="442">the way out: five headers added</text>
  <rect class="box" x="92.5" y="471.5" width="208" height="68" rx="4"/>
  <text class="name" x="104" y="492">start_response</text>
  <text class="quiet" x="104" y="510">the status and the headers;</text>
  <text class="quiet" x="104" y="528">the response is returned</text>
  <!-- after the server has sent the body and closed the response -->
  <rect class="box" x="92.5" y="551.5" width="208" height="68" rx="4"/>
  <text class="name" x="104" y="572">HttpResponseBase.close</text>
  <text class="quiet" x="104" y="590"><tspan class="name">request_finished</tspan>;</text>
  <text class="quiet" x="104" y="608">the connection is closed</text>

  <!-- the request's path, station to station, in the accent -->
  <path class="mark-line" d="M196.5 133.5 V141.5"/>
  <polygon class="head mark" points="196.5,151.5 191.5,141.5 201.5,141.5"/>
  <path class="mark-line" d="M300.5 185.5 H308.5"/>
  <polygon class="head mark" points="318.5,185.5 308.5,180.5 308.5,190.5"/>
  <path class="mark-line" d="M404.5 210.5 V218.5"/>
  <polygon class="head mark" points="404.5,228.5 399.5,218.5 409.5,218.5"/>
  <path class="mark-line" d="M490.5 253.5 H498.5"/>
  <polygon class="head mark" points="508.5,253.5 498.5,248.5 498.5,258.5"/>
  <path class="mark-line" d="M668.5 253.5 H676.5"/>
  <polygon class="head mark" points="686.5,253.5 676.5,248.5 676.5,258.5"/>
  <path class="mark-line" d="M772.5 287.5 V295.5"/>
  <polygon class="head mark" points="772.5,305.5 767.5,295.5 777.5,295.5"/>
  <path class="mark-line" d="M686.5 339.5 H678.5"/>
  <polygon class="head mark" points="668.5,339.5 678.5,334.5 678.5,344.5"/>
  <path class="mark-line" d="M668.5 385.5 H772.5 V393.5"/>
  <polygon class="head mark" points="772.5,403.5 767.5,393.5 777.5,393.5"/>
  <path class="mark-line" d="M686.5 428.5 H500.5"/>
  <polygon class="head mark" points="490.5,428.5 500.5,423.5 500.5,433.5"/>
  <path class="mark-line" d="M318.5 428.5 H310.5"/>
  <polygon class="head mark" points="300.5,428.5 310.5,423.5 310.5,433.5"/>
  <path class="mark-line" d="M196.5 453.5 V461.5"/>
  <polygon class="head mark" points="196.5,471.5 191.5,461.5 201.5,461.5"/>

  <!-- back to the server, which sends the body and then closes the response -->
  <path class="line" d="M92.5 505.5 H10"/>
  <polygon class="head" points="0,505.5 10,500.5 10,510.5"/>
  <text class="quiet small" x="0" y="532">sends the body,</text>
  <text class="quiet small" x="0" y="548">then closes</text>
  <text class="quiet small" x="0" y="564">the response</text>
  <path class="line" d="M0 585.5 H82.5"/>
  <polygon class="head" points="92.5,585.5 82.5,580.5 82.5,590.5"/>
</svg>
