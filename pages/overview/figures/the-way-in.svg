<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 741 477">
  <!-- the seven middleware, each a box inside the one listed before it in settings.MIDDLEWARE, 12 in from it at the left, the right and the foot -->
  <rect class="ground" x="60.5" y="0.5" width="680" height="476" rx="4"/>
  <rect class="box" x="72.5" y="54.5" width="656" height="410" rx="4"/>
  <rect class="ground" x="84.5" y="108.5" width="632" height="344" rx="4"/>
  <rect class="box" x="96.5" y="162.5" width="608" height="278" rx="4"/>
  <rect class="ground" x="108.5" y="216.5" width="584" height="212" rx="4"/>
  <rect class="box" x="120.5" y="270.5" width="560" height="146" rx="4"/>
  <rect class="ground" x="132.5" y="324.5" width="536" height="80" rx="4"/>

  <!-- the centre of the chain, accented, 12 inside the innermost middleware -->
  <rect class="mark-box" x="144.5" y="360.5" width="512" height="32" rx="4"/>

  <!-- the names, at the head of each box, stepping in with it -->
  <text class="name strong" x="72" y="22">SecurityMiddleware</text>
  <text class="name strong" x="84" y="76">SessionMiddleware</text>
  <text class="name strong" x="96" y="130">CommonMiddleware</text>
  <text class="name strong" x="108" y="184">CsrfViewMiddleware</text>
  <text class="name strong" x="120" y="238">AuthenticationMiddleware</text>
  <text class="name strong" x="132" y="292">MessageMiddleware</text>
  <text class="name strong" x="144" y="346">XFrameOptionsMiddleware</text>
  <text class="name" x="156" y="381">BaseHandler._get_response</text>

  <!-- beside each name, in one column: what its process_request leaves on the request or checks, and under it what that is -->
  <text class="quiet" x="372" y="22">checks</text>
  <text class="name" x="422" y="22">SECURE_SSL_REDIRECT</text>
  <text class="quiet" x="422" y="40">false by default, so no redirect to HTTPS</text>

  <text class="quiet" x="372" y="76">leaves</text>
  <text class="name" x="422" y="76">HttpRequest.session</text>
  <text class="quiet" x="422" y="94">a session store, not loaded</text>

  <text class="quiet" x="372" y="130">checks</text>
  <text x="422" y="130">the user agent, and the <tspan class="name">"Host"</tspan> header</text>
  <text class="quiet" x="422" y="148">against <tspan class="name">ALLOWED_HOSTS</tspan></text>

  <text class="quiet" x="372" y="184">leaves</text>
  <text class="name" x="422" y="184">META["CSRF_COOKIE"]</text>
  <text class="quiet" x="422" y="202">the cookie's secret, if the request has one</text>

  <text class="quiet" x="372" y="238">leaves</text>
  <text class="name" x="422" y="238">HttpRequest.user</text>
  <text class="quiet" x="422" y="256">a user not looked up</text>

  <text class="quiet" x="372" y="292">leaves</text>
  <text class="name" x="422" y="292">HttpRequest._messages</text>
  <text class="quiet" x="422" y="310">a <tspan class="name">FallbackStorage</tspan></text>

  <text class="quiet" x="372" y="346">nothing: it has no <tspan class="name">process_request</tspan></text>

  <text class="quiet" x="372" y="381">where the URL is resolved and the view called</text>

  <!-- the request, from outside, across every layer's left edge to the centre -->
  <text x="0" y="367">request</text>
  <path class="line" d="M0 376.5 H134"/>
  <polygon class="head" points="144,376.5 134,371.5 134,381.5"/>
</svg>
