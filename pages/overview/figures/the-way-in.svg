<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 471">
  <!-- the seven middleware, each a box inside the one listed before it in settings.MIDDLEWARE -->
  <rect class="ground" x="52.5" y="0.5" width="593" height="470" rx="4"/>
  <rect class="box" x="62.5" y="50.5" width="573" height="410" rx="4"/>
  <rect class="ground" x="72.5" y="100.5" width="553" height="350" rx="4"/>
  <rect class="box" x="82.5" y="150.5" width="533" height="290" rx="4"/>
  <rect class="ground" x="92.5" y="200.5" width="513" height="230" rx="4"/>
  <rect class="box" x="102.5" y="250.5" width="493" height="170" rx="4"/>
  <rect class="ground" x="112.5" y="300.5" width="473" height="110" rx="4"/>

  <!-- the centre of the chain, accented -->
  <rect class="mark-box" x="132.5" y="340.5" width="443" height="60" rx="4"/>
  <text class="name" x="144" y="365">BaseHandler._get_response</text>
  <text class="quiet small" x="144" y="385">where the URL is resolved and the view called</text>

  <!-- each layer's name, at the head of its box -->
  <text class="name" x="64" y="22">SecurityMiddleware</text>
  <text class="name" x="74" y="72">SessionMiddleware</text>
  <text class="name" x="84" y="122">CommonMiddleware</text>
  <text class="name" x="94" y="172">CsrfViewMiddleware</text>
  <text class="name" x="104" y="222">AuthenticationMiddleware</text>
  <text class="name" x="114" y="272">MessageMiddleware</text>
  <text class="name" x="124" y="322">XFrameOptionsMiddleware</text>

  <!-- beside each name, what its process_request leaves on the request (in ink), or checks (quiet) -->
  <text class="quiet" x="322" y="22">checks<tspan class="name" x="372">SECURE_SSL_REDIRECT</tspan></text>
  <text class="quiet small" x="372" y="40">false by default, so no redirect to HTTPS</text>
  <text class="quiet" x="322" y="72">leaves</text>
  <text class="name" x="372" y="72">HttpRequest.session</text>
  <text class="quiet small" x="372" y="90">a session store, not loaded</text>
  <text class="quiet" x="322" y="122">checks<tspan x="372">the user agent, and the </tspan><tspan class="name">"Host"</tspan> header</text>
  <text class="quiet small" x="372" y="140">against <tspan class="name">ALLOWED_HOSTS</tspan></text>
  <text class="quiet" x="322" y="172">leaves</text>
  <text class="name" x="372" y="172">META["CSRF_COOKIE"]</text>
  <text class="quiet small" x="372" y="190">the cookie's secret, if the request has one</text>
  <text class="quiet" x="322" y="222">leaves</text>
  <text class="name" x="372" y="222">HttpRequest.user</text>
  <text class="quiet small" x="372" y="240">a user not looked up</text>
  <text class="quiet" x="322" y="272">leaves</text>
  <text class="name" x="372" y="272">HttpRequest._messages</text>
  <text class="quiet small" x="372" y="290">a <tspan class="name">FallbackStorage</tspan></text>
  <text class="quiet" x="322" y="322">nothing: it has no <tspan class="name">process_request</tspan></text>

  <!-- the request, from outside, across every layer's edge to the centre -->
  <text x="0" y="361">request</text>
  <path class="line" d="M0 370.5 H122"/>
  <polygon class="head" points="132,370.5 122,365.5 122,375.5"/>
</svg>
