<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 833 599">
  <!-- two lanes, time running down both: every request's steps on the left; on the right, the first request's work alone -->
  <text class="strong" x="196.5" y="14" text-anchor="middle">every request</text>
  <text class="strong" x="636.5" y="14" text-anchor="middle">the first request alone</text>
  <path class="line" d="M0.5 24.5 H392.5"/>
  <path class="line" d="M440.5 24.5 H832.5"/>

  <!-- the template's name, from render -->
  <text x="196.5" y="48" text-anchor="middle"><tspan class="name">"journal/entries.html"</tspan><tspan class="quiet">, from </tspan><tspan class="name quiet">render</tspan></text>

  <!-- every request's path, down the left, in the accent -->
  <path class="mark-line" d="M196.5 56 V66.5"/>
  <polygon class="head mark" points="196.5,76.5 191.5,66.5 201.5,66.5"/>
  <path class="mark-line" d="M196.5 127 V200.5"/>
  <polygon class="head mark" points="196.5,210.5 191.5,200.5 201.5,200.5"/>
  <path class="mark-line" d="M196.5 261 V352.5"/>
  <polygon class="head mark" points="196.5,362.5 191.5,352.5 201.5,352.5"/>
  <path class="mark-line" d="M196.5 395 V408.5"/>
  <polygon class="head mark" points="196.5,418.5 191.5,408.5 201.5,408.5"/>
  <path class="mark-line" d="M196.5 469 V482.5"/>
  <polygon class="head mark" points="196.5,492.5 191.5,482.5 201.5,482.5"/>
  <path class="mark-line" d="M196.5 543 V556.5"/>
  <polygon class="head mark" points="196.5,566.5 191.5,556.5 201.5,556.5"/>

  <!-- get_template -->
  <rect class="box" x="0.5" y="76.5" width="392" height="50" rx="4"/>
  <text class="name" x="12" y="97">get_template</text>
  <text class="quiet" x="12" y="115">asks the engine</text>

  <!-- the cached loader, accented: where the second request finds the template -->
  <rect class="mark-box" x="0.5" y="210.5" width="392" height="50" rx="4"/>
  <text x="12" y="231">the cached loader<tspan class="quiet"> looks the name up</tspan></text>
  <text class="quiet" x="12" y="249">the second request finds the <tspan class="name">Template</tspan> here</text>

  <!-- the context -->
  <rect class="box" x="0.5" y="362.5" width="392" height="32" rx="4"/>
  <text x="12" y="383">a <tspan class="name">RequestContext</tspan><tspan class="quiet">, the view's dictionary on top</tspan></text>

  <rect class="box" x="0.5" y="418.5" width="392" height="50" rx="4"/>
  <text x="12" y="439">the context processors called</text>
  <text class="quiet" x="12" y="457"><tspan class="name">csrf</tspan>, <tspan class="name">request</tspan>, <tspan class="name">auth</tspan>, <tspan class="name">messages</tspan></text>

  <!-- the nodes, where the query is sent -->
  <rect class="box" x="0.5" y="492.5" width="392" height="50" rx="4"/>
  <text x="12" y="513">the nodes rendered<tspan class="quiet">, the loop's values escaped;</tspan></text>
  <text class="quiet" x="12" y="531"><tspan class="name">{% for %}</tspan> takes the queryset's len, which sends the query</text>

  <!-- the string -->
  <rect class="box" x="0.5" y="566.5" width="392" height="32" rx="4"/>
  <text x="12" y="587">a <tspan class="name">SafeString</tspan><tspan class="quiet">, which </tspan><tspan class="name quiet">render</tspan><tspan class="quiet"> makes an </tspan><tspan class="name quiet">HttpResponse</tspan><tspan class="quiet"> of</tspan></text>

  <!-- from a step to the first request's work done after it, dashed -->
  <path class="line dashed" d="M393 101.5 H430.5"/>
  <polygon class="head" points="440.5,101.5 430.5,96.5 430.5,106.5"/>
  <path class="line dashed" d="M393 235.5 H430.5"/>
  <polygon class="head" points="440.5,235.5 430.5,230.5 430.5,240.5"/>
  <path class="line dashed" d="M393 378.5 H430.5"/>
  <polygon class="head" points="440.5,378.5 430.5,373.5 430.5,383.5"/>
  <path class="line dashed" d="M636.5 127 V140.5"/>
  <polygon class="head" points="636.5,150.5 631.5,140.5 641.5,140.5"/>
  <path class="line dashed" d="M636.5 261 V274.5"/>
  <polygon class="head" points="636.5,284.5 631.5,274.5 641.5,274.5"/>

  <!-- inside get_template, the first time: the engine made, then the loaders -->
  <rect class="ground dashed" x="440.5" y="76.5" width="392" height="50" rx="4"/>
  <text x="452" y="97"><tspan class="name">EngineHandler</tspan><tspan class="quiet"> makes </tspan><tspan class="name quiet">DjangoTemplates</tspan><tspan class="quiet"> and its </tspan><tspan class="name quiet">Engine</tspan></text>
  <text class="quiet" x="452" y="115">from <tspan class="name">settings.TEMPLATES</tspan>, kept for the process</text>

  <rect class="ground dashed" x="440.5" y="150.5" width="392" height="32" rx="4"/>
  <text x="452" y="171">the loaders made</text>

  <!-- the first time, a miss in the cache: the file found, then compiled and stored -->
  <rect class="ground dashed" x="440.5" y="210.5" width="392" height="50" rx="4"/>
  <text x="452" y="231">not found:<tspan class="quiet"> the app-directories loader tries </tspan><tspan class="name quiet">admin/templates</tspan><tspan class="quiet">,</tspan></text>
  <text class="quiet" x="452" y="249"><tspan class="name">auth/templates</tspan>, then reads journal's file</text>

  <rect class="ground dashed" x="440.5" y="284.5" width="392" height="50" rx="4"/>
  <text x="452" y="305"><tspan class="name">Lexer.tokenize</tspan> and <tspan class="name">Parser.parse</tspan></text>
  <text class="quiet" x="452" y="323">make a <tspan class="name">Template</tspan> of nodes, which the cached loader stores</text>

  <!-- the first time, the context processors imported, before they are called -->
  <rect class="ground dashed" x="440.5" y="362.5" width="392" height="32" rx="4"/>
  <text x="452" y="383">the context processors imported</text>
</svg>
