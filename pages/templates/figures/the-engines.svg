<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 590">
  <!-- the setting at the top; under it, engines as a box holding, under each name, a backend (in the accent)
       that holds its language's own object, and that object its loaders; what each loader searches stands
       in one column on the right. Every box is named at its top left. -->

  <!-- the setting -->
  <rect class="ground" x="0.5" y="0.5" width="645" height="128" rx="4"/>
  <text x="13" y="22"><tspan class="name strong">TEMPLATES</tspan><tspan class="quiet">: two entries</tspan></text>
  <text class="name" x="13" y="48">{"BACKEND": "django.template.backends.django.DjangoTemplates",</text>
  <text class="name" x="20.8" y="68">"DIRS": [...], "APP_DIRS": True},</text>
  <text class="name" x="13" y="94">{"BACKEND": "django.template.backends.jinja2.Jinja2",</text>
  <text class="name" x="20.8" y="114">"DIRS": [...], "APP_DIRS": True}</text>

  <!-- the setting to engines -->
  <path class="line" d="M44.5 129 V150.5"/>
  <polygon class="head" points="44.5,160.5 39.5,150.5 49.5,150.5"/>

  <!-- engines -->
  <rect class="ground" x="0.5" y="160.5" width="645" height="428" rx="4"/>
  <text x="13" y="182"><tspan class="name strong">engines</tspan><tspan class="quiet">: each backend made at the first request for its name</tspan></text>

  <!-- "django": the DjangoTemplates backend -->
  <text class="name" x="13" y="220">"django"</text>
  <path class="line" d="M83.5 215.5 H98.5"/>
  <polygon class="head" points="108.5,215.5 98.5,210.5 98.5,220.5"/>
  <rect class="mark-box" x="108.5" y="198.5" width="524" height="212" rx="4"/>
  <text class="name strong" x="121" y="220">DjangoTemplates</text>

  <!-- its Engine -->
  <rect class="box" x="120.5" y="234.5" width="500" height="164" rx="4"/>
  <text x="133" y="256"><tspan class="name">engine</tspan><tspan class="quiet">: an </tspan><tspan class="name">Engine</tspan></text>

  <!-- the Engine's loaders: the cached loader around the two that search -->
  <rect class="ground" x="132.5" y="270.5" width="476" height="116" rx="4"/>
  <text x="145" y="292"><tspan class="quiet">its loaders: </tspan>the cached loader, holding</text>
  <rect class="box" x="144.5" y="306.5" width="452" height="30" rx="4"/>
  <text x="157" y="326">the filesystem loader</text>
  <text class="quiet" x="381" y="326">the directories of <tspan class="name">"DIRS"</tspan></text>
  <rect class="box" x="144.5" y="344.5" width="452" height="30" rx="4"/>
  <text x="157" y="364">the application directories loader</text>
  <text class="quiet" x="381" y="364">each application's <tspan class="name">"templates"</tspan></text>

  <!-- "jinja2": the Jinja2 backend -->
  <text class="name" x="13" y="444">"jinja2"</text>
  <path class="line" d="M83.5 439.5 H98.5"/>
  <polygon class="head" points="108.5,439.5 98.5,434.5 98.5,444.5"/>
  <rect class="mark-box" x="108.5" y="422.5" width="524" height="154" rx="4"/>
  <text class="name strong" x="121" y="444">Jinja2</text>

  <!-- its environment -->
  <rect class="box" x="120.5" y="458.5" width="500" height="106" rx="4"/>
  <text x="133" y="480"><tspan class="name">env</tspan><tspan class="quiet">: a </tspan>Jinja2 Environment</text>

  <!-- the environment's one loader, which searches both kinds of directory -->
  <rect class="ground" x="132.5" y="494.5" width="476" height="58" rx="4"/>
  <text x="145" y="516"><tspan class="quiet">its loader: </tspan>a FileSystemLoader</text>
  <text class="quiet" x="381" y="516">over <tspan class="name">"DIRS"</tspan> and</text>
  <text class="quiet" x="381" y="536">each application's <tspan class="name">"jinja2"</tspan></text>
</svg>
