<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 428">
  <!-- left: the tree, as lists -->
  <text class="strong" x="0" y="14">the tree</text>
  <text class="strong" x="346" y="14">what _populate files, and where</text>

  <rect class="ground" x="0" y="26" width="290" height="396" rx="4"/>
  <text class="quiet small" x="12" y="46">the root resolver's entries, by kind</text>

  <text class="name" x="12" y="70">""</text>
  <text class="quiet small" x="278" y="70" text-anchor="end">entrance</text>
  <text class="name" x="12" y="92">tickets/&lt;int:year&gt;/</text>
  <text class="quiet small" x="278" y="92" text-anchor="end">tickets</text>
  <text class="name" x="12" y="114">tickets/…/&lt;month:month&gt;/</text>
  <text class="quiet small" x="278" y="114" text-anchor="end">tickets</text>
  <text class="name" x="12" y="136">^plans/…$</text>
  <text class="quiet small" x="278" y="136" text-anchor="end">plan</text>
  <text class="name" x="12" y="158">files/&lt;path:name&gt;</text>
  <text class="quiet small" x="278" y="158" text-anchor="end">download</text>

  <!-- a plain include -->
  <rect class="box" x="8" y="172" width="274" height="86" rx="4"/>
  <text class="name" x="18" y="192">shop/</text>
  <text class="quiet small" x="272" y="192" text-anchor="end">no namespace: its names are lifted</text>
  <text class="name" x="34" y="216">""</text>
  <text class="quiet small" x="272" y="216" text-anchor="end">shop</text>
  <text class="name" x="34" y="240">&lt;slug:item&gt;/</text>
  <text class="quiet small" x="272" y="240" text-anchor="end">item</text>

  <!-- an include with a namespace -->
  <rect class="mark-box" x="8" y="270" width="274" height="144" rx="4"/>
  <text class="name" x="18" y="290">east/</text>
  <text class="quiet small" x="272" y="290" text-anchor="end">a resolver, namespace east</text>
  <text class="quiet small" x="272" y="306" text-anchor="end">of the application gallery</text>
  <text class="name" x="34" y="330">""</text>
  <text class="quiet small" x="272" y="330" text-anchor="end">wing</text>
  <text class="name" x="34" y="354">rooms/&lt;int:room&gt;/</text>
  <text class="quiet small" x="272" y="354" text-anchor="end">room</text>
  <text class="quiet small" x="18" y="382">west/ is filed in the same way,</text>
  <text class="quiet small" x="18" y="398">and before east/</text>

  <!-- right: the root resolver's tables -->
  <rect class="ground" x="346" y="26" width="300" height="258" rx="4"/>
  <text class="quiet small" x="358" y="46">the root resolver's tables</text>
  <text class="name" x="358" y="70">reverse_dict</text>
  <text class="name small" x="370" y="90">"entrance"</text>
  <text class="name small" x="370" y="108">"tickets"</text>
  <text class="quiet small" x="634" y="108" text-anchor="end">two candidates, the later pattern first</text>
  <text class="name small" x="370" y="126">"plan"   "download"</text>
  <text class="name small" x="370" y="150">"shop"</text>
  <text class="name small" x="634" y="150" text-anchor="end">shop/</text>
  <text class="name small" x="370" y="168">"item"</text>
  <text class="name small" x="634" y="168" text-anchor="end">shop/%(item)s/</text>
  <path class="line dashed" d="M346 182 H646"/>
  <text class="name" x="358" y="204">namespace_dict</text>
  <text class="name small" x="370" y="224">"east"</text>
  <text class="quiet small" x="634" y="224" text-anchor="end">east/, and the resolver</text>
  <text class="name small" x="370" y="242">"west"</text>
  <text class="quiet small" x="634" y="242" text-anchor="end">west/, and the resolver</text>
  <text class="name" x="358" y="268">app_dict</text>
  <text class="name small" x="440" y="268">"gallery"</text>
  <text class="quiet small" x="634" y="268" text-anchor="end">west, east</text>

  <!-- right: the namespaced resolver's own tables -->
  <rect class="mark-box" x="346" y="312" width="300" height="110" rx="4"/>
  <text class="quiet small" x="358" y="332">the tables of the resolver east/</text>
  <text class="name" x="358" y="356">reverse_dict</text>
  <text class="name small" x="370" y="376">"wing"</text>
  <text class="quiet small" x="634" y="376" text-anchor="end">the empty string</text>
  <text class="name small" x="370" y="394">"room"</text>
  <text class="name small" x="634" y="394" text-anchor="end">rooms/%(room)s/</text>
  <text class="quiet small" x="358" y="412">no east/ in front: that is in the root's namespace_dict</text>

  <!-- where each part of the tree goes -->
  <path class="line" d="M290 104 H336"/>
  <polygon class="head" points="346,104 336,99 336,109"/>
  <path class="line" d="M282 228 H314 V160 H336"/>
  <polygon class="head" points="346,160 336,155 336,165"/>
  <path class="mark-line" d="M282 290 H314 V232 H336"/>
  <polygon class="head mark" points="346,232 336,227 336,237"/>
  <path class="mark-line" d="M282 342 H314 V384 H336"/>
  <polygon class="head mark" points="346,384 336,379 336,389"/>
</svg>
