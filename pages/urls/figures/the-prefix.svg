<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 625 671">
  <!-- the request, and its way into the first station -->
  <text class="strong" x="0" y="16"><tspan class="name">GET /nl/openingstijden/</tspan>, with <tspan class="name">LocaleMiddleware</tspan></text>
  <path class="line" d="M36.5 24 V38.5"/>
  <polygon class="head" points="36.5,48.5 31.5,38.5 41.5,38.5"/>

  <!-- station 1: the middleware makes the path's language active -->
  <rect class="box" x="0.5" y="48.5" width="328" height="154" rx="4"/>
  <text class="name strong" x="12" y="70">LocaleMiddleware.process_request</text>
  <rect class="ground" x="12.5" y="84.5" width="304" height="50" rx="4"/>
  <text class="name" x="24" y="106">is_language_prefix_patterns_used</text>
  <text class="name" x="24" y="124">-&gt; (True, True)</text>
  <path class="line" d="M36.5 134.5 V148.5"/>
  <polygon class="head" points="36.5,158.5 31.5,148.5 41.5,148.5"/>
  <rect class="mark-box" x="12.5" y="158.5" width="304" height="32" rx="4"/>
  <text x="24" y="180">the path names nl: <tspan class="name">activate("nl")</tspan></text>

  <path class="line" d="M36.5 202.5 V216.5"/>
  <polygon class="head" points="36.5,226.5 31.5,216.5 41.5,216.5"/>

  <!-- station 2: the root resolver resolves the path, one matcher after another -->
  <rect class="box" x="0.5" y="226.5" width="328" height="388" rx="4"/>
  <text class="name strong" x="12" y="248">BaseHandler.resolve_request:</text>
  <text x="12" y="266">the root resolver resolves <tspan class="name">/nl/openingstijden/</tspan></text>

  <rect class="ground" x="12.5" y="280.5" width="304" height="32" rx="4"/>
  <text x="24" y="302"><tspan class="strong">the root's matcher</tspan> takes <tspan class="name">/</tspan></text>
  <path class="line" d="M36.5 312.5 V342.5"/>
  <polygon class="head" points="36.5,352.5 31.5,342.5 41.5,342.5"/>
  <text x="48" y="336"><tspan class="name">nl/openingstijden/</tspan> <tspan class="quiet">is left</tspan></text>

  <rect class="mark-box" x="12.5" y="352.5" width="304" height="68" rx="4"/>
  <text class="strong" x="24" y="374">the <tspan class="name">LocalePrefixPattern</tspan>:</text>
  <text x="24" y="392">nl is active, so its prefix is <tspan class="name">nl/</tspan></text>
  <text x="24" y="410">it takes <tspan class="name">nl/</tspan></text>
  <path class="line" d="M36.5 420.5 V450.5"/>
  <polygon class="head" points="36.5,460.5 31.5,450.5 41.5,450.5"/>
  <text x="48" y="444"><tspan class="name">openingstijden/</tspan> <tspan class="quiet">is left</tspan></text>

  <rect class="mark-box" x="12.5" y="460.5" width="304" height="68" rx="4"/>
  <text class="strong" x="24" y="482">the pattern hours:</text>
  <text x="24" y="500">its route, read under nl, is <tspan class="name">openingstijden/</tspan></text>
  <text x="24" y="518">it equals what is left: a match</text>
  <path class="line" d="M36.5 528.5 V542.5"/>
  <polygon class="head" points="36.5,552.5 31.5,542.5 41.5,542.5"/>

  <rect class="ground" x="12.5" y="552.5" width="304" height="50" rx="4"/>
  <text class="name" x="24" y="574">ResolverMatch(views.hours,</text>
  <text class="name" x="24" y="592">route='nl/openingstijden/')</text>

  <path class="line" d="M36.5 614.5 V628.5"/>
  <polygon class="head" points="36.5,638.5 31.5,628.5 41.5,628.5"/>

  <!-- station 3: the view -->
  <rect class="box" x="0.5" y="638.5" width="328" height="32" rx="4"/>
  <text class="name" x="12" y="660">views.hours(request)</text>

  <!-- beside the resolve: the same path while en is active, refused at the prefix -->
  <rect class="box" x="360.5" y="226.5" width="264" height="278" rx="4"/>
  <text class="strong" x="372" y="248">the same path,</text>
  <text x="372" y="266">resolved while en is active</text>

  <rect class="ground" x="372.5" y="280.5" width="240" height="32" rx="4"/>
  <text x="384" y="302"><tspan class="strong">the root's matcher</tspan> takes <tspan class="name">/</tspan></text>
  <path class="line" d="M396.5 312.5 V342.5"/>
  <polygon class="head" points="396.5,352.5 391.5,342.5 401.5,342.5"/>
  <text x="408" y="336"><tspan class="name">nl/openingstijden/</tspan> <tspan class="quiet">is left</tspan></text>

  <rect class="ground" x="372.5" y="352.5" width="240" height="68" rx="4"/>
  <text class="strong" x="384" y="374">the <tspan class="name">LocalePrefixPattern</tspan>:</text>
  <text x="384" y="392">en is active, so its prefix is <tspan class="name">en/</tspan></text>
  <text x="384" y="410">the path does not begin with it</text>
  <path class="line" d="M396.5 420.5 V450.5"/>
  <polygon class="head" points="396.5,460.5 391.5,450.5 401.5,450.5"/>

  <rect class="ground" x="372.5" y="460.5" width="240" height="32" rx="4"/>
  <text class="name" x="384" y="482">Resolver404</text>
</svg>
