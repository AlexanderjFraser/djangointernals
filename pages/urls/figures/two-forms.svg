<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 665 423">
  <!-- the expression, and how it is read -->
  <text x="0" y="15"><tspan class="name">^plans/(?P&lt;floor&gt;[0-9])(?:\.(?P&lt;format&gt;pdf|svg))?$</tspan><tspan class="quiet">, read from the left a piece at a time</tspan></text>

  <!-- the pieces, each over what it becomes -->
  <rect class="box" x="0.5" y="40.5" width="76" height="82" rx="4"/>
  <text class="name" x="12.5" y="61">^</text>
  <path class="line dashed" d="M0.5 72.5 H76.5"/>
  <text x="12.5" y="93">dropped</text>

  <rect class="box" x="88.5" y="40.5" width="72" height="82" rx="4"/>
  <text class="name" x="100.5" y="61">plans/</text>
  <path class="line dashed" d="M88.5 72.5 H160.5"/>
  <text x="100.5" y="93">kept</text>

  <rect class="box" x="172.5" y="40.5" width="150" height="82" rx="4"/>
  <text class="name" x="184.5" y="61">(?P&lt;floor&gt;[0-9])</text>
  <path class="line dashed" d="M172.5 72.5 H322.5"/>
  <text x="184.5" y="93">a gap, <tspan class="name mark">%(floor)s</tspan></text>
  <text x="184.5" y="111">parameter floor</text>

  <rect class="box" x="334.5" y="40.5" width="228" height="82" rx="4"/>
  <text class="name" x="346.5" y="61">(?:\.(?P&lt;format&gt;pdf|svg))?</text>
  <path class="line dashed" d="M334.5 72.5 H562.5"/>
  <text x="346.5" y="93">optional, and it holds a group:</text>
  <text x="346.5" y="111">two ways on</text>

  <rect class="box" x="574.5" y="40.5" width="90" height="82" rx="4"/>
  <text class="name" x="586.5" y="61">$</text>
  <path class="line dashed" d="M574.5 72.5 H664.5"/>
  <text x="586.5" y="93">the reading</text>
  <text x="586.5" y="111">ends here</text>

  <!-- the fork at the optional part -->
  <path class="line" d="M448.5 122.5 V146.5"/>
  <path class="line" d="M155.5 160.5 V146.5 H499.5 V160.5"/>
  <polygon class="head" points="155.5,170.5 150.5,160.5 160.5,160.5"/>
  <polygon class="head" points="499.5,170.5 494.5,160.5 504.5,160.5"/>

  <!-- left out -->
  <rect class="ground" x="0.5" y="170.5" width="310" height="52" rx="4"/>
  <text class="strong" x="12.5" y="192">left out</text>
  <text class="quiet" x="12.5" y="210">nothing</text>

  <!-- kept once -->
  <rect class="ground" x="334.5" y="170.5" width="330" height="128" rx="4"/>
  <text class="strong" x="346.5" y="192">kept once</text>
  <rect class="box" x="346.5" y="204.5" width="94" height="82" rx="4"/>
  <text class="name" x="358.5" y="225">\.</text>
  <path class="line dashed" d="M346.5 236.5 H440.5"/>
  <text x="358.5" y="257">kept as <tspan class="name">.</tspan></text>
  <rect class="box" x="452.5" y="204.5" width="200" height="82" rx="4"/>
  <text class="name" x="464.5" y="225">(?P&lt;format&gt;pdf|svg)</text>
  <path class="line dashed" d="M452.5 236.5 H652.5"/>
  <text x="464.5" y="257">a gap, <tspan class="name mark">%(format)s</tspan></text>
  <text x="464.5" y="275">parameter format</text>

  <!-- each branch ends as one form -->
  <path class="line" d="M155.5 222.5 V336.5"/>
  <polygon class="head" points="155.5,346.5 150.5,336.5 160.5,336.5"/>
  <path class="line" d="M499.5 298.5 V336.5"/>
  <polygon class="head" points="499.5,346.5 494.5,336.5 504.5,336.5"/>
  <text x="327.5" y="327" text-anchor="middle"><tspan class="strong">the forms</tspan>, one for each way</text>

  <!-- the form left out gives -->
  <rect class="box" x="0.5" y="346.5" width="310" height="76" rx="4"/>
  <rect class="ground" x="12.5" y="358.5" width="67" height="32" rx="4"/>
  <text class="name" x="22.5" y="379">plans/</text>
  <rect class="mark-box" x="82.5" y="358.5" width="90" height="32" rx="4"/>
  <text class="name" x="92.5" y="379">%(floor)s</text>
  <text class="quiet" x="12.5" y="410">parameters floor</text>

  <!-- the form kept once gives -->
  <rect class="box" x="334.5" y="346.5" width="330" height="76" rx="4"/>
  <rect class="ground" x="346.5" y="358.5" width="67" height="32" rx="4"/>
  <text class="name" x="356.5" y="379">plans/</text>
  <rect class="mark-box" x="416.5" y="358.5" width="90" height="32" rx="4"/>
  <text class="name" x="426.5" y="379">%(floor)s</text>
  <rect class="ground" x="509.5" y="358.5" width="28" height="32" rx="4"/>
  <text class="name" x="519.5" y="379">.</text>
  <rect class="mark-box" x="540.5" y="358.5" width="98" height="32" rx="4"/>
  <text class="name" x="550.5" y="379">%(format)s</text>
  <text class="quiet" x="346.5" y="410">parameters floor, format</text>
</svg>
