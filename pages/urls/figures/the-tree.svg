<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 378">
  <!-- what is left of the path at each level, and what takes the front of it -->
  <text class="name" x="0" y="13">/east/rooms/12/</text>
  <text class="quiet small" x="150" y="13">the root resolver's own matcher takes the slash</text>
  <text class="name" x="0" y="33">east/rooms/12/</text>
  <text class="quiet small" x="150" y="33">the resolver east/ takes east/</text>
  <text class="name" x="0" y="53">rooms/12/</text>
  <text class="quiet small" x="150" y="53">the pattern rooms/&lt;int:room&gt;/ takes all of it, and room is 12</text>

  <!-- the root resolver and its list -->
  <rect class="ground" x="0" y="74" width="352" height="238" rx="4"/>
  <text class="strong" x="12" y="96">URLResolver</text>
  <text class="name" x="102" y="96">^/</text>
  <text class="quiet small" x="340" y="96" text-anchor="end">urlpatterns of museum.urls</text>
  <path class="line" d="M0 108 H352"/>

  <text class="name" x="12" y="128">""</text>
  <text class="quiet small" x="340" y="128" text-anchor="end">entrance</text>
  <text class="name" x="12" y="152">tickets/&lt;int:year&gt;/</text>
  <text class="quiet small" x="340" y="152" text-anchor="end">tickets</text>
  <text class="name" x="12" y="176">tickets/&lt;int:year&gt;/&lt;month:month&gt;/</text>
  <text class="quiet small" x="340" y="176" text-anchor="end">tickets</text>

  <rect class="mark-box" x="6" y="184" width="340" height="24" rx="3"/>
  <text class="name" x="12" y="200">east/</text>
  <text class="quiet small" x="340" y="200" text-anchor="end">a resolver: namespace east, wing="east"</text>
  <text class="name" x="12" y="224">west/</text>
  <text class="quiet small" x="340" y="224" text-anchor="end">a resolver: namespace west, wing="west"</text>
  <text class="name" x="12" y="248">shop/</text>
  <text class="quiet small" x="340" y="248" text-anchor="end">a resolver of two patterns</text>
  <text class="name" x="12" y="272">^plans/…$</text>
  <text class="quiet small" x="340" y="272" text-anchor="end">plan, a regular expression</text>
  <text class="name" x="12" y="296">files/&lt;path:name&gt;</text>
  <text class="quiet small" x="340" y="296" text-anchor="end">download</text>

  <!-- the one list the two wings' resolvers hold -->
  <rect class="ground" x="392" y="176" width="254" height="124" rx="4"/>
  <text class="quiet small" x="404" y="197">urlpatterns of museum.gallery.urls</text>
  <path class="line" d="M392 208 H646"/>
  <text class="name" x="404" y="228">""</text>
  <text class="quiet small" x="634" y="228" text-anchor="end">wing</text>
  <rect class="mark-box" x="398" y="236" width="242" height="24" rx="3"/>
  <text class="name" x="404" y="252">rooms/&lt;int:room&gt;/</text>
  <text class="quiet small" x="634" y="252" text-anchor="end">room</text>
  <text class="name" x="404" y="276">rooms/&lt;int:room&gt;/audio/</text>
  <text class="quiet small" x="404" y="291">a resolver of one pattern</text>

  <!-- east/ leads into the list, and west/ into the same one -->
  <path class="line dashed" d="M352 220 H368 V196"/>
  <path class="mark-line" d="M352 196 H382"/>
  <polygon class="head mark" points="392,196 382,191 382,201"/>

  <!-- the match -->
  <path class="mark-line" d="M614 260 V324"/>
  <polygon class="head mark" points="614,334 609,324 619,324"/>
  <rect class="mark-box" x="392" y="334" width="254" height="44" rx="4"/>
  <text class="small" x="404" y="352">the view room is called with</text>
  <text class="name" x="404" y="369">wing="east", room=12</text>

  <text class="quiet small" x="0" y="336">each list is tried from the top,</text>
  <text class="quiet small" x="0" y="352">and the first entry that matches is taken;</text>
  <text class="quiet small" x="0" y="368">the word at the right of a pattern is its name</text>
</svg>
