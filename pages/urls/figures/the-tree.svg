<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 860 513">
  <!-- the path arrives at the root resolver, whose own matcher takes the slash -->
  <text class="name strong" x="0" y="30">/east/rooms/12/</text>
  <path class="mark-line" d="M125 25.5 H135.5"/>
  <polygon class="head mark" points="145.5,25.5 135.5,20.5 135.5,30.5"/>
  <rect class="mark-box" x="145.5" y="0.5" width="355" height="50" rx="4"/>
  <text class="strong" x="158" y="22">the root resolver</text>
  <text class="quiet" x="488" y="22" text-anchor="end">its matcher <tspan class="name">^/</tspan></text>
  <text class="quiet" x="158" y="40">the root's matcher takes <tspan class="name">/</tspan></text>
  <text class="quiet" x="488" y="40" text-anchor="end"><tspan class="name">east/rooms/12/</tspan> is left</text>
  <path class="mark-line" d="M323 50.5 V64.5"/>
  <polygon class="head mark" points="323,74.5 318,64.5 328,64.5"/>

  <!-- how lists are read -->
  <text class="quiet" x="859" y="22" text-anchor="end">each list is tried from the top,</text>
  <text class="quiet" x="859" y="40" text-anchor="end">and the first entry that matches is taken</text>

  <!-- the root resolver's list -->
  <rect class="ground" x="0.5" y="74.5" width="414" height="304" rx="4"/>
  <text class="strong" x="12" y="96">the urlpatterns of museum.urls</text>
  <path class="line" d="M0.5 108.5 H414.5"/>
  <text class="name" x="12" y="130">""</text>
  <text class="quiet" x="402" y="130" text-anchor="end">a pattern: entrance</text>
  <text class="name" x="12" y="158">tickets/&lt;int:year&gt;/</text>
  <text class="quiet" x="402" y="158" text-anchor="end">a pattern: tickets</text>
  <text class="name" x="12" y="186">tickets/&lt;int:year&gt;/&lt;month:month&gt;/</text>
  <text class="quiet" x="402" y="186" text-anchor="end">a pattern: tickets</text>
  <rect class="mark-box" x="6.5" y="197.5" width="402" height="44" rx="3"/>
  <text class="name" x="12" y="214">east/</text>
  <text class="quiet" x="402" y="214" text-anchor="end">a resolver: namespace east, <tspan class="name">wing="east"</tspan></text>
  <text class="quiet" x="12" y="232">the resolver <tspan class="name">east/</tspan> takes <tspan class="name">east/</tspan></text>
  <text class="quiet" x="402" y="232" text-anchor="end"><tspan class="name">rooms/12/</tspan> is left</text>
  <text class="name" x="12" y="260">west/</text>
  <text class="quiet" x="402" y="260" text-anchor="end">a resolver: namespace west, <tspan class="name">wing="west"</tspan></text>
  <text class="name" x="12" y="288">shop/</text>
  <text class="quiet" x="402" y="288" text-anchor="end">a resolver</text>
  <text class="name" x="12" y="316">^plans/(?P&lt;floor&gt;[0-9])(?:\.(?P&lt;format&gt;pdf|svg))?$</text>
  <text class="quiet" x="402" y="334" text-anchor="end">a pattern: plan, written as a regular expression</text>
  <text class="name" x="12" y="362">files/&lt;path:name&gt;</text>
  <text class="quiet" x="402" y="362" text-anchor="end">a pattern: download</text>

  <!-- east/ and west/ hold one list: two arrows into it -->
  <path class="mark-line" d="M408.5 219.5 H444.5"/>
  <polygon class="head mark" points="454.5,219.5 444.5,214.5 444.5,224.5"/>
  <path class="line" d="M414.5 255.5 H444.5"/>
  <polygon class="head" points="454.5,255.5 444.5,250.5 444.5,260.5"/>

  <!-- the gallery's list -->
  <rect class="ground" x="454.5" y="197.5" width="260" height="219" rx="4"/>
  <text class="strong" x="466" y="220">the urlpatterns of</text>
  <text class="strong" x="466" y="238">museum.gallery.urls</text>
  <text class="quiet" x="466" y="256">application namespace gallery</text>
  <path class="line" d="M454.5 267.5 H714.5"/>
  <text class="name" x="466" y="290">""</text>
  <text class="quiet" x="702" y="290" text-anchor="end">a pattern: wing</text>
  <rect class="mark-box" x="460.5" y="301.5" width="248" height="62" rx="3"/>
  <text class="name" x="466" y="318">rooms/&lt;int:room&gt;/</text>
  <text class="quiet" x="702" y="318" text-anchor="end">a pattern: room</text>
  <text class="quiet" x="466" y="336">the pattern <tspan class="name">rooms/&lt;int:room&gt;/</tspan> takes</text>
  <text class="quiet" x="466" y="354">all of <tspan class="name">rooms/12/</tspan>, and room is 12</text>
  <text class="name" x="466" y="382">rooms/&lt;int:room&gt;/audio/</text>
  <text class="quiet" x="466" y="400">a resolver: namespace audio</text>

  <!-- the view -->
  <path class="mark-line" d="M708.5 332.5 H724.5"/>
  <polygon class="head mark" points="734.5,332.5 724.5,327.5 724.5,337.5"/>
  <rect class="mark-box" x="734.5" y="289.5" width="125" height="86" rx="4"/>
  <text x="746" y="311">the view room</text>
  <text x="746" y="329">is called with</text>
  <text class="name" x="746" y="347">wing="east",</text>
  <text class="name" x="746" y="365">room=12</text>

  <!-- shop/ holds shop_patterns -->
  <path class="line" d="M414.5 283.5 H434.5 V429.5 H424.5"/>
  <polygon class="head" points="414.5,429.5 424.5,424.5 424.5,434.5"/>
  <rect class="ground" x="154.5" y="412.5" width="260" height="100" rx="4"/>
  <text class="strong" x="166" y="434">shop_patterns</text>
  <path class="line" d="M154.5 446.5 H414.5"/>
  <text class="name" x="166" y="468">""</text>
  <text class="quiet" x="402" y="468" text-anchor="end">a pattern: shop</text>
  <text class="name" x="166" y="496">&lt;slug:item&gt;/</text>
  <text class="quiet" x="402" y="496" text-anchor="end">a pattern: item</text>

  <!-- the audio resolver holds audio_patterns -->
  <path class="line" d="M584.5 416.5 V430.5"/>
  <polygon class="head" points="584.5,440.5 579.5,430.5 589.5,430.5"/>
  <rect class="ground" x="454.5" y="440.5" width="260" height="72" rx="4"/>
  <text class="strong" x="466" y="462">audio_patterns</text>
  <path class="line" d="M454.5 474.5 H714.5"/>
  <text class="name" x="466" y="496">&lt;slug:track&gt;/</text>
  <text class="quiet" x="702" y="496" text-anchor="end">a pattern: track</text>
</svg>
