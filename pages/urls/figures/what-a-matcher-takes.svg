<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 823 344">
  <!-- the key -->
  <text class="quiet" x="0" y="15">a matcher is given what is left of the path; the part it accepts is accented</text>
  <path class="line" d="M0 31.5 H823"/>

  <!-- a pattern's route: all of the text -->
  <text x="0" y="56"><tspan class="strong">a pattern's route</tspan>: all of the text</text>
  <text x="0" y="74"><tspan class="name">tickets/&lt;int:year&gt;/</tspan>, expanded to <tspan class="name">^tickets/(?P&lt;year&gt;[0-9]+)/\Z</tspan></text>
  <text class="quiet" x="0" y="92">without parameters, the route must equal the text</text>
  <rect class="mark-box" x="484.5" y="53.5" width="122" height="32" rx="4"/>
  <text class="name" x="494.5" y="74">tickets/2026/</text>
  <text class="quiet" x="630" y="74">refuses</text>
  <rect class="ground dashed" x="684.5" y="53.5" width="137" height="32" rx="4"/>
  <text class="name quiet" x="694.5" y="74">tickets/2026/\n</text>
  <path class="line" d="M0 109.5 H823"/>

  <!-- a resolver's route: a beginning -->
  <text x="0" y="134"><tspan class="strong">a resolver's route</tspan>: a beginning, the rest left for its list</text>
  <text x="0" y="152"><tspan class="name">east/</tspan>, compared with the start of the text</text>
  <text class="quiet" x="0" y="170">with parameters, an expression that begins with <tspan class="name">^</tspan> and has no <tspan class="name">\Z</tspan></text>
  <rect class="mark-box" x="484.5" y="131.5" width="59" height="32" rx="4"/>
  <text class="name" x="494.5" y="152">east/</text>
  <rect class="ground" x="546.5" y="131.5" width="91" height="32" rx="4"/>
  <text class="name quiet" x="556.5" y="152">rooms/12/</text>
  <path class="line" d="M0 187.5 H823"/>

  <!-- a pattern's expression that ends in $: all of the text -->
  <text x="0" y="212"><tspan class="strong">a pattern's expression that ends in <tspan class="name">$</tspan></tspan>: all of the text, by <tspan class="name">fullmatch</tspan></text>
  <text class="name" x="0" y="230">cafe/$</text>
  <rect class="mark-box" x="484.5" y="209.5" width="59" height="32" rx="4"/>
  <text class="name" x="494.5" y="230">cafe/</text>
  <text class="quiet" x="630" y="230">refuses</text>
  <rect class="ground dashed" x="684.5" y="209.5" width="114" height="32" rx="4"/>
  <text class="name quiet" x="694.5" y="230">ground/cafe/</text>
  <path class="line" d="M0 265.5 H823"/>

  <!-- any other expression: wherever search finds it -->
  <text x="0" y="290"><tspan class="strong">any other expression</tspan>: wherever <tspan class="name">search</tspan> finds it</text>
  <text class="name" x="0" y="308">lift/</text>
  <rect class="ground" x="484.5" y="287.5" width="75" height="32" rx="4"/>
  <text class="name quiet" x="494.5" y="308">ground/</text>
  <rect class="mark-box" x="562.5" y="287.5" width="59" height="32" rx="4"/>
  <text class="name" x="572.5" y="308">lift/</text>
  <rect class="ground" x="624.5" y="287.5" width="36" height="32" rx="4"/>
  <text class="name quiet" x="634.5" y="308">up</text>
  <path class="line" d="M0 343.5 H823"/>
</svg>
