<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 841 495">
  <!-- the three columns' headings -->
  <text class="quiet" x="0" y="14">the readers, in the order</text>
  <text class="quiet" x="0" y="32">a process can meet them</text>
  <text class="quiet" x="482.5" y="32" text-anchor="middle">the property</text>
  <text class="quiet" x="592" y="14">how the import ends,</text>
  <text class="quiet" x="592" y="32">and what the property keeps</text>

  <!-- a management command that runs the checks -->
  <rect class="ground" x="0.5" y="48.5" width="302" height="90" rx="4"/>
  <text class="strong" x="12" y="70">a management command that runs</text>
  <text class="strong" x="12" y="88">the system checks, before its work</text>
  <path class="line" d="M0.5 100.5 H302.5"/>
  <text x="12" y="122"><tspan class="name">check_url_config</tspan> → <tspan class="name">URLResolver.check</tspan></text>

  <!-- runserver's autoreloader -->
  <rect class="ground" x="0.5" y="154.5" width="302" height="90" rx="4"/>
  <text class="strong" x="12" y="176">runserver's autoreloader,</text>
  <text class="strong" x="12" y="194">once the applications are ready</text>
  <path class="line" d="M0.5 206.5 H302.5"/>
  <text class="name" x="12" y="228">BaseReloader.run</text>

  <!-- a request -->
  <rect class="ground" x="0.5" y="260.5" width="302" height="146" rx="4"/>
  <text class="strong" x="12" y="282">a request</text>
  <path class="line" d="M0.5 294.5 H302.5"/>
  <text class="name" x="12" y="316">LocaleMiddleware.process_request</text>
  <text class="name" x="12" y="344">URLResolver.resolve</text>
  <text x="12" y="372"><tspan class="name">URLResolver.resolve_error_handler</tspan>,</text>
  <text class="quiet" x="12" y="390">for an error view</text>

  <!-- the first reverse -->
  <rect class="ground" x="0.5" y="422.5" width="302" height="72" rx="4"/>
  <text class="strong" x="12" y="444">the first <tspan class="name">reverse</tspan>, to build its tables</text>
  <path class="line" d="M0.5 456.5 H302.5"/>
  <text class="name" x="12" y="478">reverse</text>

  <!-- each reader's read of the property, through url_patterns or directly -->
  <text class="name small" x="352.5" y="111" text-anchor="middle">url_patterns</text>
  <path class="line" d="M302.5 117.5 H402.5"/>
  <polygon class="head" points="412.5,117.5 402.5,112.5 402.5,122.5"/>
  <path class="line" d="M302.5 223.5 H402.5"/>
  <polygon class="head" points="412.5,223.5 402.5,218.5 402.5,228.5"/>
  <text class="name small" x="352.5" y="305" text-anchor="middle">url_patterns</text>
  <path class="line" d="M302.5 311.5 H402.5"/>
  <polygon class="head" points="412.5,311.5 402.5,306.5 402.5,316.5"/>
  <text class="name small" x="352.5" y="333" text-anchor="middle">url_patterns</text>
  <path class="line" d="M302.5 339.5 H402.5"/>
  <polygon class="head" points="412.5,339.5 402.5,334.5 402.5,344.5"/>
  <path class="line" d="M302.5 367.5 H402.5"/>
  <polygon class="head" points="412.5,367.5 402.5,362.5 402.5,372.5"/>
  <text class="name small" x="352.5" y="467" text-anchor="middle">url_patterns</text>
  <path class="line" d="M302.5 473.5 H402.5"/>
  <polygon class="head" points="412.5,473.5 402.5,468.5 402.5,478.5"/>

  <!-- the property -->
  <rect class="mark-box" x="412.5" y="48.5" width="140" height="446" rx="4"/>
  <text class="name strong" x="482.5" y="258" text-anchor="middle">URLResolver.</text>
  <text class="name strong" x="482.5" y="276" text-anchor="middle">urlconf_module</text>
  <text class="quiet" x="482.5" y="294" text-anchor="middle">of the root resolver</text>

  <!-- what it keeps, by how the import ends -->
  <path class="line" d="M552.5 138.5 H582.5"/>
  <polygon class="head" points="592.5,138.5 582.5,133.5 582.5,143.5"/>
  <rect class="ground" x="592.5" y="93.5" width="248" height="90" rx="4"/>
  <text class="strong" x="604" y="115">the module is imported</text>
  <path class="line" d="M592.5 127.5 H840.5"/>
  <text x="604" y="149">the module, kept:</text>
  <text x="604" y="167">no later reader imports it</text>

  <path class="line" d="M552.5 244.5 H582.5"/>
  <polygon class="head" points="592.5,244.5 582.5,239.5 582.5,249.5"/>
  <rect class="ground" x="592.5" y="199.5" width="248" height="90" rx="4"/>
  <text class="strong" x="604" y="221">the import raises</text>
  <path class="line" d="M592.5 233.5 H840.5"/>
  <text x="604" y="255">nothing:</text>
  <text x="604" y="273">the next reader imports it again</text>

  <path class="line" d="M552.5 377.5 H582.5"/>
  <polygon class="head" points="592.5,377.5 582.5,372.5 582.5,382.5"/>
  <rect class="ground" x="592.5" y="305.5" width="248" height="144" rx="4"/>
  <text class="strong" x="604" y="327">the URLconf calls <tspan class="name">reverse</tspan></text>
  <text class="strong" x="604" y="345">as it is imported</text>
  <path class="line" d="M592.5 357.5 H840.5"/>
  <text x="604" y="379">the module as far as it was imported,</text>
  <text x="604" y="397">kept, with no list:</text>
  <text x="604" y="415">every later read of <tspan class="name">url_patterns</tspan></text>
  <text x="604" y="433">raises <tspan class="name">ImproperlyConfigured</tspan></text>
</svg>
