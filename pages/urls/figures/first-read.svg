<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 777 625">
  <!-- the readers' heading -->
  <text class="quiet" x="0" y="14">the readers, in the order a process can meet them</text>

  <!-- a management command that runs the checks -->
  <rect class="ground" x="0.5" y="28.5" width="552" height="50" rx="4"/>
  <text class="strong" x="12" y="50">a management command that runs</text>
  <text class="strong" x="12" y="68">the system checks, before its work</text>
  <path class="line" d="M252.5 28.5 V78.5"/>
  <text x="264" y="50"><tspan class="name">check_url_config</tspan> → <tspan class="name">URLResolver.check</tspan></text>

  <!-- runserver's autoreloader -->
  <rect class="ground" x="0.5" y="90.5" width="552" height="50" rx="4"/>
  <text class="strong" x="12" y="112">runserver's autoreloader,</text>
  <text class="strong" x="12" y="130">once the applications are ready</text>
  <path class="line" d="M252.5 90.5 V140.5"/>
  <text class="name" x="264" y="112">BaseReloader.run</text>

  <!-- a request -->
  <rect class="ground" x="0.5" y="152.5" width="552" height="106" rx="4"/>
  <text class="strong" x="12" y="174">a request</text>
  <path class="line" d="M252.5 152.5 V258.5"/>
  <text class="name" x="264" y="174">LocaleMiddleware.process_request</text>
  <text class="name" x="264" y="202">URLResolver.resolve</text>
  <text x="264" y="230"><tspan class="name">URLResolver.resolve_error_handler</tspan>,</text>
  <text class="quiet" x="264" y="248">for an error view</text>

  <!-- the first reverse -->
  <rect class="ground" x="0.5" y="270.5" width="552" height="50" rx="4"/>
  <text class="strong" x="12" y="292">the first <tspan class="name">reverse</tspan>,</text>
  <text class="strong" x="12" y="310">to build its tables</text>
  <path class="line" d="M252.5 270.5 V320.5"/>
  <text class="name" x="264" y="292">reverse</text>

  <!-- each reader's read, through url_patterns or directly, all joining one line into the property -->
  <text class="name small" x="612.5" y="39" text-anchor="middle">url_patterns</text>
  <path class="line" d="M552.5 45.5 H672.5 V369.5 H512.5"/>
  <path class="line" d="M552.5 107.5 H672.5"/>
  <text class="name small" x="612.5" y="163" text-anchor="middle">url_patterns</text>
  <path class="line" d="M552.5 169.5 H672.5"/>
  <text class="name small" x="612.5" y="191" text-anchor="middle">url_patterns</text>
  <path class="line" d="M552.5 197.5 H672.5"/>
  <path class="line" d="M552.5 225.5 H672.5"/>
  <text class="name small" x="612.5" y="281" text-anchor="middle">url_patterns</text>
  <path class="line" d="M552.5 287.5 H672.5"/>
  <polygon class="head" points="502.5,369.5 512.5,364.5 512.5,374.5"/>

  <!-- the property -->
  <text class="quiet" x="0" y="366">the property</text>
  <rect class="mark-box" x="274.5" y="344.5" width="228" height="50" rx="4"/>
  <text class="name strong" x="388.5" y="366" text-anchor="middle">URLResolver.urlconf_module</text>
  <text class="quiet" x="388.5" y="384" text-anchor="middle">of the root resolver</text>

  <!-- the fork: how the import ends -->
  <text class="quiet" x="0" y="418">how the import ends,</text>
  <text class="quiet" x="0" y="436">and what the property keeps</text>
  <path class="line" d="M388.5 394.5 V470.5"/>
  <path class="line" d="M124.5 470.5 V456.5 H652.5 V470.5"/>
  <polygon class="head" points="124.5,480.5 119.5,470.5 129.5,470.5"/>
  <polygon class="head" points="388.5,480.5 383.5,470.5 393.5,470.5"/>
  <polygon class="head" points="652.5,480.5 647.5,470.5 657.5,470.5"/>

  <!-- the module is imported -->
  <rect class="ground" x="0.5" y="480.5" width="248" height="108" rx="4"/>
  <text class="strong" x="12" y="511">the module is imported</text>
  <path class="line" d="M0.5 532.5 H248.5"/>
  <text x="12" y="554">the module, kept:</text>
  <text x="12" y="572">no later reader imports it</text>

  <!-- the import raises -->
  <rect class="ground" x="264.5" y="480.5" width="248" height="108" rx="4"/>
  <text class="strong" x="276" y="511">the import raises</text>
  <path class="line" d="M264.5 532.5 H512.5"/>
  <text x="276" y="554">nothing:</text>
  <text x="276" y="572">the next reader imports it again</text>

  <!-- the URLconf calls reverse as it is imported -->
  <rect class="ground" x="528.5" y="480.5" width="248" height="144" rx="4"/>
  <text class="strong" x="540" y="502">the URLconf calls <tspan class="name">reverse</tspan></text>
  <text class="strong" x="540" y="520">above its <tspan class="name">urlpatterns</tspan></text>
  <path class="line" d="M528.5 532.5 H776.5"/>
  <text x="540" y="554">the module as far as it was imported,</text>
  <text x="540" y="572">kept, with no list:</text>
  <text x="540" y="590">every later read of <tspan class="name">url_patterns</tspan></text>
  <text x="540" y="608">raises <tspan class="name">ImproperlyConfigured</tspan></text>
</svg>
