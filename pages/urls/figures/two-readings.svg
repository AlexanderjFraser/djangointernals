<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 318">
  <!-- the route as written -->
  <rect class="ground" x="0" y="0" width="646" height="48" rx="4"/>
  <text class="quiet small" x="12" y="18">the route, as written in the URLconf</text>
  <text class="name" x="12" y="38">tickets/&lt;int:year&gt;/&lt;month:month&gt;/</text>

  <path class="line" d="M40 48 V72"/>
  <polygon class="head" points="40,82 35,72 45,72"/>
  <text class="name small" x="54" y="64">_route_to_regex</text>
  <text class="quiet small" x="172" y="64">when the URLconf is imported</text>

  <!-- the form it is resolved with -->
  <rect class="box" x="0" y="82" width="646" height="96" rx="4"/>
  <text class="strong" x="12" y="103">to resolve a path</text>
  <text class="quiet small" x="634" y="103" text-anchor="end">each parameter is a named group, holding its converter's expression</text>
  <text class="name" x="12" y="125">^tickets/(?P&lt;year&gt;[0-9]+)/(?P&lt;month&gt;[0-9]{2})/\Z</text>
  <path class="line dashed" d="M0 138 H646"/>
  <text class="name" x="12" y="163">tickets/2026/03/</text>
  <path class="line" d="M150 159 H186"/>
  <polygon class="head" points="196,159 186,154 186,164"/>
  <text class="name" x="206" y="163">"2026"  "03"</text>
  <path class="line" d="M310 159 H406"/>
  <polygon class="head" points="416,159 406,154 406,164"/>
  <text class="name small" x="358" y="152" text-anchor="middle">to_python</text>
  <text class="name" x="426" y="163">year=2026, month=3</text>

  <path class="line" d="M40 178 V202"/>
  <polygon class="head" points="40,212 35,202 45,202"/>
  <text class="name small" x="54" y="194">normalize</text>
  <text class="quiet small" x="130" y="194">when a name is first reversed</text>

  <!-- the form it is reversed with -->
  <rect class="box" x="0" y="212" width="646" height="96" rx="4"/>
  <text class="strong" x="12" y="233">to reverse a name</text>
  <text class="quiet small" x="634" y="233" text-anchor="end">each parameter is a gap to fill in: year, month</text>
  <text class="name" x="12" y="255">tickets/%(year)s/%(month)s/</text>
  <path class="line dashed" d="M0 268 H646"/>
  <text class="name" x="12" y="293">tickets/2026/03/</text>
  <path class="mark-line" d="M160 289 H196"/>
  <polygon class="head mark" points="150,289 160,284 160,294"/>
  <text class="name" x="206" y="293">"2026"  "03"</text>
  <path class="mark-line" d="M320 289 H416"/>
  <polygon class="head mark" points="310,289 320,284 320,294"/>
  <text class="name small" x="363" y="282" text-anchor="middle">to_url</text>
  <text class="name" x="426" y="293">year=2026, month=3</text>
</svg>
