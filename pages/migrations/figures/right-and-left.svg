<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 447">
  <!-- two lists, one above the other. In each: the list as three operations in a row, an arrow in a gap
       where one was asked about the next, with its answer; under the row, the two that fold run together
       into the merged operation, which stands in the column of one of them; the operation between keeps its column -->

  <!-- to the right: the list -->
  <text class="strong" x="0" y="14">To the right</text>
  <rect class="box" x="0.5" y="28.5" width="157" height="74" rx="4"/>
  <text class="name" x="12.5" y="61">CreateModel Crane</text>
  <text class="name" x="12.5" y="81">(id)</text>
  <rect class="box" x="244.5" y="28.5" width="157" height="74" rx="4"/>
  <text class="name" x="256.5" y="61">CreateModel Hook</text>
  <text class="name" x="256.5" y="81">(id)</text>
  <rect class="box" x="488.5" y="28.5" width="157" height="74" rx="4"/>
  <text class="name" x="500.5" y="51">AddField hook</text>
  <text x="500.5" y="71">to <tspan class="name">crane</tspan></text>
  <text class="quiet small" x="500.5" y="89">a foreign key to Hook</text>

  <!-- Crane's CreateModel asked about Hook's -->
  <path class="line" d="M157.5 65.5 H234.5"/>
  <polygon class="head" points="244.5,65.5 234.5,60.5 234.5,70.5"/>
  <text class="quiet small" x="196" y="58" text-anchor="middle">asked about</text>
  <text class="name strong" x="196" y="83" text-anchor="middle">True</text>

  <!-- the earlier operation goes across to the later one's place -->
  <path class="mark-line" d="M79 102.5 V122.5 H567"/>
  <path class="mark-line" d="M567 102.5 V142.5"/>
  <polygon class="head mark" points="567,152.5 562,142.5 572,142.5"/>
  <text class="quiet small" x="581" y="143">becomes</text>

  <!-- what the list becomes -->
  <rect class="box" x="244.5" y="152.5" width="157" height="56" rx="4"/>
  <text class="name" x="256.5" y="176">CreateModel Hook</text>
  <text class="name" x="256.5" y="196">(id)</text>
  <rect class="mark-box" x="488.5" y="152.5" width="157" height="56" rx="4"/>
  <text class="name" x="500.5" y="176">CreateModel Crane</text>
  <text class="name" x="500.5" y="196">(id, hook)</text>

  <!-- to the left: the list -->
  <text class="strong" x="0" y="252">To the left</text>
  <rect class="box" x="0.5" y="266.5" width="157" height="74" rx="4"/>
  <text class="name" x="12.5" y="299">CreateModel Crane</text>
  <text class="name" x="12.5" y="319">(id)</text>
  <rect class="box" x="244.5" y="266.5" width="157" height="74" rx="4"/>
  <text class="name" x="256.5" y="289">CreateModel Hook</text>
  <text class="name" x="256.5" y="309">(id, crane)</text>
  <text class="quiet small" x="256.5" y="327">a foreign key to Crane</text>
  <rect class="box" x="488.5" y="266.5" width="157" height="74" rx="4"/>
  <text class="name" x="500.5" y="299">AddField tonnes</text>
  <text x="500.5" y="319">to <tspan class="name">crane</tspan></text>

  <!-- Crane's CreateModel asked about Hook's, and Hook's about the AddField -->
  <path class="line" d="M157.5 303.5 H234.5"/>
  <polygon class="head" points="244.5,303.5 234.5,298.5 234.5,308.5"/>
  <text class="quiet small" x="196" y="296" text-anchor="middle">asked about</text>
  <text class="name strong" x="196" y="321" text-anchor="middle">False</text>
  <path class="line" d="M401.5 303.5 H478.5"/>
  <polygon class="head" points="488.5,303.5 478.5,298.5 478.5,308.5"/>
  <text class="quiet small" x="440" y="296" text-anchor="middle">asked about</text>
  <text class="name strong" x="440" y="321" text-anchor="middle">True</text>

  <!-- the later operation goes across to the earlier one's place -->
  <path class="mark-line" d="M567 340.5 V360.5 H79"/>
  <path class="mark-line" d="M79 340.5 V380.5"/>
  <polygon class="head mark" points="79,390.5 74,380.5 84,380.5"/>
  <text class="quiet small" x="65" y="381" text-anchor="end">becomes</text>

  <!-- what the list becomes -->
  <rect class="mark-box" x="0.5" y="390.5" width="157" height="56" rx="4"/>
  <text class="name" x="12.5" y="414">CreateModel Crane</text>
  <text class="name" x="12.5" y="434">(id, tonnes)</text>
  <rect class="box" x="244.5" y="390.5" width="157" height="56" rx="4"/>
  <text class="name" x="256.5" y="414">CreateModel Hook</text>
  <text class="name" x="256.5" y="434">(id, crane)</text>
</svg>
