<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 286">
  <!-- the two operations of the migration side by side, in the order they are listed. Each holds its two
       project states, the one its state half ran on to the right. The first pass runs left to right over
       the top and the second right to left under the bottom, where each database half takes the database
       from the right-hand state to the left-hand one -->
  <text x="0" y="14"><tspan class="name strong">Migration.unapply(state)</tspan> on <tspan class="name">yard.0001_initial</tspan></text>

  <!-- the first pass, forwards -->
  <text x="0" y="44"><tspan class="strong">First pass, forwards</tspan><tspan class="quiet small" dx="8">two clones for each operation, and its state half run on one</tspan></text>
  <path class="line" d="M0 58.5 H636"/>
  <polygon class="head" points="646,58.5 636,53.5 636,63.5"/>

  <!-- Create model Dock: its two clones, and its database half backwards -->
  <rect class="ground" x="0.5" y="72.5" width="311" height="172" rx="4"/>
  <text class="strong" x="12.5" y="94">Create model Dock</text>
  <text x="239.5" y="94" text-anchor="middle">its state half</text>
  <path class="line" d="M239.5 100 V112.5"/>
  <polygon class="head" points="239.5,122.5 234.5,112.5 244.5,112.5"/>

  <rect class="box" x="12.5" y="122.5" width="120" height="66" rx="4"/>
  <text class="strong" x="24.5" y="143">clone 4</text>
  <text class="quiet small" x="24.5" y="160">of clone 3</text>
  <text class="small" x="24.5" y="177">without Dock</text>

  <rect class="box" x="179.5" y="122.5" width="120" height="66" rx="4"/>
  <text class="strong" x="191.5" y="143">clone 3</text>
  <text class="quiet small" x="191.5" y="160">of state</text>
  <text class="small" x="191.5" y="177">with Dock</text>

  <path class="mark-line" d="M203.5 189 V212.5 H108.5 V198.5"/>
  <polygon class="head mark" points="108.5,188.5 103.5,198.5 113.5,198.5"/>
  <text class="name" x="98.5" y="206" text-anchor="end">to_state</text>
  <text class="name" x="213.5" y="206">from_state</text>
  <text class="name" x="156" y="232" text-anchor="middle">database_backwards</text>

  <!-- Create model Repair: its two clones, and its database half backwards -->
  <rect class="ground" x="334.5" y="72.5" width="311" height="172" rx="4"/>
  <text class="strong" x="346.5" y="94">Create model Repair</text>
  <text x="573.5" y="94" text-anchor="middle">its state half</text>
  <path class="line" d="M573.5 100 V112.5"/>
  <polygon class="head" points="573.5,122.5 568.5,112.5 578.5,112.5"/>

  <rect class="box" x="346.5" y="122.5" width="120" height="66" rx="4"/>
  <text class="strong" x="358.5" y="143">clone 6</text>
  <text class="quiet small" x="358.5" y="160">of clone 5</text>
  <text class="small" x="358.5" y="177">without Repair</text>

  <rect class="box" x="513.5" y="122.5" width="120" height="66" rx="4"/>
  <text class="strong" x="525.5" y="143">clone 5</text>
  <text class="quiet small" x="525.5" y="160">of clone 3</text>
  <text class="small" x="525.5" y="177">with Repair</text>

  <path class="mark-line" d="M537.5 189 V212.5 H442.5 V198.5"/>
  <polygon class="head mark" points="442.5,188.5 437.5,198.5 447.5,198.5"/>
  <text class="name" x="432.5" y="206" text-anchor="end">to_state</text>
  <text class="name" x="547.5" y="206">from_state</text>
  <text class="name" x="490" y="232" text-anchor="middle">database_backwards</text>

  <!-- the second pass, in reverse -->
  <path class="mark-line" d="M646 258.5 H10"/>
  <polygon class="head mark" points="0,258.5 10,253.5 10,263.5"/>
  <text x="646" y="280" text-anchor="end"><tspan class="strong">Second pass, in reverse</tspan><tspan class="quiet small" dx="8">each database half backwards</tspan></text>
</svg>
