<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 346">
  <!-- the graph down the page, the migration that depends on nothing at the top: fleet's under it, office's and
       yard's to either side a row lower, crew's second at the bottom; every arrow ends at a parent, and no two cross -->
  <text class="strong" x="0" y="14">Harbour's graph after the first makemigrations: 5 nodes, 7 edges</text>
  <text class="quiet small" x="0" y="32">an arrow runs from a migration to one it depends on, its parent</text>

  <!-- the five nodes -->
  <rect class="box" x="223.5" y="52.5" width="176" height="40" rx="4"/>
  <text class="name strong" x="311.5" y="77" text-anchor="middle">crew.0001_initial</text>

  <rect class="box" x="223.5" y="136.5" width="176" height="40" rx="4"/>
  <text class="name strong" x="311.5" y="161" text-anchor="middle">fleet.0001_initial</text>

  <rect class="box" x="0.5" y="220.5" width="176" height="40" rx="4"/>
  <text class="name strong" x="88.5" y="245" text-anchor="middle">office.0001_initial</text>

  <rect class="box" x="446.5" y="220.5" width="176" height="40" rx="4"/>
  <text class="name strong" x="534.5" y="245" text-anchor="middle">yard.0001_initial</text>

  <rect class="box" x="223.5" y="304.5" width="176" height="40" rx="4"/>
  <text class="name strong" x="311.5" y="329" text-anchor="middle">crew.0002_initial</text>

  <!-- fleet's depends on crew's first -->
  <path class="line" d="M311.5 136.5 V102.5"/>
  <polygon class="head" points="311.5,92.5 306.5,102.5 316.5,102.5"/>

  <!-- office's depends on crew's first and on fleet's -->
  <path class="line" d="M24.5 220.5 V72.5 H213.5"/>
  <polygon class="head" points="223.5,72.5 213.5,67.5 213.5,77.5"/>
  <path class="line" d="M88.5 220.5 V156.5 H213.5"/>
  <polygon class="head" points="223.5,156.5 213.5,151.5 213.5,161.5"/>

  <!-- yard's depends on fleet's alone -->
  <path class="line" d="M534.5 220.5 V156.5 H409.5"/>
  <polygon class="head" points="399.5,156.5 409.5,151.5 409.5,161.5"/>

  <!-- crew's second depends on all three: fleet's straight up, office's to the left, crew's first round the right -->
  <path class="line" d="M311.5 304.5 V186.5"/>
  <polygon class="head" points="311.5,176.5 306.5,186.5 316.5,186.5"/>
  <path class="line" d="M223.5 324.5 H88.5 V270.5"/>
  <polygon class="head" points="88.5,260.5 83.5,270.5 93.5,270.5"/>
  <path class="line" d="M399.5 324.5 H640.5 V72.5 H409.5"/>
  <polygon class="head" points="399.5,72.5 409.5,67.5 409.5,77.5"/>
</svg>
