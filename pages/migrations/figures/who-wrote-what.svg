<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 940 583">
  <!-- a migration file down the right, set as a file is set, between two rules; in the margin to its left
       a bracket over each run of lines and beside it what wrote them; in the accent, the fixed frame:
       what MIGRATION_TEMPLATE wrote, in the file and in the margin -->
  <text class="name strong" x="256" y="14">harbour/yard/migrations/0001_initial.py</text>
  <path class="line" d="M256 25.5 H940"/>
  <path class="line" d="M256 581.5 H940"/>

  <!-- the file, a line every 20; a line too long for the page is turned, and its rest stands
       after a hooked arrow; words in the sans stand for text left out -->
  <text x="256" y="48"><tspan class="name"># Generated by Django 6.2.dev20260926051415 on </tspan><tspan class="quiet">(the date and the time)</tspan></text>
  <text class="name" x="256" y="88">import django.db.models.deletion</text>
  <text class="name" x="256" y="108">from django.db import migrations, models</text>
  <text class="name mark" x="256" y="168">class Migration(migrations.Migration):</text>
  <text class="name" x="287.2" y="208">initial = True</text>
  <text class="name mark" x="287.2" y="248">dependencies = [</text>
  <text class="name" x="318.4" y="268">('fleet', '0001_initial'),</text>
  <text class="name mark" x="287.2" y="288">]</text>
  <text class="name mark" x="287.2" y="328">operations = [</text>
  <text class="name" x="318.4" y="348">migrations.CreateModel(</text>
  <text class="name" x="349.6" y="368">name='Dock',</text>
  <text class="name" x="349.6" y="388">fields=[</text>
  <text class="name" x="380.8" y="408">('id', models.BigAutoField(auto_created=True, primary_key=True,</text>
  <path class="line" d="M420.5 416 V423.5 H432.5 M429 420 l3.5 3.5 l-3.5 3.5"/>
  <text class="name" x="443.2" y="428">serialize=False, verbose_name='ID')),</text>
  <text class="name" x="380.8" y="448">('name', models.CharField(max_length=40)),</text>
  <text class="name" x="380.8" y="468">('port', models.ForeignKey(on_delete=django.db.models.deletion.CASCADE,</text>
  <path class="line" d="M420.5 476 V483.5 H432.5 M429 480 l3.5 3.5 l-3.5 3.5"/>
  <text class="name" x="443.2" y="488">to='fleet.port')),</text>
  <text class="name" x="349.6" y="508">],</text>
  <text class="name" x="318.4" y="528">),</text>
  <text class="quiet" x="318.4" y="548">(the CreateModel of Repair)</text>
  <text class="name mark" x="287.2" y="568">]</text>

  <!-- the margin: for each part a bracket over its lines, with a tick toward its label, and the label,
       which begins level with the tick and ends at 237 -->
  <!-- the comment at the head -->
  <path class="line" d="M250.5 35.5 H246.5 V52.5 H250.5 M246.5 43.5 H241.5"/>
  <text class="small" x="237" y="48" text-anchor="end"><tspan class="name small strong">MIGRATION_HEADER_TEMPLATE</tspan><tspan class="quiet">, which</tspan></text>
  <text class="quiet small" x="237" y="64" text-anchor="end"><tspan class="name small">as_string</tspan> fills with the version and the time</text>
  <!-- the imports -->
  <path class="line" d="M250.5 75.5 H246.5 V112.5 H250.5 M246.5 83.5 H241.5"/>
  <text class="small" x="237" y="88" text-anchor="end"><tspan class="strong">the imports</tspan><tspan class="quiet">: asked for by the serialized values,</tspan></text>
  <text class="quiet small" x="237" y="104" text-anchor="end">then merged and sorted by <tspan class="name small">as_string</tspan></text>
  <!-- the frame: the class line -->
  <path class="mark-line" d="M250.5 155.5 H246.5 V172.5 H250.5 M246.5 163.5 H241.5"/>
  <text class="small" x="237" y="168" text-anchor="end"><tspan class="name small strong mark">MIGRATION_TEMPLATE</tspan><tspan class="quiet">: the class line,</tspan></text>
  <text class="quiet small" x="237" y="184" text-anchor="end">and the brackets of the two lists</text>
  <!-- an attribute -->
  <path class="line" d="M250.5 195.5 H246.5 V212.5 H250.5 M246.5 203.5 H241.5"/>
  <text class="small" x="237" y="208" text-anchor="end"><tspan class="name small strong">as_string</tspan><tspan class="quiet">: written only</tspan></text>
  <text class="quiet small" x="237" y="224" text-anchor="end">where <tspan class="name small">initial</tspan> is true</text>
  <!-- the frame: the list of dependencies opens -->
  <path class="mark-line" d="M250.5 235.5 H246.5 V252.5 H250.5 M246.5 243.5 H241.5"/>
  <text class="name small strong mark" x="237" y="248" text-anchor="end">MIGRATION_TEMPLATE</text>
  <!-- a dependency -->
  <path class="line" d="M250.5 255.5 H246.5 V272.5 H250.5 M246.5 263.5 H241.5"/>
  <text class="small" x="237" y="268" text-anchor="end"><tspan class="name small strong">as_string</tspan><tspan class="quiet">: each dependency serialized,</tspan></text>
  <text class="quiet small" x="237" y="284" text-anchor="end">the lines sorted</text>
  <!-- the frame: the list of dependencies closes, and the list of operations opens -->
  <path class="mark-line" d="M250.5 275.5 H246.5 V332.5 H250.5 M246.5 303.5 H241.5"/>
  <text class="name small strong mark" x="237" y="308" text-anchor="end">MIGRATION_TEMPLATE</text>
  <!-- an operation: its class, and an argument -->
  <path class="line" d="M250.5 335.5 H246.5 V372.5 H250.5 M246.5 343.5 H241.5"/>
  <text class="small" x="237" y="348" text-anchor="end"><tspan class="name small strong">OperationWriter</tspan><tspan class="quiet">: the class, then each</tspan></text>
  <text class="quiet small" x="237" y="364" text-anchor="end">argument by name on a line of its own</text>
  <!-- an argument that is spread over lines -->
  <path class="line" d="M250.5 375.5 H246.5 V392.5 H250.5 M246.5 383.5 H241.5"/>
  <text class="small" x="237" y="388" text-anchor="end"><tspan class="name small strong">OperationWriter</tspan><tspan class="quiet">: an argument named in</tspan></text>
  <text class="quiet small" x="237" y="404" text-anchor="end"><tspan class="name small">serialization_expand_args</tspan>,</text>
  <text class="quiet small" x="237" y="420" text-anchor="end">an item to a line</text>
  <!-- the items of that argument -->
  <path class="line" d="M250.5 395.5 H246.5 V492.5 H250.5 M246.5 443.5 H241.5"/>
  <text class="small" x="237" y="448" text-anchor="end"><tspan class="strong">the serializer</tspan><tspan class="quiet">: the text of each value,</tspan></text>
  <text class="quiet small" x="237" y="464" text-anchor="end">and the import the text needs</text>
  <!-- the argument and the operation close, and the next operation -->
  <path class="line" d="M250.5 495.5 H246.5 V552.5 H250.5 M246.5 523.5 H241.5"/>
  <text class="name small strong" x="237" y="528" text-anchor="end">OperationWriter</text>
  <!-- the frame: the list of operations closes -->
  <path class="mark-line" d="M250.5 555.5 H246.5 V572.5 H250.5 M246.5 563.5 H241.5"/>
  <text class="name small strong mark" x="237" y="568" text-anchor="end">MIGRATION_TEMPLATE</text>
</svg>
