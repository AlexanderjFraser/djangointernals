<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 940 498">
  <!-- the select list as one strip of fourteen cells in four table groups; beneath it the four klass_info
       nodes, each a step lower and further right, tied to its group by a line, and joined parent to child -->
  <text x="0" y="14"><tspan class="name strong">Sailor.objects.select_related('ship__home', 'officer')</tspan>: the select list and the tree of <tspan class="name">klass_info</tspan></text>

  <!-- the officer's positions, bracketed over the strip: the sailor's four, then its own two -->
  <text class="small mark" x="515.5" y="40" text-anchor="middle">the officer's <tspan class="name small mark">select_fields</tspan>: the sailor's positions, then its own</text>
  <path class="mark-line" d="M4.5 54.5 V48.5 H258.5 V54.5"/>
  <path class="mark-line dashed" d="M258.5 48.5 H772.5"/>
  <path class="mark-line" d="M772.5 54.5 V48.5 H935.5 V54.5"/>

  <!-- the strip: position, column, table -->
  <rect class="box" x="0.5" y="60.5" width="939" height="82" rx="4"/>
  <path class="line" d="M262.5 60.5 V142.5"/>
  <path class="line" d="M600.5 60.5 V142.5"/>
  <path class="line" d="M768.5 60.5 V142.5"/>

  <text class="quiet small" text-anchor="middle" x="24.5" y="82">0</text>
  <text class="quiet small" text-anchor="middle" x="73.5" y="82">1</text>
  <text class="quiet small" text-anchor="middle" x="135.5" y="82">2</text>
  <text class="quiet small" text-anchor="middle" x="217.5" y="82">3</text>
  <text class="quiet small" text-anchor="middle" x="284.5" y="82">4</text>
  <text class="quiet small" text-anchor="middle" x="331.5" y="82">5</text>
  <text class="quiet small" text-anchor="middle" x="393.5" y="82">6</text>
  <text class="quiet small" text-anchor="middle" x="467.5" y="82">7</text>
  <text class="quiet small" text-anchor="middle" x="552.5" y="82">8</text>
  <text class="quiet small" text-anchor="middle" x="622.5" y="82">9</text>
  <text class="quiet small" text-anchor="middle" x="669.5" y="82">10</text>
  <text class="quiet small" text-anchor="middle" x="731.5" y="82">11</text>
  <text class="quiet small" text-anchor="middle" x="828" y="82">12</text>
  <text class="quiet small" text-anchor="middle" x="913.5" y="82">13</text>

  <text class="name" text-anchor="middle" x="24.5" y="104">id</text>
  <text class="name" text-anchor="middle" x="73.5" y="104">name</text>
  <text class="name" text-anchor="middle" x="135.5" y="104">ship_id</text>
  <text class="name" text-anchor="middle" x="217.5" y="104">signed_on</text>
  <text class="name" text-anchor="middle" x="284.5" y="104">id</text>
  <text class="name" text-anchor="middle" x="331.5" y="104">name</text>
  <text class="name" text-anchor="middle" x="393.5" y="104">tonnage</text>
  <text class="name" text-anchor="middle" x="467.5" y="104">home_id</text>
  <text class="name" text-anchor="middle" x="552.5" y="104">captain_id</text>
  <text class="name" text-anchor="middle" x="622.5" y="104">id</text>
  <text class="name" text-anchor="middle" x="669.5" y="104">name</text>
  <text class="name" text-anchor="middle" x="731.5" y="104">country</text>
  <text class="name" text-anchor="middle" x="828" y="104">sailor_ptr_id</text>
  <text class="name" text-anchor="middle" x="913.5" y="104">rank</text>

  <text class="name strong" x="14" y="126">crew_sailor</text>
  <text class="name strong" x="276" y="126">fleet_ship</text>
  <text class="name strong" x="614" y="126">fleet_port</text>
  <text class="name strong" x="782" y="126">crew_officer</text>

  <!-- each group to its node -->
  <path class="line" d="M14 142.5 V168.5"/>
  <path class="line" d="M276 142.5 V250.5"/>
  <path class="line" d="M614 142.5 V332.5"/>
  <path class="line" d="M782 142.5 V414.5"/>

  <!-- the root: the sailor -->
  <rect class="ground" x="0.5" y="168.5" width="227" height="58" rx="4"/>
  <text x="13" y="190"><tspan class="name">klass_info</tspan>: <tspan class="name strong">Sailor</tspan></text>
  <text class="name" x="13" y="210">select_fields [0, 1, 2, 3]</text>

  <!-- its children: the ship, and the officer the sailor may be -->
  <path class="line" d="M14 226.5 V453.5 H624.5"/>
  <polygon class="head" points="634.5,453.5 624.5,448.5 624.5,458.5"/>
  <path class="line" d="M14 279.5 H252.5"/>
  <polygon class="head" points="262.5,279.5 252.5,274.5 252.5,284.5"/>

  <rect class="ground" x="262.5" y="250.5" width="290" height="58" rx="4"/>
  <text x="275" y="272"><tspan class="name strong">Ship</tspan>, reached by <tspan class="name">Sailor.ship</tspan>, forward</text>
  <text class="name" x="275" y="292">select_fields [4, 5, 6, 7, 8]</text>

  <!-- the ship's child: its home port -->
  <path class="line" d="M276 308.5 V361.5 H474.5"/>
  <polygon class="head" points="484.5,361.5 474.5,356.5 474.5,366.5"/>

  <rect class="ground" x="484.5" y="332.5" width="272" height="58" rx="4"/>
  <text x="497" y="354"><tspan class="name strong">Port</tspan>, reached by <tspan class="name">Ship.home</tspan>, forward</text>
  <text class="name" x="497" y="374">select_fields [9, 10, 11]</text>

  <!-- the officer, reached from its parent, whose positions it puts in front of its own -->
  <rect class="ground" x="634.5" y="414.5" width="305" height="78" rx="4"/>
  <text x="647" y="436"><tspan class="name strong">Officer</tspan>, reached by <tspan class="name">Officer.sailor_ptr</tspan></text>
  <text x="647" y="456"><tspan class="name">reverse</tspan>, <tspan class="name">from_parent</tspan></text>
  <text class="name mark" x="647" y="476">select_fields [0, 1, 2, 3, 12, 13]</text>
</svg>
