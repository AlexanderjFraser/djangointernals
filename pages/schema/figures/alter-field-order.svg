<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 623">
  <!-- the eighteen steps of BaseDatabaseSchemaEditor._alter_field down the page, in four groups; on the
       right, where a thing dropped first is made again; in the accent, the steps that make a column
       not null with a default in Python -->
  <text x="0" y="14"><tspan class="name strong">BaseDatabaseSchemaEditor._alter_field</tspan>: each step only where the two fields call for it</text>

  <!-- dropped first: 1 to 5 -->
  <rect class="ground" x="0.5" y="28.5" width="645" height="161" rx="4"/>
  <text class="strong" x="14" y="51">dropped first</text>
  <text class="strong" x="34" y="75" text-anchor="end">1</text>
  <text x="44" y="75">the column's own foreign key</text>
  <text class="quiet small" x="632" y="75" text-anchor="end">made again at 15</text>
  <text class="strong" x="34" y="95" text-anchor="end">2</text>
  <text x="44" y="95">its unique constraint: it stops being unique, or becomes the primary key</text>
  <text class="strong" x="34" y="115" text-anchor="end">3</text>
  <text x="44" y="115">the foreign keys of other tables that point at it:</text>
  <text class="quiet small" x="632" y="115" text-anchor="end">made again at 16</text>
  <text x="44" y="135">it stays a key, and its type or collation changes</text>
  <text class="strong" x="34" y="155" text-anchor="end">4</text>
  <text x="44" y="155">its index: <tspan class="name">db_index</tspan> goes, or a unique constraint takes its place</text>
  <text class="strong" x="34" y="175" text-anchor="end">5</text>
  <text x="44" y="175">its check: the check its type carries changes</text>
  <text class="quiet small" x="632" y="175" text-anchor="end">the new one at 17</text>

  <!-- renamed: 6 -->
  <rect class="ground" x="0.5" y="199.5" width="645" height="61" rx="4"/>
  <text class="strong" x="14" y="222">renamed</text>
  <text class="strong" x="34" y="246" text-anchor="end">6</text>
  <text x="44" y="246">the column, and the column in every deferred statement</text>

  <!-- changed: 7 to 10 -->
  <rect class="ground" x="0.5" y="270.5" width="645" height="141" rx="4"/>
  <text class="strong" x="14" y="293">changed</text>
  <text class="quiet small" x="82" y="293">a statement each; 7 and 8 in one where <tspan class="name small">supports_combined_alters</tspan></text>
  <text class="strong" x="34" y="317" text-anchor="end">7</text>
  <text x="44" y="317">type, collation <tspan class="quiet">(and comment, on MySQL)</tspan>; the database default</text>
  <text class="strong mark" x="34" y="337" text-anchor="end">8</text>
  <text x="44" y="337"><tspan class="mark">the default set on the column</tspan> <tspan class="quiet">(null to not null, no database default)</tspan></text>
  <text class="strong mark" x="34" y="357" text-anchor="end">9</text>
  <text x="44" y="357"><tspan class="mark">the null rows set to the default, then <tspan class="name">NOT NULL</tspan></tspan> <tspan class="quiet">(with a default)</tspan></text>
  <text x="44" y="377">or <tspan class="name">NOT NULL</tspan> / <tspan class="name">NULL</tspan> with the changes of steps 7 and 8 <tspan class="quiet">(otherwise)</tspan></text>
  <text class="strong" x="34" y="397" text-anchor="end">10</text>
  <text x="44" y="397">statements for after: a changed comment; what the type change asked for</text>

  <!-- the old primary key dropped; then made again, and new: 11 to 18 -->
  <rect class="ground" x="0.5" y="421.5" width="645" height="201" rx="4"/>
  <text class="strong" x="14" y="444">the old primary key dropped; then made again, and new</text>
  <text class="strong" x="34" y="468" text-anchor="end">11</text>
  <text x="44" y="468">the primary key dropped: it stops being the primary key</text>
  <text class="strong" x="34" y="488" text-anchor="end">12</text>
  <text x="44" y="488">a unique constraint, an index: the new field needs one</text>
  <text class="strong" x="34" y="508" text-anchor="end">13</text>
  <text x="44" y="508">the primary key: it becomes the primary key</text>
  <text class="strong" x="34" y="528" text-anchor="end">14</text>
  <text x="44" y="528">the columns of other tables that point at it: altered to the new type</text>
  <text class="strong" x="34" y="548" text-anchor="end">15</text>
  <text x="44" y="548">the column's own foreign key</text>
  <text class="strong" x="34" y="568" text-anchor="end">16</text>
  <text x="44" y="568">the foreign keys of other tables</text>
  <text class="strong" x="34" y="588" text-anchor="end">17</text>
  <text x="44" y="588">the check</text>
  <text class="strong mark" x="34" y="608" text-anchor="end">18</text>
  <text class="mark" x="44" y="608">the default of step 8 dropped again</text>
</svg>
