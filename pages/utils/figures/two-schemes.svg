<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 204">
  <!-- the two forms as rows of cells aligned from the right; the attributes between them read the same
       column in both, the indices outside them differ, and index 2 (the accent) falls in another column -->

  <!-- 6.2.1: its indices above it -->
  <text class="name small quiet" text-anchor="middle" x="188" y="14">[0]</text>
  <text class="name small quiet" text-anchor="middle" x="291" y="14">[1]</text>
  <text class="name small mark" text-anchor="middle" x="394" y="14">[2]</text>
  <text class="name small quiet" text-anchor="middle" x="497" y="14">[3]</text>
  <text class="name small quiet" text-anchor="middle" x="600" y="14">[4]</text>

  <text class="strong" x="0" y="48">6.2.1</text>
  <text class="name" x="58" y="48">VERSION =</text>
  <rect class="box" x="142.5" y="24.5" width="91" height="38" rx="4"/>
  <rect class="box" x="245.5" y="24.5" width="91" height="38" rx="4"/>
  <rect class="mark-box" x="348.5" y="24.5" width="91" height="38" rx="4"/>
  <rect class="box" x="451.5" y="24.5" width="91" height="38" rx="4"/>
  <rect class="box" x="554.5" y="24.5" width="91" height="38" rx="4"/>
  <text class="name" text-anchor="middle" x="188" y="48">6</text>
  <text class="name" text-anchor="middle" x="291" y="48">2</text>
  <text class="name" text-anchor="middle" x="394" y="48">1</text>
  <text class="name" text-anchor="middle" x="497" y="48">"final"</text>
  <text class="name" text-anchor="middle" x="600" y="48">0</text>

  <!-- the attributes, which read the same column in both forms -->
  <text class="name" text-anchor="middle" x="239.5" y="87">.feature</text>
  <text class="name" text-anchor="middle" x="394" y="87">.patch</text>
  <text class="name" text-anchor="middle" x="497" y="87">.status</text>
  <text class="name" text-anchor="middle" x="600" y="87">.iteration</text>

  <!-- 2028.1: one feature number, and its indices below it -->
  <text class="strong" x="0" y="126">2028.1</text>
  <text class="name" x="58" y="126">VERSION =</text>
  <rect class="box" x="142.5" y="102.5" width="194" height="38" rx="4"/>
  <rect class="box" x="348.5" y="102.5" width="91" height="38" rx="4"/>
  <rect class="mark-box" x="451.5" y="102.5" width="91" height="38" rx="4"/>
  <rect class="box" x="554.5" y="102.5" width="91" height="38" rx="4"/>
  <text class="name" text-anchor="middle" x="239.5" y="126">2028</text>
  <text class="name" text-anchor="middle" x="394" y="126">1</text>
  <text class="name" text-anchor="middle" x="497" y="126">"final"</text>
  <text class="name" text-anchor="middle" x="600" y="126">0</text>

  <text class="name small quiet" text-anchor="middle" x="239.5" y="160">[0]</text>
  <text class="name small quiet" text-anchor="middle" x="394" y="160">[1]</text>
  <text class="name small mark" text-anchor="middle" x="497" y="160">[2]</text>
  <text class="name small quiet" text-anchor="middle" x="600" y="160">[3]</text>

  <!-- what index 2 reads in each -->
  <text x="0" y="198"><tspan class="name mark">VERSION[2]</tspan> is <tspan class="name">1</tspan> under the first form, <tspan class="name">"final"</tspan> under the second</text>
</svg>
