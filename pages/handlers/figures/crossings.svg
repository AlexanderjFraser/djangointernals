<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 352">
  <!-- (a) synchronous middleware -->
  <text class="strong" x="0" y="14">Synchronous middleware, as Django's own is</text>
  <text class="quiet" x="0" y="55">event loop</text>
  <text class="quiet" x="0" y="125">worker</text>
  <path class="line dashed" d="M78 50 H646"/>
  <path class="line dashed" d="M78 120 H646"/>

  <path class="mark-line" d="M134 50 H140 V120 H146"/>
  <path class="mark-line" d="M284 120 H290 V50 H296"/>
  <path class="mark-line" d="M434 50 H440 V120 H446"/>
  <path class="mark-line" d="M584 120 H590 V50 H596"/>

  <rect class="ground" x="78" y="30" width="56" height="40" rx="4"/>
  <text class="small" x="106" y="54" text-anchor="middle">handle</text>

  <rect class="box" x="146" y="100" width="138" height="40" rx="4"/>
  <text class="name" x="215" y="117" text-anchor="middle">A   B   C</text>
  <text class="quiet small" x="215" y="133" text-anchor="middle">process_request</text>

  <rect class="ground" x="296" y="30" width="138" height="40" rx="4"/>
  <text class="small" x="365" y="47" text-anchor="middle">the centre of the chain,</text>
  <text class="small" x="365" y="63" text-anchor="middle">and the view</text>

  <rect class="box" x="446" y="100" width="138" height="40" rx="4"/>
  <text class="name" x="515" y="117" text-anchor="middle">C   B   A</text>
  <text class="quiet small" x="515" y="133" text-anchor="middle">process_response</text>

  <rect class="ground" x="596" y="30" width="50" height="40" rx="4"/>
  <text class="small" x="621" y="54" text-anchor="middle">send</text>

  <!-- (b) middleware in async mode -->
  <text class="strong" x="0" y="196">MiddlewareMixin in async mode, as Django's own was before 6.2</text>
  <text class="quiet" x="0" y="237">event loop</text>
  <text class="quiet" x="0" y="307">worker</text>
  <path class="line dashed" d="M78 232 H646"/>
  <path class="line dashed" d="M78 302 H646"/>

  <path class="mark-line" d="M134 232 H140 V302 H146"/>
  <path class="mark-line" d="M184 302 H188 V232 H192 V302 H196"/>
  <path class="mark-line" d="M234 302 H238 V232 H242 V302 H246"/>
  <path class="mark-line" d="M284 302 H290 V232 H296"/>
  <path class="mark-line" d="M434 232 H440 V302 H446"/>
  <path class="mark-line" d="M484 302 H488 V232 H492 V302 H496"/>
  <path class="mark-line" d="M534 302 H538 V232 H542 V302 H546"/>
  <path class="mark-line" d="M584 302 H590 V232 H596"/>

  <rect class="ground" x="78" y="212" width="56" height="40" rx="4"/>
  <text class="small" x="106" y="236" text-anchor="middle">handle</text>

  <rect class="box" x="146" y="286" width="38" height="32" rx="4"/>
  <text class="name" x="165" y="307" text-anchor="middle">A</text>
  <rect class="box" x="196" y="286" width="38" height="32" rx="4"/>
  <text class="name" x="215" y="307" text-anchor="middle">B</text>
  <rect class="box" x="246" y="286" width="38" height="32" rx="4"/>
  <text class="name" x="265" y="307" text-anchor="middle">C</text>
  <text class="quiet small" x="215" y="336" text-anchor="middle">process_request</text>

  <rect class="ground" x="296" y="212" width="138" height="40" rx="4"/>
  <text class="small" x="365" y="229" text-anchor="middle">the centre of the chain,</text>
  <text class="small" x="365" y="245" text-anchor="middle">and the view</text>

  <rect class="box" x="446" y="286" width="38" height="32" rx="4"/>
  <text class="name" x="465" y="307" text-anchor="middle">C</text>
  <rect class="box" x="496" y="286" width="38" height="32" rx="4"/>
  <text class="name" x="515" y="307" text-anchor="middle">B</text>
  <rect class="box" x="546" y="286" width="38" height="32" rx="4"/>
  <text class="name" x="565" y="307" text-anchor="middle">A</text>
  <text class="quiet small" x="515" y="336" text-anchor="middle">process_response</text>

  <rect class="ground" x="596" y="212" width="50" height="40" rx="4"/>
  <text class="small" x="621" y="236" text-anchor="middle">send</text>

  <text class="quiet small" x="646" y="350" text-anchor="end">time</text>
</svg>
