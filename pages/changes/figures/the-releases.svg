  <text class="strong" x="0" y="14">Django's releases, from the first public release</text>
  <text class="strong" x="0" y="34">to the first calendar versions</text>

  <!-- the months, by their initials -->
  <text class="quiet small" x="48" y="70" text-anchor="middle">J</text>
  <text class="quiet small" x="65" y="70" text-anchor="middle">F</text>
  <text class="quiet small" x="82" y="70" text-anchor="middle">M</text>
  <text class="quiet small" x="99" y="70" text-anchor="middle">A</text>
  <text class="quiet small" x="116" y="70" text-anchor="middle">M</text>
  <text class="quiet small" x="133" y="70" text-anchor="middle">J</text>
  <text class="quiet small" x="150" y="70" text-anchor="middle">J</text>
  <text class="quiet small" x="167" y="70" text-anchor="middle">A</text>
  <text class="quiet small" x="184" y="70" text-anchor="middle">S</text>
  <text class="quiet small" x="201" y="70" text-anchor="middle">O</text>
  <text class="quiet small" x="218" y="70" text-anchor="middle">N</text>
  <text class="quiet small" x="235" y="70" text-anchor="middle">D</text>

