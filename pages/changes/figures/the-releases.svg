  <!-- the rule of each year: solid to this commit, dashed after it, stopping short of the texts on it -->
  <path class="line" d="M178 78 H276 M392 78 H408 M440.4 78 H540 M572.4 78 H656 M40 108 H100 M132.4 108 H304 M392 108 H584 M609.4 108 H656 M40 138 H188 M213.4 138 H304 M392 138 H496 M521.4 138 H656 M40 168 H100 M125.4 168 H304 M392 168 H436.5 M40 198 H78 M103.4 198 H276 M392 198 H584 M609.4 198 H656 M40 258 H106.5 M176.5 258 H298 M392 258 H562 M594.4 258 H656 M40 288 H106.5 M183.5 288 H298 M392 288 H562 M587.4 288 H656 M40 318 H106.5 M176.5 318 H298 M392 318 H562 M587.4 318 H656 M40 348 H106.5 M176.5 348 H298 M392 348 H562 M587.4 348 H656 M40 378 H106.5 M176.5 378 H298 M392 378 H562 M587.4 378 H656 M40 408 H106.5 M176.5 408 H298 M392 408 H526.6 M552 408 H579"/>
