  <text class="strong" x="0" y="14">Django's releases, from the first public release to the first calendar versions</text>

  <!-- the months, by their initials, over each year of a row -->
  <text class="quiet small" x="51" y="50" text-anchor="middle">J</text>
  <text class="quiet small" x="73" y="50" text-anchor="middle">F</text>
  <text class="quiet small" x="95" y="50" text-anchor="middle">M</text>
  <text class="quiet small" x="117" y="50" text-anchor="middle">A</text>
  <text class="quiet small" x="139" y="50" text-anchor="middle">M</text>
