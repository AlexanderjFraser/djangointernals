  <text class="quiet" x="0" y="111">2005</text>
  <text class="quiet" x="0" y="133">2006</text>
  <text class="quiet" x="0" y="155">2007</text>
  <text class="quiet" x="0" y="177">2008</text>
  <text class="quiet" x="0" y="199">2009</text>
  <text class="quiet" x="0" y="221">2010</text>
  <text class="quiet" x="0" y="243">2011</text>
  <text class="quiet" x="0" y="265">2012</text>
  <text class="quiet" x="0" y="287">2013</text>
  <text class="quiet" x="0" y="309">2014</text>
  <text class="quiet" x="0" y="383">2015</text>
  <text class="quiet" x="0" y="405">2016</text>
