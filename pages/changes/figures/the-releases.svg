  <rect class="box" x="106.5" y="277.5" width="77" height="21" rx="4"/>
  <circle class="head" cx="117" cy="288" r="4"/>
  <text class="strong" x="126" y="293">1.11 LTS</text>
  <circle class="head" cx="293" cy="288" r="4"/>
  <text x="302" y="293">2.0</text>

  <!-- 2018 -->
  <circle class="head" cx="557" cy="288" r="4"/>
  <text x="566" y="293">2.1</text>

  <!-- 2019 -->
  <rect class="box" x="106.5" y="307.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="117" cy="318" r="4"/>
  <text class="strong" x="126" y="323">2.2 LTS</text>
  <circle class="head" cx="293" cy="318" r="4"/>
  <text x="302" y="323">3.0</text>

  <!-- 2020 -->
  <circle class="head" cx="557" cy="318" r="4"/>
  <text x="566" y="323">3.1</text>

  <!-- 2021 -->
  <rect class="box" x="106.5" y="337.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="117" cy="348" r="4"/>
  <text class="strong" x="126" y="353">3.2 LTS</text>
  <circle class="head" cx="293" cy="348" r="4"/>
  <text x="302" y="353">4.0</text>

  <!-- 2022 -->
  <circle class="head" cx="557" cy="348" r="4"/>
  <text x="566" y="353">4.1</text>

  <!-- 2023 -->
  <rect class="box" x="106.5" y="367.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="117" cy="378" r="4"/>
  <text class="strong" x="126" y="383">4.2 LTS</text>
  <circle class="head" cx="293" cy="378" r="4"/>
  <text x="302" y="383">5.0</text>

  <!-- 2024 -->
  <circle class="head" cx="557" cy="378" r="4"/>
  <text x="566" y="383">5.1</text>

