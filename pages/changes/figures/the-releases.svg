  <path class="line" d="M39.5 106 H56 M145 106 H223 M39.5 128 H53 M85 128 H155 M187 128 H243.5 M39.5 150 H87 M119 150 H243.5 M39.5 172 H189 M214 172 H243.5 M39.5 194 H155 M180 194 H243.5 M39.5 216 H121 M146 216 H243.5 M39.5 238 H87 M112 238 H243.5 M39.5 260 H71.5 M39.5 282 H70 M95 282 H223 M39.5 304 H189 M214 304 H243.5 M39.5 378 H88.5 M158.5 378 H240 M39.5 400 H172 M204 400 H243.5 M39.5 422 H88.5 M165.5 422 H240 M39.5 444 H172 M197 444 H243.5 M39.5 466 H88.5 M158.5 466 H240 M39.5 488 H172 M197 488 H243.5 M39.5 510 H88.5 M158.5 510 H240 M39.5 532 H172 M197 532 H243.5 M39.5 554 H88.5 M158.5 554 H240 M39.5 576 H172 M197 576 H243.5 M39.5 598 H88.5 M158.5 598 H240 M39.5 620 H137 M162 620 H184"/>
