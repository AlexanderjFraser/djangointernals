  <!-- this commit -->
  <path class="mark-line" d="M184 609 V631"/>
  <text x="194" y="625"><tspan class="strong mark">this commit</tspan><tspan class="quiet small">, 26 September</tspan></text>

  <!-- 2027 -->
  <rect class="box dashed" x="88.5" y="631.5" width="70" height="21" rx="4"/>
  <circle class="ground" cx="99" cy="642" r="4"/>
  <text class="strong" x="108" y="647">6.2 LTS</text>
  <text class="quiet small" x="166.5" y="646">expected</text>

  <!-- the rhythm of DEP 20 -->
  <text class="quiet" x="40" y="672">from 2028, one feature release a year,</text>
  <text class="quiet" x="40" y="692">each supported for three years (DEP 20)</text>

  <!-- 2028 -->
  <circle class="ground" cx="48" cy="716" r="4"/>
  <text x="57" y="721">Django 2028</text>

  <!-- 2029 -->
  <circle class="ground" cx="48" cy="738" r="4"/>
  <text x="57" y="743">Django 2029</text>

  <!-- the brackets: what each part of the chapter tells; each end points at its row; the label inside it -->
  <path class="line" d="M407 106 H414.5 V375 H407"/>
  <text class="strong" x="286" y="196">The first decade</text>
  <text class="quiet small" x="286" y="214">from the first release</text>
  <text class="quiet small" x="286" y="230">to 1.8</text>
  <path class="line" d="M407 381 H414.5 V551 H407"/>
  <text class="strong" x="286" y="460">The second decade</text>
  <text class="quiet small" x="286" y="478">from 1.9 to 5.0</text>
  <path class="line" d="M407 557 H414.5 V620 H407"/>
  <text class="strong" x="286" y="566">The sections by</text>
  <text class="strong" x="286" y="582">part of the book</text>
  <text class="quiet small" x="286" y="599">from 5.0 to this commit</text>

  <!-- the key -->
  <text class="quiet small" x="0" y="778">LTS: a long-term support release, given security fixes for at least three years.</text>
  <text class="quiet small" x="0" y="796">From 2.0, every long-term support release is an X.2.</text>
</svg>
