  <rect class="box" x="436.5" y="157.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="447" cy="168" r="4"/>
  <text class="strong" x="456" y="173">1.4 LTS</text>
  <text class="quiet small" x="514.5" y="172">the first long-term support release</text>

