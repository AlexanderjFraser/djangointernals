  <circle class="head" cx="557" cy="408" r="4"/>
  <text x="548" y="413" text-anchor="end">6.1</text>

  <!-- this commit -->
  <path class="mark-line" d="M579 397 V419"/>
  <text x="589" y="413"><tspan class="strong mark">this commit</tspan><tspan class="quiet small">,</tspan></text>
  <text class="quiet small" x="589" y="429">26 September</text>

  <!-- 2027 -->
  <rect class="box dashed" x="106.5" y="427.5" width="70" height="21" rx="4"/>
  <circle class="ground" cx="117" cy="438" r="4"/>
  <text class="strong" x="126" y="443">6.2 LTS</text>
  <text class="quiet small" x="184.5" y="442">expected</text>

  <!-- the rhythm of DEP 20, before the first row it governs -->
  <text class="quiet" x="40" y="474">from 2028, one feature release a year, each supported for three years (DEP 20)</text>

  <!-- 2028 -->
  <circle class="ground" cx="51" cy="498" r="4"/>
  <text x="60" y="503">Django 2028</text>

  <!-- 2029 -->
  <circle class="ground" cx="403" cy="498" r="4"/>
  <text x="412" y="503">Django 2029</text>

  <!-- the brackets: what each part of the chapter tells; each end points at its row, the label beside it -->
  <path class="line" d="M712 78 H719.5 V255 H712"/>
  <text class="strong" x="732" y="156">The first decade</text>
  <text class="quiet small" x="732" y="174">from the first release</text>
  <text class="quiet small" x="732" y="190">to 1.8</text>
  <path class="line" d="M712 261 H719.5 V375 H712"/>
  <text class="strong" x="732" y="312">The second decade</text>
  <text class="quiet small" x="732" y="330">from 1.9 to 5.0</text>
  <path class="line" d="M712 381 H719.5 V408 H712"/>
  <text class="strong" x="732" y="392">The sections by</text>
  <text class="strong" x="732" y="408">part of the book</text>
  <text class="quiet small" x="732" y="426">from 5.0 to this commit</text>

  <!-- the key -->
  <text class="quiet small" x="0" y="534">LTS: a long-term support release, given security fixes for at least three years.</text>
  <text class="quiet small" x="0" y="552">From 2.0, every long-term support release is an X.2.</text>
</svg>
