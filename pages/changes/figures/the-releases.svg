  <rect class="box" x="71.5" y="249.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="82" cy="260" r="4"/>
  <text class="strong" x="91" y="265">1.4 LTS</text>
  <text class="quiet small" x="149.5" y="264">the first long-term support release</text>

