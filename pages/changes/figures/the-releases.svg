<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 726">
  <!-- a row a year, January to December across it: a month is 28 wide from x 46, and a release stands at its month's centre (Jan 60, Apr 144, Aug 256, Sep 284, Dec 368) -->
  <!-- rows 22 apart: 2005 at y 78 to 2014 at 276; the note of DEP 4; 2015 at 326 to 2027 at 590; the note of DEP 20; 2028 at 640, 2029 at 662 -->
  <text class="strong" x="0" y="14">Django's releases, from the first public release to the first calendar versions</text>

  <!-- the months -->
  <text class="quiet small" x="60" y="52" text-anchor="middle">Jan</text>
  <text class="quiet small" x="88" y="52" text-anchor="middle">Feb</text>
  <text class="quiet small" x="116" y="52" text-anchor="middle">Mar</text>
  <text class="quiet small" x="144" y="52" text-anchor="middle">Apr</text>
  <text class="quiet small" x="172" y="52" text-anchor="middle">May</text>
  <text class="quiet small" x="200" y="52" text-anchor="middle">Jun</text>
  <text class="quiet small" x="228" y="52" text-anchor="middle">Jul</text>
  <text class="quiet small" x="256" y="52" text-anchor="middle">Aug</text>
  <text class="quiet small" x="284" y="52" text-anchor="middle">Sep</text>
  <text class="quiet small" x="312" y="52" text-anchor="middle">Oct</text>
  <text class="quiet small" x="340" y="52" text-anchor="middle">Nov</text>
  <text class="quiet small" x="368" y="52" text-anchor="middle">Dec</text>

  <!-- the years -->
  <text class="quiet" x="0" y="83">2005</text>
  <text class="quiet" x="0" y="105">2006</text>
  <text class="quiet" x="0" y="127">2007</text>
  <text class="quiet" x="0" y="149">2008</text>
  <text class="quiet" x="0" y="171">2009</text>
  <text class="quiet" x="0" y="193">2010</text>
  <text class="quiet" x="0" y="215">2011</text>
  <text class="quiet" x="0" y="237">2012</text>
  <text class="quiet" x="0" y="259">2013</text>
  <text class="quiet" x="0" y="281">2014</text>
  <text class="quiet" x="0" y="331">2015</text>
  <text class="quiet" x="0" y="353">2016</text>
  <text class="quiet" x="0" y="375">2017</text>
  <text class="quiet" x="0" y="397">2018</text>
  <text class="quiet" x="0" y="419">2019</text>
  <text class="quiet" x="0" y="441">2020</text>
  <text class="quiet" x="0" y="463">2021</text>
  <text class="quiet" x="0" y="485">2022</text>
  <text class="quiet" x="0" y="507">2023</text>
  <text class="quiet" x="0" y="529">2024</text>
  <text class="quiet" x="0" y="551">2025</text>
  <text class="quiet" x="0" y="573">2026</text>
  <text class="quiet" x="0" y="595">2027</text>
  <text class="quiet" x="0" y="645">2028</text>
  <text class="quiet" x="0" y="667">2029</text>

  <!-- the rule of each year: solid to this commit, dashed after it, stopping short of the texts on it -->
  <path class="line" d="M46 78 H86.2 M223 78 H345 M46 100 H65 M97.4 100 H233 M265.4 100 H382 M46 122 H121 M153.4 122 H382 M46 144 H289 M46 166 H233 M258.4 166 H382 M46 188 H177 M202.4 188 H382 M46 210 H121 M146.4 210 H382 M46 232 H105.5 M358.1 232 H382 M46 254 H93 M118.4 254 H345 M46 276 H289 M314.4 276 H382 M46 326 H133.5 M203.5 326 H373 M46 348 H261 M293.4 348 H382 M46 370 H133.5 M210.5 370 H373 M46 392 H261 M286.4 392 H382 M46 414 H133.5 M203.5 414 H373 M46 436 H261 M286.4 436 H382 M46 458 H133.5 M203.5 458 H372 M46 480 H260 M286.4 480 H382 M46 502 H133.5 M203.5 502 H373 M46 524 H261 M286.4 524 H382 M46 546 H133.5 M203.5 546 H373 M46 568 H225.6 M251 568 H284"/>
  <path class="line dashed" d="M284 568 H290 M46 590 H133.5 M261.2 590 H382 M46 640 H65 M144.9 640 H382 M46 662 H65 M144.9 662 H382"/>

  <!-- 2005 -->
  <circle class="head" cx="228" cy="78" r="4"/>
  <text x="219" y="83" text-anchor="end">the first public release</text>
  <circle class="head" cx="340" cy="78" r="4"/>
  <text x="349" y="83">0.90</text>

  <!-- 2006 -->
  <circle class="head" cx="60" cy="100" r="4"/>
  <text x="69" y="105">0.91</text>
  <circle class="head" cx="228" cy="100" r="4"/>
  <text x="237" y="105">0.95</text>

  <!-- 2007 -->
  <circle class="head" cx="116" cy="122" r="4"/>
  <text x="125" y="127">0.96</text>

  <!-- 2008 -->
  <circle class="head" cx="284" cy="144" r="4"/>
  <text x="293" y="149">1.0<tspan class="quiet small" dx="8">with the promise of a stable API</tspan></text>

  <!-- 2009 -->
  <circle class="head" cx="228" cy="166" r="4"/>
  <text x="237" y="171">1.1</text>

  <!-- 2010 -->
  <circle class="head" cx="172" cy="188" r="4"/>
  <text x="181" y="193">1.2</text>

  <!-- 2011 -->
  <circle class="head" cx="116" cy="210" r="4"/>
  <text x="125" y="215">1.3</text>

  <!-- 2012 -->
  <rect class="box" x="105.5" y="221.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="116" cy="232" r="4"/>
  <text class="strong" x="125" y="237">1.4 LTS</text>
  <text class="quiet small" x="183.5" y="236">the first long-term support release</text>

  <!-- 2013 -->
  <circle class="head" cx="88" cy="254" r="4"/>
  <text x="97" y="259">1.5</text>
  <circle class="head" cx="340" cy="254" r="4"/>
  <text x="349" y="259">1.6</text>

  <!-- 2014 -->
  <circle class="head" cx="284" cy="276" r="4"/>
  <text x="293" y="281">1.7</text>

  <!-- the rhythm of DEP 4 -->
  <text class="quiet small" x="46" y="304">from 1.8, a feature release every eight months, the schedule of DEP 4</text>

  <!-- 2015 -->
  <rect class="box" x="133.5" y="315.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="144" cy="326" r="4"/>
  <text class="strong" x="153" y="331">1.8 LTS</text>
  <circle class="head" cx="368" cy="326" r="4"/>
  <text x="377" y="331">1.9</text>

  <!-- 2016 -->
  <circle class="head" cx="256" cy="348" r="4"/>
  <text x="265" y="353">1.10</text>

  <!-- 2017 -->
  <rect class="box" x="133.5" y="359.5" width="77" height="21" rx="4"/>
  <circle class="head" cx="144" cy="370" r="4"/>
  <text class="strong" x="153" y="375">1.11 LTS</text>
  <circle class="head" cx="368" cy="370" r="4"/>
  <text x="377" y="375">2.0</text>

  <!-- 2018 -->
  <circle class="head" cx="256" cy="392" r="4"/>
  <text x="265" y="397">2.1</text>

  <!-- 2019 -->
  <rect class="box" x="133.5" y="403.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="144" cy="414" r="4"/>
  <text class="strong" x="153" y="419">2.2 LTS</text>
  <circle class="head" cx="368" cy="414" r="4"/>
  <text x="377" y="419">3.0</text>

  <!-- 2020 -->
  <circle class="head" cx="256" cy="436" r="4"/>
  <text x="265" y="441">3.1</text>

  <!-- 2021 -->
  <rect class="box" x="133.5" y="447.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="144" cy="458" r="4"/>
  <text class="strong" x="153" y="463">3.2 LTS</text>
  <circle class="head" cx="368" cy="458" r="4"/>
  <text x="377" y="463">4.0</text>

  <!-- 2022 -->
  <circle class="head" cx="256" cy="480" r="4"/>
  <text x="265" y="485">4.1</text>

  <!-- 2023 -->
  <rect class="box" x="133.5" y="491.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="144" cy="502" r="4"/>
  <text class="strong" x="153" y="507">4.2 LTS</text>
  <circle class="head" cx="368" cy="502" r="4"/>
  <text x="377" y="507">5.0</text>

  <!-- 2024 -->
  <circle class="head" cx="256" cy="524" r="4"/>
  <text x="265" y="529">5.1</text>

  <!-- 2025 -->
  <rect class="box" x="133.5" y="535.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="144" cy="546" r="4"/>
  <text class="strong" x="153" y="551">5.2 LTS</text>
  <circle class="head" cx="368" cy="546" r="4"/>
  <text x="377" y="551">6.0</text>

  <!-- 2026 -->
  <circle class="head" cx="256" cy="568" r="4"/>
  <text x="247" y="573" text-anchor="end">6.1</text>

  <!-- this commit -->
  <path class="mark-line" d="M284 557 V579"/>
  <text x="294" y="573"><tspan class="strong mark">this commit</tspan><tspan class="quiet small">, 26 September</tspan></text>

  <!-- 2027 -->
  <rect class="box dashed" x="133.5" y="579.5" width="70" height="21" rx="4"/>
  <circle class="ground" cx="144" cy="590" r="4"/>
  <text class="strong" x="153" y="595">6.2 LTS</text>
  <text class="quiet small" x="211.5" y="594">expected</text>

  <!-- the rhythm of DEP 20 -->
  <text class="quiet small" x="46" y="618">from 2028, one feature release a year, each supported for three years (DEP 20)</text>

  <!-- 2028 -->
  <circle class="ground" cx="60" cy="640" r="4"/>
  <text x="69" y="645">Django 2028</text>

  <!-- 2029 -->
  <circle class="ground" cx="60" cy="662" r="4"/>
  <text x="69" y="667">Django 2029</text>

  <!-- the brackets: what each part of the chapter tells; each end points at its row -->
  <path class="line" d="M483 78 H490.5 V323 H483"/>
  <text class="strong" x="502" y="197">The first decade</text>
  <text class="quiet small" x="502" y="215">from the first release to 1.8</text>
  <path class="line" d="M483 329 H490.5 V499 H483"/>
  <text class="strong" x="502" y="411">The second decade</text>
  <text class="quiet small" x="502" y="429">from 1.9 to 5.0</text>
  <path class="line" d="M483 505 H490.5 V568 H483"/>
  <text class="strong" x="502" y="525">The sections by</text>
  <text class="strong" x="502" y="541">part of the book</text>
  <text class="quiet small" x="502" y="559">from 5.0 to this commit</text>

  <!-- the key -->
  <text class="quiet small" x="0" y="702">LTS: a long-term support release, given security fixes for at least three years.</text>
  <text class="quiet small" x="0" y="718">From 2.0, every long-term support release is an X.2.</text>
</svg>
