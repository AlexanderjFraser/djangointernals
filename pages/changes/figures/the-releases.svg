  <rect class="box" x="88.5" y="411.5" width="77" height="21" rx="4"/>
  <circle class="head" cx="99" cy="422" r="4"/>
  <text class="strong" x="108" y="427">1.11 LTS</text>
  <circle class="head" cx="235" cy="422" r="4"/>
  <text x="244" y="427">2.0</text>

  <!-- 2018 -->
  <circle class="head" cx="167" cy="444" r="4"/>
  <text x="176" y="449">2.1</text>

  <!-- 2019 -->
  <rect class="box" x="88.5" y="455.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="99" cy="466" r="4"/>
  <text class="strong" x="108" y="471">2.2 LTS</text>
  <circle class="head" cx="235" cy="466" r="4"/>
  <text x="244" y="471">3.0</text>

  <!-- 2020 -->
  <circle class="head" cx="167" cy="488" r="4"/>
  <text x="176" y="493">3.1</text>

  <!-- 2021 -->
  <rect class="box" x="88.5" y="499.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="99" cy="510" r="4"/>
  <text class="strong" x="108" y="515">3.2 LTS</text>
  <circle class="head" cx="235" cy="510" r="4"/>
  <text x="244" y="515">4.0</text>

  <!-- 2022 -->
  <circle class="head" cx="167" cy="532" r="4"/>
  <text x="176" y="537">4.1</text>

  <!-- 2023 -->
  <rect class="box" x="88.5" y="543.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="99" cy="554" r="4"/>
  <text class="strong" x="108" y="559">4.2 LTS</text>
  <circle class="head" cx="235" cy="554" r="4"/>
  <text x="244" y="559">5.0</text>

  <!-- 2024 -->
  <circle class="head" cx="167" cy="576" r="4"/>
  <text x="176" y="581">5.1</text>

  <!-- 2025 -->
  <rect class="box" x="88.5" y="587.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="99" cy="598" r="4"/>
  <text class="strong" x="108" y="603">5.2 LTS</text>
  <circle class="head" cx="235" cy="598" r="4"/>
