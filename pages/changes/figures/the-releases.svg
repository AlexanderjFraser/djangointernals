  <!-- 2014 -->
  <circle class="head" cx="579" cy="198" r="4"/>
  <text x="588" y="203">1.7</text>

  <!-- the rhythm of DEP 4, before the first row it governs -->
  <text class="quiet" x="40" y="231">from 1.8, a feature release every eight months, the schedule of DEP 4</text>

  <!-- 2015 -->
  <rect class="box" x="106.5" y="247.5" width="70" height="21" rx="4"/>
  <circle class="head" cx="117" cy="258" r="4"/>
  <text class="strong" x="126" y="263">1.8 LTS</text>
  <circle class="head" cx="293" cy="258" r="4"/>
  <text x="302" y="263">1.9</text>

