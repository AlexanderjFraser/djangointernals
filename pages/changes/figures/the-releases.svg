  <circle class="head" cx="65" cy="282" r="4"/>
  <text x="74" y="287">1.5</text>
  <circle class="head" cx="218" cy="282" r="4"/>
  <text x="227" y="287">1.6</text>

  <!-- 2014 -->
  <circle class="head" cx="184" cy="304" r="4"/>
  <text x="193" y="309">1.7</text>

  <!-- the rhythm of DEP 4 -->
  <text class="quiet" x="40" y="334">from 1.8, a feature release every eight months,</text>
  <text class="quiet" x="40" y="354">the schedule of DEP 4</text>

