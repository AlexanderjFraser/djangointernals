  <!-- 2005 -->
  <circle class="head" cx="150" cy="106" r="4"/>
  <text x="141" y="91" text-anchor="end">the first</text>
  <text x="141" y="111" text-anchor="end">public release</text>
  <circle class="head" cx="218" cy="106" r="4"/>
  <text x="227" y="111">0.90</text>

