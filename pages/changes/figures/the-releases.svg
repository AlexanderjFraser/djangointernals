  <text class="quiet small" x="469" y="50" text-anchor="middle">A</text>
  <text class="quiet small" x="491" y="50" text-anchor="middle">M</text>
  <text class="quiet small" x="513" y="50" text-anchor="middle">J</text>
  <text class="quiet small" x="535" y="50" text-anchor="middle">J</text>
  <text class="quiet small" x="557" y="50" text-anchor="middle">A</text>
  <text class="quiet small" x="579" y="50" text-anchor="middle">S</text>
  <text class="quiet small" x="601" y="50" text-anchor="middle">O</text>
  <text class="quiet small" x="623" y="50" text-anchor="middle">N</text>
  <text class="quiet small" x="645" y="50" text-anchor="middle">D</text>

