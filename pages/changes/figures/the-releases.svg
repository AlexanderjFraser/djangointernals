<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 420 802">
  <!-- a row a year, January to December across it: a month is 17 wide from x 39.5, and a release stands at its month's centre (Jan 48, Mar 82, Apr 99, Jul 150, Aug 167, Sep 184, Nov 218, Dec 235) -->
