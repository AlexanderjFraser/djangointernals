  <text class="quiet small" x="227" y="50" text-anchor="middle">S</text>
  <text class="quiet small" x="249" y="50" text-anchor="middle">O</text>
  <text class="quiet small" x="271" y="50" text-anchor="middle">N</text>
  <text class="quiet small" x="293" y="50" text-anchor="middle">D</text>
