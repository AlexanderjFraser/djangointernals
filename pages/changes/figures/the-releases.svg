  <!-- 2005 -->
  <circle class="head" cx="183" cy="78" r="4"/>
  <text x="174" y="83" text-anchor="end">the first public release</text>
  <circle class="head" cx="271" cy="78" r="4"/>
  <text x="280" y="83">0.90</text>

  <!-- 2006 -->
  <circle class="head" cx="403" cy="78" r="4"/>
  <text x="412" y="83">0.91</text>
  <circle class="head" cx="535" cy="78" r="4"/>
  <text x="544" y="83">0.95</text>

  <!-- 2007 -->
  <circle class="head" cx="95" cy="108" r="4"/>
  <text x="104" y="113">0.96</text>

  <!-- 2008 -->
  <circle class="head" cx="579" cy="108" r="4"/>
  <text x="588" y="113">1.0</text>

  <!-- 2009 -->
  <circle class="head" cx="183" cy="138" r="4"/>
  <text x="192" y="143">1.1</text>

  <!-- 2010 -->
  <circle class="head" cx="491" cy="138" r="4"/>
  <text x="500" y="143">1.2</text>

  <!-- 2011 -->
  <circle class="head" cx="95" cy="168" r="4"/>
  <text x="104" y="173">1.3</text>

