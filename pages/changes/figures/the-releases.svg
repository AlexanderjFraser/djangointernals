<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 326">
  <!-- one axis for the whole figure, at y 208: 5.0 to 6.2 are eight months apart, 72 wide each, and the two calendar versions, which have no date, 100 apart after 6.2 -->
  <!-- x: 5.0 34, 5.1 106, 5.2 178, 6.0 250, 6.1 322, 6.2 394, Django 2028 494, Django 2029 594; this commit 337, about a fifth of the way from 6.1 to 6.2 -->

  <!-- the deprecations: each bar runs from the release that deprecated to the one that removes -->
  <text class="strong" x="0" y="14">What a release deprecated, from that release to the one that removes it</text>

  <!-- 6.2's exception: the readings of django.VERSION end in Django 2028 -->
  <text class="quiet small" x="386" y="48" text-anchor="end">the readings of <tspan class="name small">django.VERSION</tspan></text>
  <rect class="box" x="394.5" y="38.5" width="99" height="12" rx="4"/>

  <!-- 6.2 to Django 2029 -->
  <text class="quiet small" x="386" y="70" text-anchor="end">warns <tspan class="name small">RemovedInDjango2029Warning</tspan></text>
  <rect class="box" x="394.5" y="60.5" width="199" height="12" rx="4"/>

  <!-- 6.1 and 6.0 to Django 2028 -->
  <text class="quiet small" x="314" y="92" text-anchor="end">warns <tspan class="name small">RemovedInDjango2028Warning</tspan></text>
  <rect class="box" x="322.5" y="82.5" width="171" height="12" rx="4"/>
  <text class="quiet small" x="242" y="114" text-anchor="end">warns <tspan class="name small">RemovedInDjango2028Warning</tspan></text>
  <rect class="box" x="250.5" y="104.5" width="243" height="12" rx="4"/>

  <!-- 5.2 to 6.1, and 5.1 and 5.0 to 6.0 -->
  <rect class="box" x="178.5" y="126.5" width="143" height="12" rx="4"/>
  <rect class="box" x="106.5" y="148.5" width="143" height="12" rx="4"/>
  <rect class="box" x="34.5" y="170.5" width="215" height="12" rx="4"/>

  <!-- this commit: a flag standing on the axis -->
  <path class="mark-line" d="M337 140 V216"/>
  <text x="347" y="152"><tspan class="strong mark">this commit</tspan><tspan class="quiet small">, 26 September 2026</tspan></text>
  <text x="347" y="170">main, a pre-alpha of 6.2</text>
  <text class="name" x="347" y="188">django.VERSION (6, 2, 0, "alpha", 0)</text>

  <!-- the axis: drawn solid to this commit, dashed after it -->
  <path class="line" d="M34 208 H337"/>
  <path class="line dashed" d="M337 208 H594"/>
  <circle class="head" cx="34" cy="208" r="4.5"/>
  <circle class="head" cx="106" cy="208" r="4.5"/>
  <circle class="head" cx="178" cy="208" r="4.5"/>
  <circle class="head" cx="250" cy="208" r="4.5"/>
  <circle class="head" cx="322" cy="208" r="4.5"/>
  <circle class="ground" cx="394" cy="208" r="4.5"/>
  <circle class="ground" cx="494" cy="208" r="4.5"/>
  <circle class="ground" cx="594" cy="208" r="4.5"/>

  <!-- the releases -->
  <text class="strong" x="34" y="232" text-anchor="middle">5.0</text>
  <text class="quiet small" x="34" y="250" text-anchor="middle">4 December</text>
  <text class="quiet small" x="34" y="266" text-anchor="middle">2023</text>

  <text class="strong" x="106" y="232" text-anchor="middle">5.1</text>
  <text class="quiet small" x="106" y="250" text-anchor="middle">7 August</text>
  <text class="quiet small" x="106" y="266" text-anchor="middle">2024</text>

  <text class="strong" x="178" y="232" text-anchor="middle">5.2 LTS</text>
  <text class="quiet small" x="178" y="250" text-anchor="middle">2 April</text>
  <text class="quiet small" x="178" y="266" text-anchor="middle">2025</text>
  <text class="small" x="178" y="288" text-anchor="middle">security fixes</text>
  <text class="small" x="178" y="304" text-anchor="middle">until April 2028</text>

  <text class="strong" x="250" y="232" text-anchor="middle">6.0</text>
  <text class="quiet small" x="250" y="250" text-anchor="middle">3 December</text>
  <text class="quiet small" x="250" y="266" text-anchor="middle">2025</text>

  <text class="strong" x="322" y="232" text-anchor="middle">6.1</text>
  <text class="quiet small" x="322" y="250" text-anchor="middle">5 August</text>
  <text class="quiet small" x="322" y="266" text-anchor="middle">2026</text>
  <text class="small" x="322" y="288" text-anchor="middle">mainstream support expected</text>
  <text class="small" x="322" y="304" text-anchor="middle">until April 2027, extended</text>
  <text class="small" x="322" y="320" text-anchor="middle">until December 2027</text>

  <text class="strong" x="394" y="232" text-anchor="middle">6.2 LTS</text>
  <text class="quiet small" x="394" y="250" text-anchor="middle">April 2027</text>
  <text class="quiet small" x="394" y="266" text-anchor="middle">expected</text>

  <text class="strong" x="494" y="232" text-anchor="middle">Django 2028</text>
  <text class="strong" x="594" y="232" text-anchor="middle">Django 2029</text>
  <text class="quiet small" x="544" y="250" text-anchor="middle">calendar versions,</text>
  <text class="quiet small" x="544" y="266" text-anchor="middle">under DEP 20</text>

  <!-- the key -->
  <text class="quiet small" x="646" y="320" text-anchor="end">LTS: a long-term support release</text>
</svg>
