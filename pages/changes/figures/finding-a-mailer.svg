<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 773 315">
  <!-- step 1: EmailMessage.send asks whether using= was given; the start, accented -->
  <rect class="mark-box" x="0.5" y="0.5" width="248" height="68" rx="4"/>
  <text class="strong" x="12" y="22">1</text>
  <text x="32" y="22"><tspan class="name strong">EmailMessage.send()</tspan><tspan class="quiet small">,</tspan></text>
  <text class="quiet small" x="32" y="40">which <tspan class="name">send_mail</tspan> calls</text>
  <text x="32" y="58"><tspan class="name">using=</tspan> given?</text>

  <!-- step 1's answer to the right: no, connection= given: that backend -->
  <path class="line" d="M248.5 34.5 H432.5"/>
  <polygon class="head" points="442.5,34.5 432.5,29.5 432.5,39.5"/>
  <text x="284.5" y="27">no, <tspan class="name">connection=</tspan> given</text>
  <rect class="ground" x="442.5" y="18.5" width="330" height="32" rx="4"/>
  <text x="454.5" y="40">that backend</text>

  <!-- step 1's stem, which turns right into step 2 (yes) and runs down past it into step 3 (no, neither) -->
  <path class="line" d="M24.5 68.5 V239.5"/>
  <polygon class="head" points="24.5,249.5 19.5,239.5 29.5,239.5"/>
  <path class="line" d="M24.5 142.5 H82.5"/>
  <polygon class="head" points="92.5,142.5 82.5,137.5 82.5,147.5"/>
  <text x="36" y="135">yes</text>

  <!-- step 2: mailers[alias] asks whether MAILERS is defined -->
  <rect class="box" x="92.5" y="117.5" width="156" height="50" rx="4"/>
  <text class="strong" x="104" y="139">2</text>
  <text class="name strong" x="124" y="139">mailers[alias]</text>
  <text x="124" y="157"><tspan class="name">MAILERS</tspan> defined?</text>

  <!-- step 2's answers to the right -->
  <path class="line" d="M248.5 142.5 H432.5 M272.5 142.5 V94.5 H432.5 M272.5 142.5 V190.5 H432.5"/>
  <polygon class="head" points="442.5,94.5 432.5,89.5 432.5,99.5"/>
  <polygon class="head" points="442.5,142.5 432.5,137.5 432.5,147.5"/>
  <polygon class="head" points="442.5,190.5 432.5,185.5 432.5,195.5"/>
  <text x="284.5" y="87">yes, with the alias</text>
  <text x="284.5" y="135">yes, without it</text>
  <text x="284.5" y="183">no, another alias</text>
  <rect class="ground" x="442.5" y="78.5" width="330" height="32" rx="4"/>
  <text x="454.5" y="100">a new backend of the entry’s <tspan class="name">"BACKEND"</tspan></text>
  <rect class="ground" x="442.5" y="126.5" width="330" height="80" rx="4"/>
  <text class="name" x="454.5" y="172">MailerDoesNotExist</text>

  <!-- step 2's stem, down into step 3 -->
  <path class="line" d="M116.5 167.5 V239.5"/>
  <polygon class="head" points="116.5,249.5 111.5,239.5 121.5,239.5"/>

  <!-- the two answers that run down into step 3, each beside its stem -->
  <text x="36" y="213">no, neither</text>
  <text x="128" y="213">no, the alias</text>
  <text class="name" x="128" y="231">"default"</text>

  <!-- step 3: get_connection asks whether MAILERS is defined -->
  <rect class="box" x="0.5" y="249.5" width="248" height="50" rx="4"/>
  <text class="strong" x="12" y="271">3</text>
  <text class="name strong" x="32" y="271">get_connection()</text>
  <text x="32" y="289"><tspan class="name">MAILERS</tspan> defined?</text>

  <!-- step 3's answers to the right -->
  <path class="line" d="M248.5 274.5 H272.5 M272.5 274.5 V250.5 H432.5 M272.5 274.5 V298.5 H432.5"/>
  <polygon class="head" points="442.5,250.5 432.5,245.5 432.5,255.5"/>
  <polygon class="head" points="442.5,298.5 432.5,293.5 432.5,303.5"/>
  <text x="284.5" y="243">yes</text>
  <text x="284.5" y="291">no</text>
  <rect class="ground" x="442.5" y="234.5" width="330" height="32" rx="4"/>
  <text x="454.5" y="256">as at step 2, for the alias <tspan class="name">"default"</tspan></text>
  <rect class="ground" x="442.5" y="282.5" width="330" height="32" rx="4"/>
  <text x="454.5" y="304">a new backend of the class <tspan class="name">EMAIL_BACKEND</tspan> names</text>
</svg>
