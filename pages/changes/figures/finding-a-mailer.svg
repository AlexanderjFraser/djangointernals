<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 440 585">
  <!-- step 1: EmailMessage.send asks whether using= was given; the start, accented -->
  <rect class="mark-box" x="0.5" y="0.5" width="439" height="54" rx="4"/>
  <text class="strong" x="12" y="23">1</text>
  <text x="32" y="23"><tspan class="name strong">EmailMessage.send()</tspan><tspan class="quiet small">, which </tspan><tspan class="name small quiet">send_mail</tspan><tspan class="quiet small"> calls</tspan></text>
  <text x="32" y="43"><tspan class="name">using=</tspan> given?</text>

  <!-- step 1's stem, which runs on past step 2 into step 3 -->
  <path class="line" d="M24.5 54.5 V380.5"/>
  <polygon class="head" points="24.5,390.5 19.5,380.5 29.5,380.5"/>

  <!-- no, connection= given: that backend -->
  <text x="36" y="81">no, <tspan class="name">connection=</tspan> given</text>
  <path class="line" d="M24.5 88.5 H240.5"/>
  <polygon class="head" points="250.5,88.5 240.5,83.5 240.5,93.5"/>
  <rect class="ground" x="250.5" y="70.5" width="189" height="36" rx="4"/>
  <text x="262" y="93">that backend</text>

  <!-- yes: step 2 -->
  <text x="36" y="142">yes</text>
  <path class="line" d="M24.5 149.5 H82.5"/>
  <polygon class="head" points="92.5,149.5 82.5,144.5 82.5,154.5"/>

  <!-- step 2: mailers[alias] asks whether MAILERS is defined -->
  <rect class="box" x="92.5" y="122.5" width="347" height="54" rx="4"/>
  <text class="strong" x="104" y="145">2</text>
  <text class="name strong" x="124" y="145">mailers[alias]</text>
  <text x="124" y="165"><tspan class="name">MAILERS</tspan> defined?</text>

  <!-- step 2's stem, into step 3 -->
  <path class="line" d="M116.5 176.5 V380.5"/>
  <polygon class="head" points="116.5,390.5 111.5,380.5 121.5,380.5"/>

  <!-- yes, with the alias: a new backend of the entry's "BACKEND" -->
  <text x="128" y="213">yes, with the alias</text>
  <path class="line" d="M116.5 220.5 H240.5"/>
  <polygon class="head" points="250.5,220.5 240.5,215.5 240.5,225.5"/>
  <rect class="ground" x="250.5" y="192.5" width="189" height="56" rx="4"/>
  <text x="262" y="215">a new backend of the</text>
  <text x="262" y="235">entry’s <tspan class="name">"BACKEND"</tspan></text>

  <!-- yes, without it, and no, another alias: both MailerDoesNotExist -->
  <text x="128" y="275">yes, without it</text>
  <path class="line" d="M116.5 282.5 H240.5"/>
  <polygon class="head" points="250.5,282.5 240.5,277.5 240.5,287.5"/>
  <text x="128" y="323">no, another alias</text>
  <path class="line" d="M116.5 330.5 H240.5"/>
  <polygon class="head" points="250.5,330.5 240.5,325.5 240.5,335.5"/>
  <rect class="ground" x="250.5" y="264.5" width="189" height="84" rx="4"/>
  <text class="name" x="262" y="311">MailerDoesNotExist</text>

  <!-- into step 3: step 1's no, neither, and step 2's no, the alias "default", each beside its stem -->
  <text x="32" y="373">no, neither</text>
  <text x="124" y="373">no, the alias <tspan class="name">"default"</tspan></text>

  <!-- step 3: get_connection asks whether MAILERS is defined -->
  <rect class="box" x="0.5" y="390.5" width="439" height="54" rx="4"/>
  <text class="strong" x="12" y="413">3</text>
  <text class="name strong" x="32" y="413">get_connection()</text>
  <text x="32" y="433"><tspan class="name">MAILERS</tspan> defined?</text>

  <!-- step 3's stem -->
  <path class="line" d="M24.5 444.5 V556.5 H240.5"/>

  <!-- yes: as at step 2, for the alias "default" -->
  <text x="36" y="481">yes</text>
  <path class="line" d="M24.5 488.5 H240.5"/>
  <polygon class="head" points="250.5,488.5 240.5,483.5 240.5,493.5"/>
  <rect class="ground" x="250.5" y="460.5" width="189" height="56" rx="4"/>
  <text x="262" y="483">as at step 2, for the</text>
  <text x="262" y="503">alias <tspan class="name">"default"</tspan></text>

  <!-- no: a new backend of the class EMAIL_BACKEND names -->
  <text x="36" y="549">no</text>
  <polygon class="head" points="250.5,556.5 240.5,551.5 240.5,561.5"/>
  <rect class="ground" x="250.5" y="528.5" width="189" height="56" rx="4"/>
  <text x="262" y="551">a new backend of the class</text>
  <text x="262" y="571"><tspan class="name">EMAIL_BACKEND</tspan> names</text>
</svg>
