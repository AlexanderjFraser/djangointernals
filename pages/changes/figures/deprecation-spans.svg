<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 420 418">
  <!-- one axis for the whole figure, at y 322: 5.0 to 6.2 are eight months apart, 53 wide each, and the two calendar versions, which have no date, about as far apart after 6.2 -->
  <!-- x: 5.0 24, 5.1 77, 5.2 130, 6.0 183, 6.1 236, 6.2 289, Django 2028 342, Django 2029 396; this commit 248, about a fifth of the way from 6.1 to 6.2 -->

  <text class="strong" x="0" y="14">What a release deprecated,</text>
  <text class="strong" x="0" y="33">from that release to the one that removes it</text>

  <!-- the deprecations, the latest on top: each bar runs from the release that deprecated to the one that removes, with the class it warns with above it, ending where it ends -->

  <!-- 6.2's exception: the readings of django.VERSION end in Django 2028 -->
  <text x="342" y="62" text-anchor="end"><tspan class="quiet">the readings of </tspan><tspan class="name">django.VERSION</tspan></text>
  <rect class="box" x="289.5" y="70.5" width="52" height="12" rx="4"/>

  <!-- 6.2 to Django 2029 -->
  <text x="396" y="104" text-anchor="end"><tspan class="quiet">warns </tspan><tspan class="name">RemovedInDjango2029Warning</tspan></text>
  <rect class="box" x="289.5" y="112.5" width="106" height="12" rx="4"/>

  <!-- 6.1 to Django 2028 -->
  <text x="342" y="146" text-anchor="end"><tspan class="quiet">warns </tspan><tspan class="name">RemovedInDjango2028Warning</tspan></text>
  <rect class="box" x="236.5" y="154.5" width="105" height="12" rx="4"/>

  <!-- 6.0 to Django 2028 -->
  <text x="342" y="188" text-anchor="end"><tspan class="quiet">warns </tspan><tspan class="name">RemovedInDjango2028Warning</tspan></text>
  <rect class="box" x="183.5" y="196.5" width="158" height="12" rx="4"/>

  <!-- 5.2 to 6.1, and 5.1 and 5.0 to 6.0 -->
  <rect class="box" x="130.5" y="226.5" width="105" height="12" rx="4"/>
  <rect class="box" x="77.5" y="256.5" width="105" height="12" rx="4"/>
  <rect class="box" x="24.5" y="286.5" width="158" height="12" rx="4"/>

  <!-- this commit: a flag standing on the axis, below the bars that cross it -->
  <path class="mark-line" d="M248 218 V330"/>
  <text class="strong mark" x="256" y="234">this commit</text>
  <text class="quiet" x="256" y="252">26 September 2026</text>
  <text x="256" y="270">main, a pre-alpha of 6.2</text>
  <text class="name" x="256" y="288">django.VERSION</text>
  <text class="name" x="256" y="306">(6, 2, 0, "alpha", 0)</text>

  <!-- the axis: drawn solid to this commit, dashed after it -->
  <path class="line" d="M24 322 H248"/>
  <path class="line dashed" d="M248 322 H396"/>
  <circle class="head" cx="24" cy="322" r="4.5"/>
  <circle class="head" cx="77" cy="322" r="4.5"/>
  <circle class="head" cx="130" cy="322" r="4.5"/>
  <circle class="head" cx="183" cy="322" r="4.5"/>
  <circle class="head" cx="236" cy="322" r="4.5"/>
  <circle class="ground" cx="289" cy="322" r="4.5"/>
  <circle class="ground" cx="342" cy="322" r="4.5"/>
  <circle class="ground" cx="396" cy="322" r="4.5"/>

  <!-- the releases, each with its date under its name -->
  <text class="strong" x="24" y="346" text-anchor="middle">5.0</text>
  <text class="quiet small" x="24" y="364" text-anchor="middle">Dec 2023</text>
  <text class="strong" x="77" y="346" text-anchor="middle">5.1</text>
  <text class="quiet small" x="77" y="364" text-anchor="middle">Aug 2024</text>
  <text class="strong" x="130" y="346" text-anchor="middle">5.2 LTS</text>
  <text class="quiet small" x="130" y="364" text-anchor="middle">Apr 2025</text>
  <text class="strong" x="183" y="346" text-anchor="middle">6.0</text>
  <text class="quiet small" x="183" y="364" text-anchor="middle">Dec 2025</text>
  <text class="strong" x="236" y="346" text-anchor="middle">6.1</text>
  <text class="quiet small" x="236" y="364" text-anchor="middle">Aug 2026</text>
  <text class="strong" x="289" y="346" text-anchor="middle">6.2 LTS</text>
  <text class="quiet small" x="289" y="364" text-anchor="middle">Apr 2027,</text>
  <text class="quiet small" x="289" y="380" text-anchor="middle">expected</text>
  <text class="strong" x="342" y="346" text-anchor="middle">Django</text>
  <text class="strong" x="342" y="364" text-anchor="middle">2028</text>
  <text class="strong" x="396" y="346" text-anchor="middle">Django</text>
  <text class="strong" x="396" y="364" text-anchor="middle">2029</text>
  <text class="quiet small" x="369" y="396" text-anchor="middle">calendar versions,</text>
  <text class="quiet small" x="369" y="412" text-anchor="middle">under DEP 20</text>

  <!-- the key -->
  <text class="quiet small" x="0" y="412">LTS: a long-term support release</text>
</svg>
