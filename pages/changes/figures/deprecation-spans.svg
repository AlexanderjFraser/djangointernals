<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 802 332">
  <!-- one axis for the whole figure, at y 264, 12 to a month: 5.0 (December 2023) at 30 and each feature release eight months, 96, after the one before; Django 2028 and Django 2029, each in January, 108 and 252 after 6.2 -->
  <!-- x: 5.0 30, 5.1 126, 5.2 222, 6.0 318, 6.1 414, this commit 435, 6.2 510, Django 2028 618, Django 2029 762 -->
  <!-- rows 30 apart, the latest release on top: a bar 14 tall from y 44.5, its label right-aligned 10 before the bar's start, on its baseline -->

  <text class="strong" x="0" y="14">What each feature release from 5.0 deprecated, from that release to the one that removes it</text>
  <!-- the key, under the title, in the corner the staircase leaves empty -->
  <text class="quiet small" x="0" y="34">LTS: a long-term support release</text>

  <!-- 6.2's exception: the readings of django.VERSION end in Django 2028 -->
  <text x="500" y="56" text-anchor="end"><tspan class="quiet">the readings of </tspan><tspan class="name">django.VERSION</tspan></text>
  <rect class="box" x="510.5" y="44.5" width="108" height="14" rx="4"/>

  <!-- 6.2 to Django 2029 -->
  <text x="500" y="86" text-anchor="end"><tspan class="quiet">warns </tspan><tspan class="name">RemovedInDjango2029Warning</tspan></text>
  <rect class="box" x="510.5" y="74.5" width="252" height="14" rx="4"/>

  <!-- 6.1 to Django 2028 -->
  <text x="404" y="116" text-anchor="end"><tspan class="quiet">warns </tspan><tspan class="name">RemovedInDjango2028Warning</tspan></text>
  <rect class="box" x="414.5" y="104.5" width="204" height="14" rx="4"/>

  <!-- 6.0 to Django 2028 -->
  <text x="308" y="146" text-anchor="end"><tspan class="quiet">warns </tspan><tspan class="name">RemovedInDjango2028Warning</tspan></text>
  <rect class="box" x="318.5" y="134.5" width="300" height="14" rx="4"/>

  <!-- 5.2 to 6.1, and 5.1 and 5.0 to 6.0 -->
  <rect class="box" x="222.5" y="164.5" width="192" height="14" rx="4"/>
  <rect class="box" x="126.5" y="194.5" width="192" height="14" rx="4"/>
  <rect class="box" x="30.5" y="224.5" width="288" height="14" rx="4"/>

  <!-- the axis: drawn solid to this commit, dashed after it -->
  <path class="line" d="M30 264 H435"/>
  <path class="line dashed" d="M435 264 H762"/>

  <!-- this commit: an upright line from the axis through the bars that cross it, its flag beside it below them -->
  <path class="mark-line" d="M435 98 V272"/>
  <text x="445" y="192"><tspan class="strong mark">this commit</tspan><tspan class="quiet">, 26 September 2026</tspan></text>
  <text x="445" y="210">main, a pre-alpha of 6.2</text>
  <text class="name" x="445" y="228">django.VERSION (6, 2, 0, "alpha", 0)</text>

  <!-- the releases on the axis: filled where made, open where expected -->
  <circle class="head" cx="30" cy="264" r="4.5"/>
  <circle class="head" cx="126" cy="264" r="4.5"/>
  <circle class="head" cx="222" cy="264" r="4.5"/>
  <circle class="head" cx="318" cy="264" r="4.5"/>
  <circle class="head" cx="414" cy="264" r="4.5"/>
  <circle class="ground" cx="510" cy="264" r="4.5"/>
  <circle class="ground" cx="618" cy="264" r="4.5"/>
  <circle class="ground" cx="762" cy="264" r="4.5"/>

  <!-- the releases, each with its date under its name -->
  <text class="strong" x="30" y="288" text-anchor="middle">5.0</text>
  <text class="quiet" x="30" y="306" text-anchor="middle">Dec 2023</text>
  <text class="strong" x="126" y="288" text-anchor="middle">5.1</text>
  <text class="quiet" x="126" y="306" text-anchor="middle">Aug 2024</text>
  <text class="strong" x="222" y="288" text-anchor="middle">5.2 LTS</text>
  <text class="quiet" x="222" y="306" text-anchor="middle">Apr 2025</text>
  <text class="strong" x="318" y="288" text-anchor="middle">6.0</text>
  <text class="quiet" x="318" y="306" text-anchor="middle">Dec 2025</text>
  <text class="strong" x="414" y="288" text-anchor="middle">6.1</text>
  <text class="quiet" x="414" y="306" text-anchor="middle">Aug 2026</text>
  <text class="strong" x="510" y="288" text-anchor="middle">6.2 LTS</text>
  <text class="quiet" x="510" y="306" text-anchor="middle">Apr 2027,</text>
  <text class="quiet" x="510" y="324" text-anchor="middle">expected</text>
  <text class="strong" x="618" y="288" text-anchor="middle">Django 2028</text>
  <text class="strong" x="762" y="288" text-anchor="middle">Django 2029</text>
  <text class="quiet" x="690" y="306" text-anchor="middle">calendar versions, under DEP 20</text>
</svg>
