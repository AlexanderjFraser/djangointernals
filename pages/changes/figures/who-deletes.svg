<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 394">
  <!-- a grid: the two halves side by side, columns at x 105 and 387, each 258 wide;
       who carries out each step is the row, Django's at y 46 and the database's at y 258,
       and what the receiver and the count learn are the two rows under them -->

  <!-- the halves' headings -->
  <text class="strong" x="105" y="15"><tspan class="name">CASCADE</tspan>:</text>
  <text class="strong" x="105" y="33">Django deletes the mooring</text>
  <text class="strong" x="387" y="15"><tspan class="name">DB_CASCADE</tspan>, since 6.1:</text>
  <text class="strong" x="387" y="33">the database deletes the mooring</text>

  <!-- the rows' labels: who carries each step out, then what is learnt of the mooring -->
  <text class="quiet" x="0" y="83">Django</text>
  <text class="quiet" x="0" y="295">the database</text>
  <text class="name quiet" x="0" y="368">post_delete</text>
  <text class="quiet" x="0" y="388">counted</text>

  <!-- the four cells -->
  <rect class="ground" x="105.5" y="46.5" width="258" height="196" rx="4"/>
  <rect class="ground" x="387.5" y="46.5" width="258" height="196" rx="4"/>
  <rect class="ground" x="105.5" y="258.5" width="258" height="84" rx="4"/>
  <rect class="ground" x="387.5" y="258.5" width="258" height="84" rx="4"/>

  <!-- CASCADE: three steps, in order down, all in Django's row -->
  <rect class="box" x="117.5" y="62.5" width="234" height="52" rx="4"/>
  <text x="129" y="83"><tspan class="name">SELECT</tspan> the moorings</text>
  <text class="quiet" x="129" y="103">as a receiver must be called</text>
  <path class="line" d="M234.5 115 V128.5"/>
  <polygon class="head" points="234.5,138.5 229.5,128.5 239.5,128.5"/>

  <rect class="box" x="117.5" y="138.5" width="234" height="32" rx="4"/>
  <text x="129" y="159"><tspan class="name">DELETE</tspan> the mooring</text>
  <path class="line" d="M234.5 171 V184.5"/>
  <polygon class="head" points="234.5,194.5 229.5,184.5 239.5,184.5"/>

  <rect class="box" x="117.5" y="194.5" width="234" height="32" rx="4"/>
  <text x="129" y="215"><tspan class="name">DELETE</tspan> the harbour</text>

  <!-- DB_CASCADE: one step in Django's row, then one in the database's, the accent -->
  <rect class="box" x="399.5" y="62.5" width="234" height="52" rx="4"/>
  <text x="411" y="83"><tspan class="name">DELETE</tspan> the harbour</text>
  <text class="quiet" x="411" y="103">the one statement sent</text>
  <path class="line" d="M516.5 115 V264.5"/>
  <polygon class="head" points="516.5,274.5 511.5,264.5 521.5,264.5"/>

  <rect class="mark-box" x="399.5" y="274.5" width="234" height="52" rx="4"/>
  <text x="411" y="295">deletes the mooring</text>
  <text class="quiet" x="411" y="315">by its key's <tspan class="name">ON DELETE</tspan> clause</text>

  <!-- what the receiver and the count learn of the mooring -->
  <text x="105" y="368">called for the mooring</text>
  <text x="105" y="388">the harbour and the mooring</text>
  <text x="387" y="368">not called for the mooring</text>
  <text x="387" y="388">the harbour alone</text>
</svg>
