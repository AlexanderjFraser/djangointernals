<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 565">
  <!-- CASCADE: two lanes, Django's and the database's; every step is in Django's -->
  <text class="strong" x="0" y="15"><tspan class="name">CASCADE</tspan>: Django deletes the mooring</text>
  <rect class="ground" x="0.5" y="28.5" width="314" height="210" rx="4"/>
  <rect class="ground" x="331.5" y="28.5" width="314" height="210" rx="4"/>
  <text class="quiet" x="12" y="50">Django</text>
  <text class="quiet" x="343" y="50">the database</text>

  <!-- its three steps, in order down -->
  <rect class="box" x="12.5" y="62.5" width="290" height="52" rx="4"/>
  <text x="24" y="83"><tspan class="name">SELECT</tspan> the moorings</text>
  <text class="quiet" x="24" y="103">as a receiver must be called</text>
  <path class="line" d="M157.5 115 V128.5"/>
  <polygon class="head" points="157.5,138.5 152.5,128.5 162.5,128.5"/>

  <rect class="box" x="12.5" y="138.5" width="290" height="32" rx="4"/>
  <text x="24" y="159"><tspan class="name">DELETE</tspan> the mooring</text>
  <path class="line" d="M157.5 171 V184.5"/>
  <polygon class="head" points="157.5,194.5 152.5,184.5 162.5,184.5"/>

  <rect class="box" x="12.5" y="194.5" width="290" height="32" rx="4"/>
  <text x="24" y="215"><tspan class="name">DELETE</tspan> the harbour</text>

  <!-- what the receiver and the count learn of the mooring -->
  <text class="name quiet" x="0" y="262">post_delete</text>
  <text x="104" y="262">called for the mooring</text>
  <text class="quiet" x="0" y="282">counted</text>
  <text x="104" y="282">the harbour and the mooring</text>

  <!-- DB_CASCADE: one step in Django's lane, then one in the database's, the accent -->
  <text class="strong" x="0" y="326"><tspan class="name">DB_CASCADE</tspan>, since 6.1: the database deletes the mooring</text>
  <rect class="ground" x="0.5" y="339.5" width="314" height="174" rx="4"/>
  <rect class="ground" x="331.5" y="339.5" width="314" height="174" rx="4"/>
  <text class="quiet" x="12" y="361">Django</text>
  <text class="quiet" x="343" y="361">the database</text>

  <rect class="box" x="12.5" y="373.5" width="290" height="52" rx="4"/>
  <text x="24" y="394"><tspan class="name">DELETE</tspan> the harbour</text>
  <text class="quiet" x="24" y="414">the one statement sent</text>
  <path class="line" d="M303 399.5 H488.5 V439.5"/>
  <polygon class="head" points="488.5,449.5 483.5,439.5 493.5,439.5"/>

  <rect class="mark-box" x="343.5" y="449.5" width="290" height="52" rx="4"/>
  <text x="355" y="470">deletes the mooring</text>
  <text class="quiet" x="355" y="490">by its key's <tspan class="name">ON DELETE</tspan> clause</text>

  <!-- what the receiver and the count learn of the mooring -->
  <text class="name quiet" x="0" y="537">post_delete</text>
  <text x="104" y="537">not called for the mooring</text>
  <text class="quiet" x="0" y="557">counted</text>
  <text x="104" y="557">the harbour alone</text>
</svg>
