<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 356">
  <!-- the statement every mode starts from, and the loop that follows it -->
  <rect class="box" x="0.5" y="0.5" width="645" height="32" rx="4"/>
  <text x="12" y="21">One statement has loaded four reporters, two to each of two papers, without their papers.</text>
  <text x="0" y="56">A loop then reads each reporter's paper in turn.</text>

  <!-- three columns, one to a mode, side by side: FETCH_ONE at x 0, FETCH_PEERS at 216, FETCH_RAISE at 432 -->
  <!-- rows: read 1 to read 4, tops at 118, 180, 242, 304; an arrow is what a read does with a paper not loaded -->
  <text x="0" y="92"><tspan class="name strong">FETCH_ONE</tspan><tspan class="quiet">, the default</tspan></text>
  <text class="name strong" x="216" y="92">FETCH_PEERS</text>
  <text class="name strong" x="432" y="92">FETCH_RAISE</text>
  <path class="line" d="M0 102.5 H185 M216 102.5 H401 M432 102.5 H646"/>

  <!-- FETCH_ONE: each read runs a statement for its own reporter's paper -->
  <text x="0" y="139">read 1</text>
  <path class="line" d="M44 134.5 H64"/>
  <polygon class="head" points="74,134.5 64,129.5 64,139.5"/>
  <rect class="mark-box" x="74.5" y="118.5" width="110" height="50" rx="4"/>
  <text x="86" y="139">a statement</text>
  <text x="86" y="157">for its paper</text>

  <text x="0" y="201">read 2</text>
  <path class="line" d="M44 196.5 H64"/>
  <polygon class="head" points="74,196.5 64,191.5 64,201.5"/>
  <rect class="mark-box" x="74.5" y="180.5" width="110" height="50" rx="4"/>
  <text x="86" y="201">a statement</text>
  <text x="86" y="219">for its paper</text>

  <text x="0" y="263">read 3</text>
  <path class="line" d="M44 258.5 H64"/>
  <polygon class="head" points="74,258.5 64,253.5 64,263.5"/>
  <rect class="mark-box" x="74.5" y="242.5" width="110" height="50" rx="4"/>
  <text x="86" y="263">a statement</text>
  <text x="86" y="281">for its paper</text>

  <text x="0" y="325">read 4</text>
  <path class="line" d="M44 320.5 H64"/>
  <polygon class="head" points="74,320.5 64,315.5 64,325.5"/>
  <rect class="mark-box" x="74.5" y="304.5" width="110" height="50" rx="4"/>
  <text x="86" y="325">a statement</text>
  <text x="86" y="343">for its paper</text>

  <!-- FETCH_PEERS: the first read runs one statement for all four; the other three find their papers loaded -->
  <text x="216" y="139">read 1</text>
  <path class="line" d="M260 134.5 H280"/>
  <polygon class="head" points="290,134.5 280,129.5 280,139.5"/>
  <rect class="mark-box" x="290.5" y="118.5" width="110" height="236" rx="4"/>
  <text x="302" y="139">one statement</text>
  <text x="302" y="157">for the papers</text>
  <text x="302" y="175">of all four</text>

  <text x="216" y="201">read 2</text>
  <text class="quiet" x="216" y="219">loaded</text>
  <text x="216" y="263">read 3</text>
  <text class="quiet" x="216" y="281">loaded</text>
  <text x="216" y="325">read 4</text>
  <text class="quiet" x="216" y="343">loaded</text>

  <!-- FETCH_RAISE: the first read is refused, and no statement runs -->
  <text x="432" y="139">read 1</text>
  <path class="line" d="M476 134.5 H496"/>
  <polygon class="head" points="506,134.5 496,129.5 496,139.5"/>
  <text class="name" x="512" y="139">FieldFetchBlocked</text>
</svg>
