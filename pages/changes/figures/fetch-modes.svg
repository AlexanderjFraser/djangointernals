<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 338">
  <!-- the statement every mode starts from, and the loop that follows it -->
  <rect class="box" x="0.5" y="0.5" width="645" height="34" rx="4"/>
  <text x="12" y="22">One statement has loaded four reporters, two to each of two papers, without their papers.</text>
  <text x="0" y="60">A loop then reads each reporter's paper in turn.</text>

  <!-- three columns, one to a mode: FETCH_ONE at x 0, FETCH_PEERS at 218, FETCH_RAISE at 434 -->
  <!-- rows: read 1 to read 4, tops at 122, 178, 234, 290; an arrow is what a read does with a paper not loaded -->
  <text x="0" y="96"><tspan class="name strong">FETCH_ONE</tspan><tspan class="quiet">, the default</tspan></text>
  <text class="name strong" x="218" y="96">FETCH_PEERS</text>
  <text class="name strong" x="434" y="96">FETCH_RAISE</text>
  <path class="line" d="M0 106.5 H186 M218 106.5 H404 M434 106.5 H646"/>

  <!-- FETCH_ONE: each read runs a statement for its own reporter's paper -->
  <text x="0" y="141">read 1</text>
  <path class="line" d="M43 137 H63"/>
  <polygon class="head" points="73,137 63,132 63,142"/>
  <rect class="mark-box" x="73.5" y="122.5" width="112" height="46" rx="4"/>
  <text x="86" y="141">a statement</text>
  <text x="86" y="159">for its paper</text>

  <text x="0" y="197">read 2</text>
  <path class="line" d="M43 193 H63"/>
  <polygon class="head" points="73,193 63,188 63,198"/>
  <rect class="mark-box" x="73.5" y="178.5" width="112" height="46" rx="4"/>
  <text x="86" y="197">a statement</text>
  <text x="86" y="215">for its paper</text>

  <text x="0" y="253">read 3</text>
  <path class="line" d="M43 249 H63"/>
  <polygon class="head" points="73,249 63,244 63,254"/>
  <rect class="mark-box" x="73.5" y="234.5" width="112" height="46" rx="4"/>
  <text x="86" y="253">a statement</text>
  <text x="86" y="271">for its paper</text>

  <text x="0" y="309">read 4</text>
  <path class="line" d="M43 305 H63"/>
  <polygon class="head" points="73,305 63,300 63,310"/>
  <rect class="mark-box" x="73.5" y="290.5" width="112" height="46" rx="4"/>
  <text x="86" y="309">a statement</text>
  <text x="86" y="327">for its paper</text>

  <!-- FETCH_PEERS: the first read runs one statement for all four; the other three find their papers loaded -->
  <text x="218" y="141">read 1</text>
  <path class="line" d="M261 137 H281"/>
  <polygon class="head" points="291,137 281,132 281,142"/>
  <rect class="mark-box" x="291.5" y="122.5" width="112" height="214" rx="4"/>
  <text x="304" y="141">one statement</text>
  <text x="304" y="159">for the papers</text>
  <text x="304" y="177">of all four</text>

  <text x="218" y="197">read 2</text>
  <text class="quiet" x="218" y="215">loaded</text>
  <text x="218" y="253">read 3</text>
  <text class="quiet" x="218" y="271">loaded</text>
  <text x="218" y="309">read 4</text>
  <text class="quiet" x="218" y="327">loaded</text>

  <!-- FETCH_RAISE: the first read is refused, and no statement runs -->
  <text x="434" y="141">read 1</text>
  <path class="line" d="M477 137 H497"/>
  <polygon class="head" points="507,137 497,132 497,142"/>
  <text class="name" x="511" y="141">FieldFetchBlocked</text>
</svg>
