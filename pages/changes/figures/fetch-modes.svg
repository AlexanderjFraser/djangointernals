<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 415 494">
  <!-- the statement every mode starts from, and the loop that follows it -->
  <rect class="box" x="0.5" y="0.5" width="414" height="54" rx="4"/>
  <text x="12" y="23">One statement has loaded four reporters,</text>
  <text x="12" y="43">two to each of two papers, without their papers.</text>
  <text x="0" y="80">A loop then reads each reporter's paper in turn.</text>

  <!-- three bands, one to a mode, one above the other: FETCH_ONE at 116, FETCH_PEERS at 266, FETCH_RAISE at 406 -->
  <!-- in each, four columns, one to a read, at x 0, 106, 212 and 318; an arrow is what a read does with a paper not loaded -->

  <!-- FETCH_ONE: each read runs a statement for its own reporter's paper -->
  <text x="0" y="116"><tspan class="name strong">FETCH_ONE</tspan><tspan class="quiet">, the default</tspan></text>
  <path class="line" d="M0 126.5 H415"/>

  <text x="12" y="148">read 1</text>
  <path class="line" d="M29.5 156 V170"/>
  <polygon class="head" points="29.5,180 24.5,170 34.5,170"/>
  <rect class="mark-box" x="0.5" y="180.5" width="96" height="46" rx="4"/>
  <text x="12" y="199">a statement</text>
  <text x="12" y="217">for its paper</text>

  <text x="118" y="148">read 2</text>
  <path class="line" d="M135.5 156 V170"/>
  <polygon class="head" points="135.5,180 130.5,170 140.5,170"/>
  <rect class="mark-box" x="106.5" y="180.5" width="96" height="46" rx="4"/>
  <text x="118" y="199">a statement</text>
  <text x="118" y="217">for its paper</text>

  <text x="224" y="148">read 3</text>
  <path class="line" d="M241.5 156 V170"/>
  <polygon class="head" points="241.5,180 236.5,170 246.5,170"/>
  <rect class="mark-box" x="212.5" y="180.5" width="96" height="46" rx="4"/>
  <text x="224" y="199">a statement</text>
  <text x="224" y="217">for its paper</text>

  <text x="330" y="148">read 4</text>
  <path class="line" d="M347.5 156 V170"/>
  <polygon class="head" points="347.5,180 342.5,170 352.5,170"/>
  <rect class="mark-box" x="318.5" y="180.5" width="96" height="46" rx="4"/>
  <text x="330" y="199">a statement</text>
  <text x="330" y="217">for its paper</text>

  <!-- FETCH_PEERS: the first read runs one statement for all four; the other three find their papers loaded -->
  <text class="name strong" x="0" y="266">FETCH_PEERS</text>
  <path class="line" d="M0 276.5 H415"/>

  <text x="12" y="298">read 1</text>
  <path class="line" d="M29.5 306 V320"/>
  <polygon class="head" points="29.5,330 24.5,320 34.5,320"/>

  <text x="118" y="298">read 2</text>
  <text class="quiet" x="118" y="316">loaded</text>
  <text x="224" y="298">read 3</text>
  <text class="quiet" x="224" y="316">loaded</text>
  <text x="330" y="298">read 4</text>
  <text class="quiet" x="330" y="316">loaded</text>

  <rect class="mark-box" x="0.5" y="330.5" width="414" height="36" rx="4"/>
  <text x="12" y="353">one statement for the papers of all four</text>

  <!-- FETCH_RAISE: the first read is refused, and no statement runs -->
  <text class="name strong" x="0" y="406">FETCH_RAISE</text>
  <path class="line" d="M0 416.5 H415"/>

  <text x="12" y="438">read 1</text>
  <path class="line" d="M29.5 446 V460"/>
  <polygon class="head" points="29.5,470 24.5,460 34.5,460"/>
  <text class="name" x="12" y="488">FieldFetchBlocked</text>
</svg>
