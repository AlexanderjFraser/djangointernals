<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 322">
  <!-- a read of a setting: into the proxy, and for the first read of a name on into what it wraps -->
  <text class="name" x="0" y="72">settings.DEBUG</text>
  <path class="line" d="M114 68 H122"/>
  <polygon class="head" points="132,68 122,63 122,73"/>

  <!-- the proxy -->
  <rect class="ground" x="132" y="8" width="244" height="196" rx="8"/>
  <text class="strong" x="144" y="30">the proxy</text>
  <text class="quiet small" x="208" y="30">a LazySettings</text>

  <rect class="box" x="144" y="44" width="220" height="48" rx="4"/>
  <text x="154" y="64">its own attributes</text>
  <text class="quiet small" x="154" y="80">a value kept from an earlier read</text>

  <path class="line dashed" d="M254 92 V108"/>
  <polygon class="head" points="254,118 249,108 259,108"/>
  <text class="quiet small" x="265" y="110">not there</text>

  <rect class="box" x="144" y="118" width="220" height="74" rx="4"/>
  <text class="name" x="154" y="138">LazySettings.__getattr__</text>
  <text class="quiet small" x="154" y="154">loads the settings if nothing is</text>
  <text class="quiet small" x="154" y="168">wrapped, asks, and keeps the</text>
  <text class="quiet small" x="154" y="182">answer above</text>

  <!-- the first read of a name goes on to the wrapped object -->
  <path class="mark-line" d="M364 155 H402"/>
  <polygon class="head mark" points="412,155 402,150 402,160"/>

  <text class="strong" x="412" y="30">what it wraps</text>
  <text class="quiet small" x="512" y="30">one of</text>

  <rect class="mark-box" x="412" y="44" width="234" height="92" rx="4"/>
  <text class="name" x="422" y="64">Settings</text>
  <text class="quiet small" x="422" y="80">every default of global_settings,</text>
  <text class="quiet small" x="422" y="94">with the settings module's</text>
  <text class="quiet small" x="422" y="108">upper-case names set over them:</text>
  <text class="quiet small" x="422" y="122">one flat object</text>

  <rect class="mark-box" x="412" y="150" width="234" height="78" rx="4"/>
  <text class="name" x="422" y="170">UserSettingsHolder</text>
  <text class="quiet small" x="422" y="186">the names set on it; any other</text>
  <text class="quiet small" x="422" y="200">name is asked of the object</text>
  <text class="quiet small" x="422" y="214">behind it</text>

  <path class="line dashed" d="M529 228 V246"/>
  <polygon class="head" points="529,256 524,246 534,246"/>
  <rect class="box" x="412" y="256" width="234" height="60" rx="4"/>
  <text class="name" x="422" y="276">default_settings</text>
  <text class="quiet small" x="422" y="292">global_settings, or the object that</text>
  <text class="quiet small" x="422" y="306">was wrapped before an override</text>
</svg>
