<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 645 329">
  <!-- a read of a setting: into the proxy, and where no value is kept there, on into what it wraps -->
  <text class="name" x="0" y="65">settings.DEBUG</text>
  <path class="line" d="M114 60.5 H122.5"/>
  <polygon class="head" points="132.5,60.5 122.5,55.5 122.5,65.5"/>

  <!-- the proxy -->
  <rect class="ground" x="132.5" y="0.5" width="244" height="190" rx="8"/>
  <text class="strong" x="144" y="22">the proxy</text>
  <text class="quiet small" x="208" y="22">a LazySettings</text>

  <rect class="box" x="144.5" y="36.5" width="220" height="48" rx="4"/>
  <text x="155" y="56">its own attributes</text>
  <text class="quiet small" x="155" y="72">a value kept from an earlier read</text>

  <path class="line dashed" d="M254.5 84.5 V94.5"/>
  <polygon class="head" points="254.5,104.5 249.5,94.5 259.5,94.5"/>
  <text class="quiet small" x="266" y="99">not there</text>

  <rect class="box" x="144.5" y="104.5" width="220" height="74" rx="4"/>
  <text class="name" x="155" y="124">LazySettings.__getattr__</text>
  <text class="quiet small" x="155" y="140">loads the settings if nothing is</text>
  <text class="quiet small" x="155" y="154">wrapped, asks, and keeps the</text>
  <text class="quiet small" x="155" y="168">answer above</text>

  <!-- a read that finds no kept value goes on to what the proxy wraps, whichever of the two it is:
       the arrow lands on the group, between its two boxes -->
  <path class="mark-line" d="M364.5 141.5 H390.5"/>
  <polygon class="head mark" points="400.5,141.5 390.5,136.5 390.5,146.5"/>

  <!-- what it wraps: one of two objects, a slot and not an object, so its border is dashed -->
  <rect class="ground dashed" x="400.5" y="0.5" width="244" height="244" rx="8"/>
  <text class="strong" x="412" y="22">what it wraps</text>
  <text class="quiet small" x="500" y="22">one of</text>

  <rect class="mark-box" x="412.5" y="36.5" width="220" height="92" rx="4"/>
  <text class="name" x="423" y="56">Settings</text>
  <text class="quiet small" x="423" y="72">every default of global_settings,</text>
  <text class="quiet small" x="423" y="86">with the settings module's</text>
  <text class="quiet small" x="423" y="100">upper-case names set over them:</text>
  <text class="quiet small" x="423" y="114">one flat object</text>

  <rect class="mark-box" x="412.5" y="154.5" width="220" height="78" rx="4"/>
  <text class="name" x="423" y="174">UserSettingsHolder</text>
  <text class="quiet small" x="423" y="190">the names set on it; any other</text>
  <text class="quiet small" x="423" y="204">name not deleted is asked of the</text>
  <text class="quiet small" x="423" y="218">object behind it</text>

  <!-- behind a holder -->
  <path class="line dashed" d="M522.5 232.5 V258.5"/>
  <polygon class="head" points="522.5,268.5 517.5,258.5 527.5,258.5"/>
  <rect class="box" x="412.5" y="268.5" width="220" height="60" rx="4"/>
  <text class="name" x="423" y="288">default_settings</text>
  <text class="quiet small" x="423" y="304">global_settings by default, or the</text>
  <text class="quiet small" x="423" y="318">object wrapped before an override</text>
</svg>
