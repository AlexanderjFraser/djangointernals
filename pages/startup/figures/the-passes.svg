<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 837 506">
  <!-- the list, and its three entries as the grid's columns -->
  <text class="name" x="64" y="14">INSTALLED_APPS = ["library.loans", "library.catalogue.apps.CatalogueConfig", "library.members"]</text>
  <text class="strong" x="182" y="50" text-anchor="middle">loans</text>
  <text class="strong" x="450" y="50" text-anchor="middle">catalogue</text>
  <text class="strong" x="718" y="50" text-anchor="middle">members</text>

  <!-- the phases as the grid's rows -->
  <text class="strong" x="0" y="85">phase 1</text>
  <text class="strong" x="0" y="197">phase 2</text>
  <text class="strong" x="0" y="309">phase 3</text>

  <!-- phase 1: AppConfig.create over the list -->
  <rect class="box" x="64.5" y="64.5" width="236" height="32" rx="4"/>
  <text class="name" x="76" y="85">AppConfig.create</text>
  <path class="line" d="M301 80 H322"/>
  <polygon class="head" points="332,80 322,75 322,85"/>
  <rect class="box" x="332.5" y="64.5" width="236" height="32" rx="4"/>
  <text class="name" x="344" y="85">AppConfig.create</text>
  <path class="line" d="M569 80 H590"/>
  <polygon class="head" points="600,80 590,75 590,85"/>
  <rect class="box" x="600.5" y="64.5" width="236" height="32" rx="4"/>
  <text class="name" x="612" y="85">AppConfig.create</text>
  <circle class="ground" cx="815.5" cy="80.5" r="9"/>
  <text class="small strong" x="815.5" y="85" text-anchor="middle">1</text>

  <!-- the pass ends: its flag, then back to the start of the list -->
  <path class="mark-line" d="M718 97 V110"/>
  <polygon class="head mark" points="718,120 713,110 723,110"/>
  <rect class="mark-box" x="632.5" y="120.5" width="172" height="32" rx="4"/>
  <text class="name" x="644" y="141">apps_ready = True</text>
  <path class="mark-line" d="M632 136 H182 V166"/>
  <polygon class="head mark" points="182,176 177,166 187,166"/>

  <!-- phase 2: AppConfig.import_models over the list -->
  <rect class="box" x="64.5" y="176.5" width="236" height="32" rx="4"/>
  <text class="name" x="76" y="197">AppConfig.import_models</text>
  <circle class="ground" cx="279.5" cy="192.5" r="9"/>
  <text class="small strong" x="279.5" y="197" text-anchor="middle">2</text>
  <path class="line" d="M301 192 H322"/>
  <polygon class="head" points="332,192 322,187 322,197"/>
  <rect class="box" x="332.5" y="176.5" width="236" height="32" rx="4"/>
  <text class="name" x="344" y="197">AppConfig.import_models</text>
  <path class="line" d="M569 192 H590"/>
  <polygon class="head" points="600,192 590,187 590,197"/>
  <rect class="box" x="600.5" y="176.5" width="236" height="32" rx="4"/>
  <text class="name" x="612" y="197">AppConfig.import_models</text>
  <circle class="ground" cx="815.5" cy="192.5" r="9"/>
  <text class="small strong" x="815.5" y="197" text-anchor="middle">3</text>

  <path class="mark-line" d="M718 209 V222"/>
  <polygon class="head mark" points="718,232 713,222 723,222"/>
  <rect class="mark-box" x="632.5" y="232.5" width="172" height="32" rx="4"/>
  <text class="name" x="644" y="253">models_ready = True</text>
  <path class="mark-line" d="M632 248 H182 V278"/>
  <polygon class="head mark" points="182,288 177,278 187,278"/>

  <!-- phase 3: each ready over the list -->
  <rect class="box" x="64.5" y="288.5" width="236" height="32" rx="4"/>
  <text class="name" x="76" y="309">LoansConfig.ready</text>
  <circle class="ground" cx="279.5" cy="304.5" r="9"/>
  <text class="small strong" x="279.5" y="309" text-anchor="middle">4</text>
  <path class="line" d="M301 304 H322"/>
  <polygon class="head" points="332,304 322,299 322,309"/>
  <rect class="box" x="332.5" y="288.5" width="236" height="32" rx="4"/>
  <text class="name" x="344" y="309">AppConfig.ready</text>
  <path class="line" d="M569 304 H590"/>
  <polygon class="head" points="600,304 590,299 590,309"/>
  <rect class="box" x="600.5" y="288.5" width="236" height="32" rx="4"/>
  <text class="name" x="612" y="309">AppConfig.ready</text>

  <path class="mark-line" d="M718 321 V334"/>
  <polygon class="head mark" points="718,344 713,334 723,334"/>
  <rect class="mark-box" x="632.5" y="344.5" width="172" height="32" rx="4"/>
  <text class="name" x="644" y="365">ready = True</text>

  <!-- the four moments, in the order they come -->
  <circle class="ground" cx="73.5" cy="415.5" r="9"/>
  <text class="small strong" x="73.5" y="420" text-anchor="middle">1</text>
  <text x="92" y="420">as <tspan class="name">library.members</tspan> is imported: catalogue's configuration is made, and <tspan class="name">get_app_config</tspan> refuses it</text>

  <circle class="ground" cx="73.5" cy="441.5" r="9"/>
  <text class="small strong" x="73.5" y="446" text-anchor="middle">2</text>
  <text x="92" y="446">as <tspan class="name">library.loans.models</tspan> is imported: <tspan class="name">catalogue.Book</tspan> is not yet registered</text>

  <circle class="ground" cx="73.5" cy="467.5" r="9"/>
  <text class="small strong" x="73.5" y="472" text-anchor="middle">3</text>
  <text x="92" y="472">as <tspan class="name">library.members.models</tspan> is imported: <tspan class="name">catalogue.Book</tspan> is registered, and <tspan class="name">get_model</tspan> refuses it</text>

  <circle class="ground" cx="73.5" cy="493.5" r="9"/>
  <text class="small strong" x="73.5" y="498" text-anchor="middle">4</text>
  <text x="92" y="498">in <tspan class="name">LoansConfig.ready</tspan>: every lookup answers, and <tspan class="name">ready</tspan> is still <tspan class="name">False</tspan></text>
</svg>
