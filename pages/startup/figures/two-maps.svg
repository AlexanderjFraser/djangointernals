<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 731 530">
  <!-- the left map: Apps.app_configs, label to AppConfig -->
  <rect class="ground" x="0.5" y="0.5" width="346" height="352" rx="8"/>
  <text class="name strong" x="12" y="22">Apps.app_configs</text>
  <text class="quiet" x="12" y="41">label → AppConfig: what “installed” means</text>
  <text class="quiet" x="12" y="59">filled by phase one of Apps.populate</text>

  <!-- the right map: Apps.all_models, label to a dictionary of model classes -->
  <rect class="ground" x="378.5" y="0.5" width="352" height="352" rx="8"/>
  <text class="name strong" x="390" y="22">Apps.all_models</text>
  <text class="quiet" x="390" y="41">label → {name in lower case: model class}</text>
  <text class="quiet" x="390" y="59">filled by each class, through Apps.register_model</text>

  <!-- row: loans -->
  <text class="name" x="12" y="101">"loans"</text>
  <path class="line" d="M75 96.5 H120.5"/>
  <polygon class="head" points="130.5,96.5 120.5,91.5 120.5,101.5"/>
  <rect class="box" x="130.5" y="80.5" width="204" height="50" rx="4"/>
  <text x="142" y="101">the AppConfig of loans</text>
  <text x="142" y="119"><tspan class="name">models</tspan><tspan class="quiet">, given in phase two</tspan></text>

  <text class="name" x="390" y="101">"loans"</text>
  <path class="line" d="M453 96.5 H498.5"/>
  <polygon class="head" points="508.5,96.5 498.5,91.5 498.5,101.5"/>
  <rect class="mark-box" x="508.5" y="80.5" width="210" height="50" rx="4"/>
  <text class="name" x="520" y="101">{"loan": Loan}</text>
  <text class="quiet" x="520" y="119">the same dictionary, not a copy</text>

  <path class="mark-line" d="M334.5 114.5 H498.5"/>
  <polygon class="head mark" points="508.5,114.5 498.5,109.5 498.5,119.5"/>

  <!-- row: catalogue -->
  <text class="name" x="12" y="167">"catalogue"</text>
  <path class="line" d="M106 162.5 H120.5"/>
  <polygon class="head" points="130.5,162.5 120.5,157.5 120.5,167.5"/>
  <rect class="box" x="130.5" y="146.5" width="204" height="50" rx="4"/>
  <text x="142" y="167">the AppConfig of catalogue</text>
  <text class="name" x="142" y="185">models</text>

  <text class="name" x="390" y="167">"catalogue"</text>
  <path class="line" d="M484 162.5 H498.5"/>
  <polygon class="head" points="508.5,162.5 498.5,157.5 498.5,167.5"/>
  <rect class="mark-box" x="508.5" y="146.5" width="210" height="50" rx="4"/>
  <text class="name" x="520" y="167">{"book": Book}</text>
  <text class="quiet" x="520" y="185">the same dictionary</text>

  <path class="mark-line" d="M334.5 180.5 H498.5"/>
  <polygon class="head mark" points="508.5,180.5 498.5,175.5 498.5,185.5"/>

  <!-- row: members -->
  <text class="name" x="12" y="233">"members"</text>
  <path class="line" d="M90 228.5 H120.5"/>
  <polygon class="head" points="130.5,228.5 120.5,223.5 120.5,233.5"/>
  <rect class="box" x="130.5" y="212.5" width="204" height="50" rx="4"/>
  <text x="142" y="233">the AppConfig of members</text>
  <text class="name" x="142" y="251">models</text>

  <text class="name" x="390" y="233">"members"</text>
  <path class="line" d="M468 228.5 H498.5"/>
  <polygon class="head" points="508.5,228.5 498.5,223.5 498.5,233.5"/>
  <rect class="mark-box" x="508.5" y="212.5" width="210" height="50" rx="4"/>
  <text class="name" x="520" y="233">{"member": Member}</text>
  <text class="quiet" x="520" y="251">the same dictionary</text>

  <path class="mark-line" d="M334.5 246.5 H498.5"/>
  <polygon class="head mark" points="508.5,246.5 498.5,241.5 498.5,251.5"/>

  <!-- row: a label whose application is not installed -->
  <text class="quiet" x="12" y="299">no entry</text>

  <text class="quiet" x="390" y="299">a label whose</text>
  <text class="quiet" x="390" y="317">application is</text>
  <text class="quiet" x="390" y="335">not installed</text>
  <path class="line" d="M476 294.5 H498.5"/>
  <polygon class="head" points="508.5,294.5 498.5,289.5 498.5,299.5"/>
  <rect class="box" x="508.5" y="278.5" width="210" height="32" rx="4"/>
  <text x="520" y="299"><tspan class="name">{</tspan>its model<tspan class="name">}</tspan></text>

  <!-- route: Apps.get_model, through app_configs and the configuration's models -->
  <text class="name strong" x="0" y="405">Apps.get_model</text>
  <rect class="box" x="212.5" y="384.5" width="164" height="32" rx="4"/>
  <text class="name" x="224.5" y="405">app_configs[label]</text>
  <path class="line" d="M376.5 400.5 H398.5"/>
  <polygon class="head" points="408.5,400.5 398.5,395.5 398.5,405.5"/>
  <rect class="box" x="408.5" y="384.5" width="194" height="32" rx="4"/>
  <text x="420.5" y="405">the configuration’s <tspan class="name">models</tspan></text>
  <path class="line" d="M602.5 400.5 H624.5"/>
  <polygon class="head" points="634.5,400.5 624.5,395.5 624.5,405.5"/>
  <rect class="box" x="634.5" y="384.5" width="84" height="32" rx="4"/>
  <text x="646.5" y="405">the class</text>

  <path class="line dashed" d="M294.5 416.5 V434.5"/>
  <polygon class="head" points="294.5,444.5 289.5,434.5 299.5,434.5"/>
  <text class="quiet small" x="283" y="434" text-anchor="end">a label not installed</text>
  <text x="294.5" y="461" text-anchor="middle"><tspan class="name">LookupError</tspan><tspan class="quiet">, at app_configs</tspan></text>

  <!-- route: Apps.get_registered_model, straight into all_models, whatever the label -->
  <text class="name strong" x="0" y="517">Apps.get_registered_model</text>
  <rect class="box" x="212.5" y="496.5" width="164" height="32" rx="4"/>
  <text class="name" x="224.5" y="517">all_models[label]</text>
  <path class="line" d="M376.5 512.5 H624.5"/>
  <polygon class="head" points="634.5,512.5 624.5,507.5 624.5,517.5"/>
  <text class="quiet small" x="505.5" y="500" text-anchor="middle">a label not installed: the class all the same</text>
  <rect class="box" x="634.5" y="496.5" width="84" height="32" rx="4"/>
  <text x="646.5" y="517">the class</text>
</svg>
