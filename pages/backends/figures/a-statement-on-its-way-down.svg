<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 756">
  <!-- the layers as boxes, each inside the one that calls it, outermost first: what a layer does on the
       way down is written at its head, what it does with what comes back at its foot, under the layers
       inside it. Each box is 14 in from its parent on the left and 8 on the right. -->

  <!-- the call -->
  <text class="name" x="0" y="14">cursor.execute(sql, params)</text>
  <text class="quiet" x="0" y="34"><tspan class="name">sql</tspan> with <tspan class="name">"%s"</tspan>, or <tspan class="name">"%(name)s"</tspan>, for each parameter</text>
  <path class="line" d="M24 42 V56.5"/>
  <polygon class="head" points="24,66.5 19,56.5 29,56.5"/>

  <!-- the debug cursor: there only where queries_logged held as the cursor was made -->
  <rect class="box dashed" x="0.5" y="66.5" width="645" height="635" rx="4"/>
  <text x="14" y="89"><tspan class="name strong">CursorDebugWrapper.execute</tspan></text>
  <text class="quiet small" x="232" y="89">only where <tspan class="name small">queries_logged</tspan> held when the cursor was made</text>
  <text x="14" y="109"><tspan class="name">debug_sql</tspan>: the clock starts</text>

  <!-- Django's cursor -->
  <rect class="box" x="14.5" y="123.5" width="623" height="522" rx="4"/>
  <text x="28" y="146"><tspan class="name strong">CursorWrapper.execute</tspan> → <tspan class="name strong">_execute_with_wrappers</tspan></text>
  <text x="28" y="166"><tspan class="name">context</tspan>: the connection under <tspan class="name">"connection"</tspan>, Django's cursor under <tspan class="name">"cursor"</tspan></text>

  <!-- the execute wrappers, only where installed: the first installed outermost -->
  <rect class="box dashed" x="28.5" y="180.5" width="601" height="451" rx="4"/>
  <text class="strong" x="42" y="203">the execute wrapper installed first</text>

  <rect class="box dashed" x="42.5" y="217.5" width="579" height="378" rx="4"/>
  <text x="56" y="240"><tspan class="strong">the execute wrapper installed next</tspan> … the last is handed <tspan class="name">_execute</tspan> itself</text>

  <!-- the innermost of Django's cursor: the two checks -->
  <rect class="box" x="56.5" y="254.5" width="557" height="327" rx="4"/>
  <text class="name strong" x="70" y="277">CursorWrapper._execute</text>
  <text x="70" y="297"><tspan class="name">RuntimeWarning</tspan>, if the apps are not ready</text>
  <text x="70" y="317"><tspan class="name">TransactionManagementError</tspan>, if <tspan class="name">needs_rollback</tspan></text>
  <text class="quiet small" x="70" y="335">raised by <tspan class="name small">validate_no_broken_transaction</tspan></text>

  <!-- the translation of errors, which stands between Django's layers and the driver's -->
  <rect class="mark-box" x="70.5" y="349.5" width="535" height="218" rx="4"/>
  <text x="84" y="372"><tspan class="name strong">wrap_database_errors</tspan> (<tspan class="name">DatabaseErrorWrapper</tspan>)</text>

  <!-- the driver's cursor, and the placeholders by backend -->
  <rect class="ground" x="84.5" y="386.5" width="513" height="127" rx="4"/>
  <text class="strong" x="98" y="409">the driver's cursor: the backend's class</text>
  <text x="98" y="429">SQLite: <tspan class="name">"%s"</tspan> → <tspan class="name">"?"</tspan></text>
  <text x="260" y="429">Oracle: <tspan class="name">"%s"</tspan> → <tspan class="name">":arg0"</tspan>, <tspan class="name">":arg1"</tspan> …</text>
  <text x="98" y="449">PostgreSQL and MySQL: the driver takes <tspan class="name">"%s"</tspan> as it is</text>

  <!-- the bottom -->
  <rect class="ground" x="98.5" y="463.5" width="491" height="36" rx="4"/>
  <text x="112" y="486">the driver → the database</text>

  <!-- on the way back: at the foot of the translation -->
  <text x="84" y="535">an exception of the driver's: raises <tspan class="name">django.db</tspan>'s namesake</text>
  <text x="84" y="553">of its PEP 249 class, from it</text>

  <!-- at the foot of the wrappers -->
  <text x="42" y="617">an exception of the driver's reaches the wrappers as Django's class</text>

  <!-- at the foot of the debug cursor -->
  <text x="14" y="667"><tspan class="name">debug_sql</tspan>, in a finally: the time and the statement appended to <tspan class="name">queries_log</tspan></text>
  <text x="14" y="687">and logged to <tspan class="name">"django.db.backends"</tspan>, whether the statement returned or raised</text>

  <!-- what passes every layer unchanged -->
  <text x="0" y="729">On the way back up, a result passes through Django's layers unchanged,</text>
  <text x="0" y="749">and so does an exception raised by anything but the driver.</text>
</svg>
