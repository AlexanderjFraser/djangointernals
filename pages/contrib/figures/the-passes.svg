<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 585">
  <!-- what the figure follows -->
  <text x="0" y="16"><tspan class="name">HashedFilesMixin.post_process</tspan> over <tspan class="name">harbour.css</tspan> and the two files it refers to</text>
  <text class="quiet small" x="0" y="34">the other collected files left out</text>

  <!-- the first pass: every file -->
  <rect class="box" x="0.5" y="48.5" width="645" height="274" rx="4"/>
  <text class="strong" x="12" y="70">first pass</text>
  <text class="quiet small" x="12" y="88">every collected file, deepest directory first</text>
  <text class="quiet small" x="384" y="88">saved as</text>

  <text class="name" x="12" y="116">notes/base.css</text>
  <text x="164" y="116">nothing to rewrite</text>
  <path class="line" d="M344 111.5 H362"/>
  <polygon class="head" points="372,111.5 362,106.5 362,116.5"/>
  <text class="name" x="384" y="116">notes/base.<tspan class="mark">932853cb9945</tspan>.css</text>

  <text class="name" x="12" y="142">img/anchor.png</text>
  <text x="164" y="142">not adjustable</text>
  <path class="line" d="M344 137.5 H362"/>
  <polygon class="head" points="372,137.5 362,132.5 362,142.5"/>
  <text class="name" x="384" y="142">img/anchor.<tspan class="mark">b357a19c8762</tspan>.png</text>
  <text class="quiet small" x="384" y="159">and yielded</text>

  <text class="name" x="12" y="187">notes/harbour.css</text>
  <text x="164" y="187">the original content</text>
  <text x="164" y="205">hashes to <tspan class="name">a10e57d9c6ea</tspan></text>

  <!-- harbour.css's two references, rewritten with the names just saved -->
  <rect class="ground" x="12.5" y="219.5" width="621" height="62" rx="4"/>
  <text class="name" x="24" y="244">url("../img/anchor.png")</text>
  <path class="line" d="M222 239.5 H240"/>
  <polygon class="head" points="250,239.5 240,234.5 240,244.5"/>
  <text class="name" x="262" y="244">url("../img/anchor.<tspan class="mark">b357a19c8762</tspan>.png")</text>
  <text class="name" x="24" y="268">@import "base.css"</text>
  <path class="line" d="M222 263.5 H240"/>
  <polygon class="head" points="250,263.5 240,258.5 240,268.5"/>
  <text class="name" x="262" y="268">@import url("base.<tspan class="mark">932853cb9945</tspan>.css")</text>

  <text x="164" y="306">the rewritten content</text>
  <path class="line" d="M344 301.5 H362"/>
  <polygon class="head" points="372,301.5 362,296.5 362,306.5"/>
  <text class="name" x="384" y="306">notes/harbour.f60ecf1ef40a.css</text>

  <!-- the second pass: the stylesheets again, from their originals -->
  <rect class="box" x="0.5" y="336.5" width="645" height="196" rx="4"/>
  <text class="strong" x="12" y="358">second pass</text>
  <text class="quiet small" x="12" y="376">the adjustable files, rewritten again from their originals</text>
  <text class="quiet small" x="384" y="376">saved as</text>

  <text class="name" x="12" y="404">notes/base.css</text>
  <text x="164" y="404">the same content</text>
  <path class="line" d="M344 399.5 H362"/>
  <polygon class="head" points="372,399.5 362,394.5 362,404.5"/>
  <text class="name" x="384" y="404">notes/base.932853cb9945.css</text>
  <text class="quiet small" x="384" y="421">unchanged</text>

  <text class="name" x="12" y="449">notes/harbour.css</text>
  <text x="164" y="449">the same content</text>
  <path class="line" d="M344 444.5 H362"/>
  <polygon class="head" points="372,444.5 362,439.5 362,449.5"/>
  <text class="name" x="384" y="449">notes/harbour.f60ecf1ef40a.css</text>
  <text class="quiet small" x="384" y="466">unchanged</text>

  <text class="strong" x="12" y="496">no name changed: no more passes</text>
  <text x="12" y="516"><tspan class="name">base.css</tspan> and <tspan class="name">harbour.css</tspan> yielded with their final names</text>

  <!-- then the manifest -->
  <rect class="ground" x="0.5" y="546.5" width="645" height="38" rx="4"/>
  <text x="12" y="570"><tspan class="name">ManifestFilesMixin.save_manifest</tspan> writes the names to <tspan class="name">STATIC_ROOT/staticfiles.json</tspan></text>
</svg>
