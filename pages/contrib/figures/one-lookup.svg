<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 535">
  <!-- the filter -->
  <text class="name" x="0" y="16">Mooring.objects.filter(position__distance_lte=(point, D(km=2)))</text>
  <text class="quiet small" x="528" y="16"><tspan class="name small">point</tspan>: SRID 4326</text>

  <!-- when the filter is added: the lookup's class, and its value taken apart -->
  <rect class="box" x="0.5" y="30.5" width="645" height="140" rx="4"/>
  <text class="strong" x="12" y="52">when the filter is added</text>
  <text x="12" y="76"><tspan class="name">Query.build_lookup</tspan>: <tspan class="name">"distance_lte"</tspan></text>
  <text x="28" y="96"><tspan class="name">RegisterLookupMixin.get_lookup</tspan> on the <tspan class="name">PointField</tspan>: <tspan class="name">DistanceLTELookup</tspan></text>
  <text x="28" y="116"><tspan class="name">GISLookup.__init__</tspan>: the point, and the parameters <tspan class="name">[D(km=2)]</tspan></text>
  <text x="44" y="136"><tspan class="name">BaseSpatialField.get_prep_value</tspan>: the point, SRID 4326</text>
  <text x="44" y="156"><tspan class="name">DistanceLookupBase.process_rhs_params</tspan>: a pair, no band index</text>

  <!-- when the query is compiled: the function, the placeholder, the distance -->
  <rect class="box" x="0.5" y="184.5" width="645" height="280" rx="4"/>
  <text class="strong" x="12" y="206">when the query is compiled</text>
  <text class="name" x="12" y="230">DistanceLookupFromFunction.as_sql</text>
  <text x="28" y="250"><tspan class="name">PostGISOperations.distance_expr_for_lookup</tspan>: <tspan class="name">Distance(position, point)</tspan>,</text>
  <text x="44" y="268">the point a <tspan class="name">Value</tspan> of <tspan class="name">GeometryField(srid=4326)</tspan></text>
  <text class="name" x="28" y="290">Distance.as_postgresql</text>
  <text x="44" y="310"><tspan class="name">BaseSpatialField.geodetic</tspan>: the row of spatial_ref_sys for 4326 is geographic</text>
  <text x="44" y="330"><tspan class="name">spatial_function_name("DistanceSphere")</tspan>: <tspan class="name mark">"ST_DistanceSphere"</tspan></text>
  <text class="name" x="44" y="350">Value.as_sql</text>
  <text x="60" y="370"><tspan class="name">BaseSpatialField.get_db_prep_value</tspan>: a <tspan class="name">PostGISAdapter</tspan> of the point</text>
  <text x="60" y="390"><tspan class="name">PostGISOperations.get_geom_placeholder_sql</tspan>: the Value's field's SRID, so <tspan class="name mark">%s</tspan></text>
  <text class="name" x="28" y="410">DistanceLookupBase.process_distance</text>
  <text x="44" y="430"><tspan class="name">PostGISOperations.get_distance</tspan>: geodetic, so <tspan class="name">D(km=2).m</tspan>, <tspan class="name mark">2000.0</tspan></text>
  <text x="28" y="450">the function, <tspan class="name">"&lt;="</tspan>, the distance</text>

  <!-- what the lookup gives the WHERE clause -->
  <rect class="ground" x="0.5" y="478.5" width="645" height="56" rx="4"/>
  <text class="name" x="12" y="500"><tspan class="mark">ST_DistanceSphere</tspan>("charts_mooring"."position", <tspan class="mark">%s</tspan>) &lt;= %s</text>
  <text x="12" y="520">params: <tspan class="name">(PostGISAdapter(srid=4326), <tspan class="mark">2000.0</tspan>)</tspan></text>
</svg>
