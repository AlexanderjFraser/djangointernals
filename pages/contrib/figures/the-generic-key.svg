<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 940 306">
  <!-- three columns: the notes table, the content types table, and the three rows the notes name -->
  <text class="name strong" x="0" y="14">notes_note</text>
  <text class="name strong" x="509" y="14">django_content_type</text>

  <!-- the notes table; the two columns of the generic key are what the figure is about -->
  <rect class="ground" x="0.5" y="28.5" width="469" height="108" rx="4"/>
  <rect class="mark-box" x="233.5" y="34.5" width="228" height="96" rx="4"/>
  <text class="name quiet" x="12" y="52">id</text>
  <text class="name quiet" x="40" y="52">text</text>
  <text class="name quiet" x="246" y="52">content_type_id</text>
  <text class="name quiet" x="379" y="52">object_id</text>

  <text class="name" x="12" y="78">1</text>
  <text x="40" y="78">Hull recaulked</text>
  <text class="name" x="246" y="78">12</text>
  <text class="name" x="379" y="78">1</text>

  <text class="name" x="12" y="100">2</text>
  <text x="40" y="100">Pilot boards at the breakwater</text>
  <text class="name" x="246" y="100">11</text>
  <text class="name" x="379" y="100">1</text>

  <text class="name" x="12" y="122">3</text>
  <text x="40" y="122">Lamp changed</text>
  <text class="name" x="246" y="122">21</text>
  <text class="name" x="379" y="122">1</text>

  <!-- the foreign key: each note to its content type -->
  <path class="line" d="M470 74 H499"/>
  <polygon class="head" points="509,74 499,69 499,79"/>
  <path class="line" d="M470 96 H499"/>
  <polygon class="head" points="509,96 499,91 499,101"/>
  <path class="line" d="M470 118 H499"/>
  <polygon class="head" points="509,118 499,113 499,123"/>

  <!-- the content types table -->
  <rect class="ground" x="509.5" y="28.5" width="221" height="108" rx="4"/>
  <text class="name quiet" x="522" y="52">id</text>
  <text class="name quiet" x="554" y="52">app_label</text>
  <text class="name quiet" x="640" y="52">model</text>

  <text class="name" x="522" y="78">12</text>
  <text class="name" x="554" y="78">fleet</text>
  <text class="name" x="640" y="78">ship</text>

  <text class="name" x="522" y="100">11</text>
  <text class="name" x="554" y="100">fleet</text>
  <text class="name" x="640" y="100">port</text>

  <text class="name" x="522" y="122">21</text>
  <text class="name" x="554" y="122">notes</text>
  <text class="name" x="640" y="122">lighthouse</text>

  <!-- the content type names the table, the object id the row: no constraint, so dashed -->
  <path class="line dashed" d="M731 74 H790"/>
  <polygon class="head" points="800,74 790,69 790,79"/>
  <path class="line dashed" d="M731 96 H772 V180 H790"/>
  <polygon class="head" points="800,180 790,175 790,185"/>
  <path class="line dashed" d="M731 118 H752 V286 H790"/>
  <polygon class="head" points="800,286 790,281 790,291"/>

  <!-- the rows named -->
  <text class="name strong" x="800" y="14">fleet_ship</text>
  <rect class="ground" x="800.5" y="28.5" width="139" height="64" rx="4"/>
  <text class="name quiet" x="813" y="52">id</text>
  <text class="name quiet" x="841" y="52">name</text>
  <text class="name" x="813" y="78">1</text>
  <text x="841" y="78">Endeavour</text>

  <text class="name strong" x="800" y="120">fleet_port</text>
  <rect class="ground" x="800.5" y="134.5" width="139" height="64" rx="4"/>
  <text class="name quiet" x="813" y="158">id</text>
  <text class="name quiet" x="841" y="158">name</text>
  <text class="name" x="813" y="184">1</text>
  <text x="841" y="184">Valletta</text>

  <text class="name strong" x="800" y="226">notes_lighthouse</text>
  <rect class="ground" x="800.5" y="240.5" width="139" height="64" rx="4"/>
  <text class="name quiet" x="813" y="264">id</text>
  <text class="name quiet" x="841" y="264">name</text>
  <text class="name" x="813" y="290">1</text>
  <text x="841" y="290">St Elmo</text>

  <!-- what the two kinds of line mean -->
  <path class="line" d="M0 176 H22"/>
  <polygon class="head" points="32,176 22,171 22,181"/>
  <text x="44" y="180"><tspan class="name">content_type_id</tspan> is a foreign key, with a constraint, to <tspan class="name">django_content_type</tspan>.</text>
  <path class="line dashed" d="M0 202 H22"/>
  <polygon class="head" points="32,202 22,197 22,207"/>
  <text x="44" y="206"><tspan class="name">object_id</tspan> is a plain number: no constraint ties it to any table.</text>
</svg>
