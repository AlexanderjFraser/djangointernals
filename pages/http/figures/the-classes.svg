<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 712 636">
  <!-- the tree: each class under the class it is made from, one row to a class -->

  <!-- level 0: HttpResponseBase, as tall as the two lines beside it -->
  <rect class="box" x="0.5" y="0.5" width="360" height="50" rx="4"/>
  <text class="name strong" x="12.5" y="30.5">HttpResponseBase</text>

  <!-- the split: a body held whole, and a body that is an iterator -->
  <path class="mark-line" d="M14 51 V575 H28"/>
  <path class="mark-line" d="M14 79 H28"/>
  <rect class="mark-box" x="28.5" y="62.5" width="332" height="32" rx="4"/>
  <text class="name strong" x="40.5" y="83.5">HttpResponse</text>
  <rect class="mark-box" x="28.5" y="558.5" width="332" height="32" rx="4"/>
  <text class="name strong" x="40.5" y="579.5">StreamingHttpResponse</text>
  <text class="quiet small" x="348.5" y="579.5" text-anchor="end">told elsewhere</text>

  <!-- under HttpResponse -->
  <path class="line" d="M42 95 V475 H56"/>
  <path class="line" d="M42 123 H56"/>
  <path class="line" d="M42 255 H56"/>
  <path class="line" d="M42 431 H56"/>

  <!-- the redirects -->
  <rect class="box" x="56.5" y="106.5" width="304" height="32" rx="4"/>
  <text class="name" x="68.5" y="127.5">HttpResponseRedirectBase</text>
  <path class="line" d="M70 139 V211 H84"/>
  <path class="line" d="M70 167 H84"/>
  <rect class="box" x="84.5" y="150.5" width="276" height="32" rx="4"/>
  <text class="name" x="96.5" y="171.5">HttpResponseRedirect</text>
  <rect class="box" x="84.5" y="194.5" width="276" height="32" rx="4"/>
  <text class="name" x="96.5" y="215.5">HttpResponsePermanentRedirect</text>

  <!-- the other classes named for a status, in one box -->
  <rect class="box" x="56.5" y="238.5" width="304" height="164" rx="4"/>
  <text class="quiet" x="68.5" y="259.5">the other classes named for a status:</text>
  <text class="name" x="68.5" y="283.5">HttpResponseNotModified</text>
  <text class="name" x="68.5" y="301.5">HttpResponseBadRequest</text>
  <text class="name" x="68.5" y="319.5">HttpResponseForbidden</text>
  <text class="name" x="68.5" y="337.5">HttpResponseNotFound</text>
  <text class="name" x="68.5" y="355.5">HttpResponseNotAllowed</text>
  <text class="name" x="68.5" y="373.5">HttpResponseGone</text>
  <text class="name" x="68.5" y="391.5">HttpResponseServerError</text>

  <!-- JsonResponse -->
  <rect class="box" x="56.5" y="414.5" width="304" height="32" rx="4"/>
  <text class="name" x="68.5" y="435.5">JsonResponse</text>

  <!-- the template responses, told on another page -->
  <rect class="box" x="56.5" y="458.5" width="304" height="32" rx="4"/>
  <text class="name" x="68.5" y="479.5">SimpleTemplateResponse</text>
  <text class="quiet small" x="348.5" y="479.5" text-anchor="end">told elsewhere</text>
  <path class="line" d="M70 491 V519 H84"/>
  <rect class="box" x="84.5" y="502.5" width="276" height="32" rx="4"/>
  <text class="name" x="96.5" y="523.5">TemplateResponse</text>

  <!-- under StreamingHttpResponse -->
  <path class="line" d="M42 591 V619 H56"/>
  <rect class="box" x="56.5" y="602.5" width="304" height="32" rx="4"/>
  <text class="name" x="68.5" y="623.5">FileResponse</text>

  <!-- what each class adds, beside it -->
  <text x="384" y="21.5">a status and its reason phrase, headers, a charset,</text>
  <text x="384" y="39.5">cookies, closers; no body</text>
  <text x="384" y="83.5">a body, held whole in memory as bytes</text>
  <text x="384" y="127.5">a <tspan class="name">"Location"</tspan> header, escaped, and two checks</text>
  <text x="384" y="259.5">each a status of its own, and two of them a little more</text>
  <text x="384" y="435.5">data serialised as JSON, as <tspan class="name">"application/json"</tspan></text>
  <text x="384" y="579.5">a body that is an iterator</text>
</svg>
