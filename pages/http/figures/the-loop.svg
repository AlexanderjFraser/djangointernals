<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 859 501">
  <!-- the legend and the column headings -->
  <text class="quiet" x="0.5" y="14.5">time runs down each column</text>
  <text class="strong" x="0.5" y="50.5">under WSGI</text>
  <text x="390.5" y="50.5"><tspan class="strong">under ASGI,</tspan> <tspan class="name">ASGIHandler.send_response</tspan> runs the iterator</text>

  <!-- WSGI: the chain, over before the body begins -->
  <rect class="ground" x="0.5" y="66.5" width="360" height="98" rx="4"/>
  <text class="strong" x="12.5" y="88.5">the chain</text>
  <text x="12.5" y="112.5">the view returns the response</text>
  <text x="12.5" y="130.5">the middleware see it on their way out</text>
  <text x="12.5" y="148.5"><tspan class="name">WSGIHandler.__call__</tspan> returns it to the server</text>

  <!-- WSGI: the server's loop, one turn drawn: the iterator makes a piece and the server sends it -->
  <rect class="ground" x="0.5" y="188.5" width="360" height="124" rx="4"/>
  <text class="strong" x="12.5" y="210.5">then the server's loop, one turn for each piece</text>
  <rect class="mark-box" x="12.5" y="222.5" width="186" height="50" rx="4"/>
  <text x="24.5" y="243.5">the iterator runs one step,</text>
  <text x="24.5" y="261.5">to its next yield</text>
  <path class="mark-line" d="M198.5 247.5 H212.5"/>
  <polygon class="head mark" points="222.5,247.5 212.5,242.5 212.5,252.5"/>
  <rect class="box" x="222.5" y="222.5" width="126" height="50" rx="4"/>
  <text x="234.5" y="243.5">the server sends</text>
  <text x="234.5" y="261.5">the piece it gave</text>
  <text class="quiet" x="12.5" y="296.5">… until the iterator ends</text>

  <!-- WSGI: the server's close -->
  <rect class="ground" x="0.5" y="336.5" width="360" height="80" rx="4"/>
  <text class="strong" x="12.5" y="358.5">then the server's <tspan class="name">close()</tspan></text>
  <text x="12.5" y="382.5"><tspan class="name">HttpResponseBase.close</tspan> runs the closers</text>
  <text x="12.5" y="400.5">signal <tspan class="name">request_finished</tspan></text>

  <!-- ASGI: an asynchronous iterator, each part sent as it is made -->
  <rect class="ground" x="390.5" y="66.5" width="214" height="262" rx="4"/>
  <text class="strong" x="402.5" y="88.5">an asynchronous iterator,</text>
  <text x="402.5" y="106.5">stepped as it is sent</text>

  <rect class="mark-box" x="402.5" y="152.5" width="90" height="32" rx="4"/>
  <text x="414.5" y="173.5">part 1 made</text>
  <path class="mark-line" d="M492.5 168.5 H534.5"/>
  <polygon class="head mark" points="544.5,168.5 534.5,163.5 534.5,173.5"/>
  <rect class="box" x="544.5" y="152.5" width="48" height="32" rx="4"/>
  <text x="556.5" y="173.5">sent</text>

  <rect class="mark-box" x="402.5" y="196.5" width="90" height="32" rx="4"/>
  <text x="414.5" y="217.5">part 2 made</text>
  <path class="mark-line" d="M492.5 212.5 H534.5"/>
  <polygon class="head mark" points="544.5,212.5 534.5,207.5 534.5,217.5"/>
  <rect class="box" x="544.5" y="196.5" width="48" height="32" rx="4"/>
  <text x="556.5" y="217.5">sent</text>

  <rect class="mark-box" x="402.5" y="240.5" width="90" height="32" rx="4"/>
  <text x="414.5" y="261.5">part 3 made</text>
  <path class="mark-line" d="M492.5 256.5 H534.5"/>
  <polygon class="head mark" points="544.5,256.5 534.5,251.5 534.5,261.5"/>
  <rect class="box" x="544.5" y="240.5" width="48" height="32" rx="4"/>
  <text x="556.5" y="261.5">sent</text>

  <rect class="box" x="402.5" y="284.5" width="190" height="32" rx="4"/>
  <text x="414.5" y="305.5">a last message, with no body</text>

  <!-- ASGI: a synchronous iterator, every part made in a thread before any is sent -->
  <rect class="ground" x="624.5" y="66.5" width="234" height="434" rx="4"/>
  <text class="strong" x="636.5" y="88.5">a synchronous iterator,</text>
  <text x="636.5" y="106.5">consumed whole in a thread first</text>

  <rect class="box" x="636.5" y="118.5" width="114" height="194" rx="4"/>
  <text class="strong" x="648.5" y="140.5">in the thread</text>
  <rect class="mark-box" x="648.5" y="152.5" width="90" height="32" rx="4"/>
  <text x="660.5" y="173.5">part 1 made</text>
  <rect class="mark-box" x="648.5" y="196.5" width="90" height="32" rx="4"/>
  <text x="660.5" y="217.5">part 2 made</text>
  <rect class="mark-box" x="648.5" y="240.5" width="90" height="32" rx="4"/>
  <text x="660.5" y="261.5">part 3 made</text>
  <text class="quiet" x="648.5" y="296.5">kept in a list</text>

  <!-- each part waits in the list, and is sent only once the thread is done -->
  <path class="mark-line" d="M738.5 168.5 H780.5 V340.5 H788.5"/>
  <polygon class="head mark" points="798.5,340.5 788.5,335.5 788.5,345.5"/>
  <path class="mark-line" d="M738.5 212.5 H770.5 V384.5 H788.5"/>
  <polygon class="head mark" points="798.5,384.5 788.5,379.5 788.5,389.5"/>
  <path class="mark-line" d="M738.5 256.5 H760.5 V428.5 H788.5"/>
  <polygon class="head mark" points="798.5,428.5 788.5,423.5 788.5,433.5"/>

  <rect class="box" x="798.5" y="324.5" width="48" height="32" rx="4"/>
  <text x="810.5" y="345.5">sent</text>
  <rect class="box" x="798.5" y="368.5" width="48" height="32" rx="4"/>
  <text x="810.5" y="389.5">sent</text>
  <rect class="box" x="798.5" y="412.5" width="48" height="32" rx="4"/>
  <text x="810.5" y="433.5">sent</text>

  <rect class="box" x="636.5" y="456.5" width="210" height="32" rx="4"/>
  <text x="648.5" y="477.5">a last message, with no body</text>
</svg>
