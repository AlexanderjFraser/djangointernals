<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 265">
  <!-- yard's part of the graph down the page, the oldest migration at the top: the last common
       ancestor, the two leaves that depend on it side by side, and under them the merge migration
       that depends on both; every arrow points up, from a migration to one it depends on -->
  <text class="quiet small" x="0" y="14">an arrow runs from a migration</text>
  <text class="quiet small" x="0" y="30">to one it depends on</text>

  <!-- the last common ancestor -->
  <rect class="box" x="198.5" y="0.5" width="249" height="56" rx="4"/>
  <text class="name strong" x="323" y="24" text-anchor="middle">yard.0005_repair_by_foreman</text>
  <text x="323" y="44" text-anchor="middle">the last common ancestor</text>

  <!-- both leaves depend on it: one arrowhead, and a shaft that forks to the two -->
  <path class="line" d="M125 104 V81 H521 V104"/>
  <path class="line" d="M323 81 V67"/>
  <polygon class="head" points="323,57 318,67 328,67"/>

  <!-- the two leaves, each with its operation as makemigrations printed it -->
  <rect class="box" x="0.5" y="104.5" width="249" height="56" rx="4"/>
  <text class="name strong" x="125" y="128" text-anchor="middle">yard.0006_dock_covered</text>
  <text class="name" x="125" y="148" text-anchor="middle">+ Add field covered to dock</text>

  <rect class="box" x="396.5" y="104.5" width="249" height="56" rx="4"/>
  <text class="name strong" x="521" y="128" text-anchor="middle">yard.0006_long_dock</text>
  <text class="name" x="521" y="148" text-anchor="middle">s Raw SQL operation</text>

  <!-- the merge migration depends on both: one shaft from it, and an arrowhead at each leaf -->
  <path class="mark-line" d="M125 171 V185 H521 V171"/>
  <path class="mark-line" d="M323 185 V208"/>
  <polygon class="head mark" points="125,161 120,171 130,171"/>
  <polygon class="head mark" points="521,161 516,171 526,171"/>

  <!-- the merge migration, which is what the figure is about -->
  <rect class="mark-box" x="198.5" y="208.5" width="249" height="56" rx="4"/>
  <text class="name strong" x="323" y="232" text-anchor="middle">yard.0007_merge</text>
  <text x="323" y="252" text-anchor="middle">no operations</text>
</svg>
