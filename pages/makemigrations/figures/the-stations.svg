<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 861 793">
  <!-- the line of makemigrations down the middle, its stations named in a column to their left; the two
       descriptions of the models come in at the top and run as two lanes into the autodetector, and one
       line runs on to the files. Beside the line on the right, the questioner, with each question level
       with the station that asks it; on the left, the three commands that join the line, and below,
       makemigrations itself, which asks before a merge, off the line -->
  <text class="strong" x="0" y="14">makemigrations:</text>
  <text x="0" y="32">from two descriptions</text>
  <text x="0" y="50">of the models to files;</text>
  <text x="0" y="68">no database is changed</text>

  <!-- the two descriptions -->
  <rect class="ground" x="256.5" y="0.5" width="196" height="32" rx="4"/>
  <text x="354.5" y="21.5" text-anchor="middle">the migration files</text>
  <rect class="ground" x="468.5" y="0.5" width="196" height="32" rx="4"/>
  <text x="566.5" y="21.5" text-anchor="middle">the models</text>
  <path class="mark-line" d="M354.5 32.5 V66.5"/>
  <polygon class="head mark" points="354.5,76.5 349.5,66.5 359.5,66.5"/>
  <path class="mark-line" d="M566.5 32.5 V66.5"/>
  <polygon class="head mark" points="566.5,76.5 561.5,66.5 571.5,66.5"/>

  <!-- read -->
  <text class="strong" x="242" y="97.5" text-anchor="end">read</text>
  <rect class="box" x="256.5" y="76.5" width="196" height="68" rx="4"/>
  <text x="268.5" y="97.5"><tspan class="name">MigrationLoader</tspan>:</text>
  <text x="268.5" y="115.5">the graph, then each</text>
  <text x="268.5" y="133.5">migration's state halves</text>
  <rect class="box" x="468.5" y="76.5" width="196" height="68" rx="4"/>
  <text class="name" x="480.5" y="115.5">ProjectState.from_apps</text>

  <path class="mark-line" d="M354.5 144.5 V178.5"/>
  <polygon class="head mark" points="354.5,188.5 349.5,178.5 359.5,178.5"/>
  <text x="366.5" y="171.5">the from-state</text>
  <path class="mark-line" d="M566.5 144.5 V178.5"/>
  <polygon class="head mark" points="566.5,188.5 561.5,178.5 571.5,178.5"/>
  <text x="578.5" y="171.5">the to-state</text>

  <!-- compare -->
  <text class="strong" x="242" y="209.5" text-anchor="end">compare</text>
  <rect class="box" x="256.5" y="188.5" width="408" height="68" rx="4"/>
  <text x="268.5" y="209.5">the autodetector: models matched by name;</text>
  <text x="268.5" y="227.5">generators in a fixed order;</text>
  <text x="268.5" y="245.5">fields compared by <tspan class="name">deconstruct</tspan></text>

  <path class="mark-line" d="M460.5 256.5 V290.5"/>
  <polygon class="head mark" points="460.5,300.5 455.5,290.5 465.5,290.5"/>
  <text x="472.5" y="283.5">operations, each with its needs</text>

  <!-- order -->
  <text class="strong" x="242" y="321.5" text-anchor="end">order</text>
  <rect class="box" x="256.5" y="300.5" width="408" height="50" rx="4"/>
  <text x="268.5" y="321.5">a sort inside each application; rounds across them;</text>
  <text x="268.5" y="339.5">chop mode after a round that takes nothing</text>

  <path class="mark-line" d="M460.5 350.5 V384.5"/>
  <polygon class="head mark" points="460.5,394.5 455.5,384.5 465.5,384.5"/>
  <text x="472.5" y="377.5">migrations, named for now</text>

  <!-- fold -->
  <text class="strong" x="242" y="415.5" text-anchor="end">fold</text>
  <rect class="box" x="256.5" y="394.5" width="408" height="32" rx="4"/>
  <text x="268.5" y="415.5">the optimizer, migration by migration</text>

  <path class="mark-line" d="M460.5 426.5 V460.5"/>
  <polygon class="head mark" points="460.5,470.5 455.5,460.5 465.5,460.5"/>

  <!-- fit -->
  <text class="strong" x="242" y="491.5" text-anchor="end">fit</text>
  <rect class="box" x="256.5" y="470.5" width="408" height="68" rx="4"/>
  <text x="268.5" y="491.5">numbers and names; the first a dependency</text>
  <text x="268.5" y="509.5">on its application's newest migration, where it has one;</text>
  <text x="268.5" y="527.5">applications not asked for dropped, unless needed</text>

  <path class="mark-line" d="M460.5 538.5 V572.5"/>
  <polygon class="head mark" points="460.5,582.5 455.5,572.5 465.5,572.5"/>
  <text x="472.5" y="565.5">numbered migrations</text>

  <!-- write -->
  <text class="strong" x="242" y="603.5" text-anchor="end">write</text>
  <rect class="box" x="256.5" y="582.5" width="408" height="50" rx="4"/>
  <text x="268.5" y="603.5">the writer's text, each value through the serializer,</text>
  <text x="268.5" y="621.5">as <tspan class="name">deconstruct</tspan> returned it</text>

  <path class="mark-line" d="M460.5 632.5 V666.5"/>
  <polygon class="head mark" points="460.5,676.5 455.5,666.5 465.5,666.5"/>
  <rect class="ground" x="362.5" y="676.5" width="196" height="32" rx="4"/>
  <text x="460.5" y="697.5" text-anchor="middle">the files</text>

  <!-- the three commands that join the line for the optimizer and the writer -->
  <rect class="box" x="0.5" y="322.5" width="186" height="104" rx="4"/>
  <text x="12.5" y="343.5">makemigrations <tspan class="name">--update</tspan></text>
  <text x="12.5" y="361.5">squashmigrations</text>
  <text x="12.5" y="379.5">optimizemigration</text>
  <text class="quiet" x="12.5" y="397.5">on migrations</text>
  <text class="quiet" x="12.5" y="415.5">already written</text>
  <path class="line" d="M186.5 374.5 H449.5"/>
  <polygon class="head" points="459.5,374.5 449.5,369.5 449.5,379.5"/>
  <path class="line" d="M93.5 426.5 V560.5 H449.5"/>
  <polygon class="head" points="459.5,560.5 449.5,555.5 449.5,565.5"/>

  <!-- the questioner, beside the line -->
  <rect class="ground" x="704.5" y="0.5" width="156" height="792" rx="4"/>
  <text class="strong" x="716.5" y="21.5">the questioner</text>

  <path class="line" d="M664.5 222.5 H694.5"/>
  <polygon class="head" points="704.5,222.5 694.5,217.5 694.5,227.5"/>
  <text class="quiet" x="684.5" y="214.5" text-anchor="middle">asks</text>
  <text x="716.5" y="194.5">renamed,</text>
  <text x="716.5" y="212.5">or dropped and made?</text>
  <text x="716.5" y="238.5">a value for rows</text>
  <text x="716.5" y="256.5">already there?</text>

  <path class="line" d="M664.5 504.5 H694.5"/>
  <polygon class="head" points="704.5,504.5 694.5,499.5 694.5,509.5"/>
  <text class="quiet" x="684.5" y="496.5" text-anchor="middle">asks</text>
  <text x="716.5" y="509.5">a first migration?</text>

  <!-- off the line: makemigrations itself, before a merge -->
  <rect class="box" x="0.5" y="742.5" width="186" height="50" rx="4"/>
  <text x="12.5" y="763.5">makemigrations itself</text>
  <text x="12.5" y="781.5">before a merge</text>
  <path class="line" d="M186.5 767.5 H694.5"/>
  <polygon class="head" points="704.5,767.5 694.5,762.5 694.5,772.5"/>
  <text class="quiet" x="684.5" y="759.5" text-anchor="middle">asks</text>
  <text x="716.5" y="772.5">a merge?</text>
</svg>
