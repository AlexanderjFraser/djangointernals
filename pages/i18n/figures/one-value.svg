<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 446">
  <!-- one value of the template, down the left: its three states in the accent, the two steps between them -->
  <text x="0" y="14"><tspan class="name">{{ ship.arrives }}</tspan> in a request whose language is nl</text>

  <!-- the value as the view gave it -->
  <rect class="mark-box" x="0.5" y="32.5" width="341" height="52" rx="4"/>
  <text class="quiet small" x="14" y="52">the value</text>
  <text class="name" x="14" y="72">datetime(2026, 3, 29, 9, 30, tzinfo=UTC)</text>

  <!-- the time zone -->
  <path class="mark-line" d="M20 85 V150"/>
  <polygon class="head mark" points="20,160 15,150 25,150"/>
  <rect class="ground" x="40.5" y="98.5" width="605" height="48" rx="4"/>
  <text class="name strong" x="56" y="127">template_localtime</text>
  <text x="216" y="127">reads the current time zone, <tspan class="name">Europe/Amsterdam</tspan></text>

  <rect class="mark-box" x="0.5" y="160.5" width="200" height="36" rx="4"/>
  <text class="name" x="14" y="183">2026-03-29 11:30+02:00</text>

  <!-- the format, and the month's name -->
  <path class="mark-line" d="M20 197 V382"/>
  <polygon class="head mark" points="20,392 15,382 25,382"/>
  <rect class="ground" x="40.5" y="210.5" width="605" height="168" rx="4"/>
  <text class="name strong" x="56" y="236">localize</text>
  <text x="216" y="236">a datetime: <tspan class="name">date_format(value, "DATETIME_FORMAT")</tspan></text>

  <text class="name" x="72" y="266">get_format</text>
  <text x="216" y="266">reads the active language, nl</text>
  <text class="name" x="216" y="286">django.conf.locale.nl.formats</text>
  <path class="line" d="M450 281 H468"/>
  <polygon class="head" points="478,281 468,276 468,286"/>
  <text class="name strong" x="486" y="286">"j F Y H:i"</text>

  <text class="name" x="72" y="318">dateformat</text>
  <text class="name" x="216" y="318">j</text>
  <text class="name" x="256" y="318">F</text>
  <text class="name" x="320" y="318">Y</text>
  <text class="name" x="372" y="318">H:i</text>
  <text class="name strong" x="216" y="338">29</text>
  <text class="name strong" x="256" y="338">maart</text>
  <text class="name strong" x="320" y="338">2026</text>
  <text class="name strong" x="372" y="338">11:30</text>
  <text class="quiet small" x="216" y="360"><tspan class="name small">F</tspan> is the month's name: a lazy translation, read in the active language</text>

  <!-- the value as the template writes it -->
  <rect class="mark-box" x="0.5" y="392.5" width="192" height="52" rx="4"/>
  <text class="quiet small" x="14" y="412">written</text>
  <text class="name strong" x="14" y="432">"29 maart 2026 11:30"</text>
</svg>
