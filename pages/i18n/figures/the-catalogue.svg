<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 424">
  <!-- the object, and the three messages looked up in it; each column is one lookup, from the top -->
  <text x="0" y="14"><tspan class="name">translation("nl")</tspan> in the example: its catalogues, searched top first</text>
  <text class="quiet" x="14" y="50">the messages looked up</text>
  <text class="name" x="380" y="50" text-anchor="middle">"Arrivals"</text>
  <text class="name" x="482" y="50" text-anchor="middle">"January"</text>
  <text class="name" x="584" y="50" text-anchor="middle">"Tide table"</text>

  <!-- the catalogues, top first -->
  <rect class="ground dashed" x="0.5" y="72.5" width="645" height="56" rx="4"/>
  <text x="14" y="94"><tspan class="name">LOCALE_PATHS</tspan>, first listed on top</text>
  <text class="quiet small" x="14" y="114">the example has none</text>

  <rect class="box" x="0.5" y="142.5" width="645" height="56" rx="4"/>
  <text x="14" y="164"><tspan class="name">INSTALLED_APPS</tspan>, first listed on top</text>
  <text class="name" x="14" y="184">office/locale/nl/LC_MESSAGES/django.mo</text>

  <rect class="box" x="0.5" y="212.5" width="645" height="56" rx="4"/>
  <text x="14" y="234">Django's own</text>
  <text class="name" x="14" y="254">django/conf/locale/nl/LC_MESSAGES/django.mo</text>

  <!-- behind them, the fallback -->
  <path class="line dashed" d="M0 284.5 H646"/>
  <rect class="box" x="0.5" y="300.5" width="645" height="56" rx="4"/>
  <text x="14" y="322">behind them, the fallback</text>
  <text x="14" y="342">the translations of <tspan class="name">LANGUAGE_CODE</tspan>, <tspan class="name">"en"</tspan></text>

  <!-- the lookups: each goes down until a catalogue has the message -->
  <path class="mark-line" d="M380 62 V132"/>
  <polygon class="head mark" points="380,142 375,132 385,132"/>
  <text class="name strong" x="380" y="164" text-anchor="middle">"Aankomsten"</text>
  <text class="quiet small" x="380" y="184" text-anchor="middle">stops here</text>

  <path class="mark-line" d="M482 62 V202"/>
  <polygon class="head mark" points="482,212 477,202 487,202"/>
  <text class="name strong" x="482" y="234" text-anchor="middle">"januari"</text>
  <text class="quiet small" x="482" y="254" text-anchor="middle">stops here</text>

  <path class="mark-line" d="M584 62 V366"/>
  <polygon class="head mark" points="584,376 579,366 589,366"/>
  <text class="quiet" x="14" y="396">in none of them</text>
  <text class="name strong" x="584" y="396" text-anchor="middle">"Tide table"</text>
  <text class="quiet small" x="584" y="414" text-anchor="middle">given back as it was</text>
</svg>
