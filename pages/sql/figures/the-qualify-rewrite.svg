<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 664">
  <!-- a sequence down the page: the statement the filter asks for, then the two statements
       get_qualify_sql writes in its place, one inside the other, then the third round the two
       where the selection had masked the window; SQL on the left, what each piece is on the right -->

  <!-- the statement asked for, which SQL will not take -->
  <text class="strong" x="0" y="14">The statement the filter asks for</text>
  <rect class="ground dashed" x="0.5" y="28.5" width="645" height="96" rx="4"/>
  <text class="name" x="12" y="52">SELECT ..., ROW_NUMBER() OVER (PARTITION BY ship_id ORDER BY name) AS n</text>
  <text class="name" x="12" y="72">FROM crew_sailor</text>
  <text class="name mark" x="12" y="92">WHERE n = 1</text>
  <text x="340" y="92">a condition on a window,</text>
  <text x="340" y="108">which SQL will not take in a <tspan class="name">WHERE</tspan></text>

  <!-- the rewrite -->
  <path class="line" d="M14 125 V162.5"/>
  <polygon class="head" points="14,172.5 9,162.5 19,162.5"/>
  <text class="name" x="28" y="142">SQLCompiler.get_qualify_sql</text>
  <text class="quiet small" x="28" y="158">writes two statements where one was wanted</text>

  <!-- the outer statement, with the inner one inside it -->
  <rect class="box" x="0.5" y="172.5" width="645" height="272" rx="4"/>
  <text class="name" x="12" y="196">SELECT * FROM (</text>
  <text x="340" y="196">the outer statement</text>

  <rect class="ground" x="28.5" y="206.5" width="605" height="120" rx="4"/>
  <text class="name" x="40" y="230">SELECT id AS col1, name AS col2,</text>
  <text class="name" x="95" y="250">ship_id AS col3, ...,</text>
  <text class="name" x="95" y="270">ROW_NUMBER() OVER (...) AS n</text>
  <text class="name" x="40" y="290">FROM crew_sailor</text>
  <text class="name" x="40" y="310">ORDER BY name DESC</text>
  <text x="340" y="230">the inner query: a clone, with the</text>
  <text x="340" y="250"><tspan class="name">WHERE</tspan> and <tspan class="name">HAVING</tspan> parts and no limit,</text>
  <text x="340" y="270">written by its compiler's</text>
  <text class="name" x="340" y="290">as_sql(with_col_aliases=True)</text>

  <text class="name" x="12" y="350">) "qualify"</text>
  <text class="name mark" x="12" y="370">WHERE "n" = 1</text>
  <text x="340" y="370">the qualify part, each expression</text>
  <text x="340" y="386">a <tspan class="name">Ref</tspan> to an alias</text>
  <text class="name" x="12" y="408">ORDER BY "col2" DESC</text>
  <text x="340" y="408">the ordering repeated outside</text>
  <text class="name" x="12" y="428">LIMIT 21</text>
  <text x="340" y="428">the limit, from <tspan class="name">as_sql</tspan></text>

  <!-- the third statement, where the selection had masked the window -->
  <text class="strong" x="0" y="474">And a third, where <tspan class="name strong">values()</tspan> had masked the window out of the selection</text>
  <rect class="box" x="0.5" y="488.5" width="645" height="174" rx="4"/>
  <text class="name" x="12" y="512">SELECT "name" FROM (</text>
  <text x="340" y="512">a third statement round the two</text>

  <rect class="ground" x="28.5" y="522.5" width="605" height="100" rx="4"/>
  <text class="name" x="40" y="546">SELECT * FROM (</text>
  <text class="name" x="56" y="566">SELECT ..., ROW_NUMBER() OVER (...) AS "qual0" FROM crew_sailor</text>
  <text class="name" x="40" y="586">) "qualify"</text>
  <text class="name mark" x="40" y="606">WHERE "qual0" = 1</text>
  <text x="340" y="586">the window the selection had masked,</text>
  <text x="340" y="606">selected under <tspan class="name">qual0</tspan> for the test</text>

  <text class="name" x="12" y="646">) "qualify_mask"</text>
  <text x="340" y="646">the selection masked again</text>
</svg>
