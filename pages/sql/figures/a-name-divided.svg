<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 520">
  <!-- the name across the top, cut into its five words and into its two parts: the three words that
       are fields and the two that are not; under it, a panel for each part with what each word
       becomes and the method that decides it; at the foot, what the three methods report -->
  <text x="0" y="14"><tspan class="name strong">ship__home__name__lower__exact</tspan>, a filter's name, split at <tspan class="name">LOOKUP_SEP</tspan> into five words</text>

  <!-- the strip: the fields in one piece, the other words in another -->
  <rect class="mark-box" x="0.5" y="28.5" width="378" height="42" rx="4"/>
  <path class="mark-line" d="M126.5 28.5 V70.5"/>
  <path class="mark-line" d="M252.5 28.5 V70.5"/>
  <text class="name strong" x="63.5" y="54" text-anchor="middle">ship</text>
  <text class="name strong" x="189.5" y="54" text-anchor="middle">home</text>
  <text class="name strong" x="315.5" y="54" text-anchor="middle">name</text>

  <rect class="mark-box" x="393.5" y="28.5" width="252" height="42" rx="4"/>
  <path class="mark-line" d="M519.5 28.5 V70.5"/>
  <text class="name strong" x="456.5" y="54" text-anchor="middle">lower</text>
  <text class="name strong" x="582.5" y="54" text-anchor="middle">exact</text>

  <!-- the fields: each a step of the path, until the one that ends the walk -->
  <rect class="ground" x="0.5" y="86.5" width="645" height="172" rx="4"/>
  <text class="name strong" x="12" y="108">names_to_path</text>
  <text class="quiet small" x="130" y="108">the first three words are fields, and make the path</text>

  <text class="name strong" x="12" y="136">ship</text>
  <text x="84" y="136">a foreign key of Sailor</text>
  <text class="name" x="84" y="154">PathInfo(from Sailor to Ship via Sailor.ship, direct, one)</text>

  <text class="name strong" x="12" y="180">home</text>
  <text x="84" y="180">a foreign key of Ship</text>
  <text class="name" x="84" y="198">PathInfo(from Ship to Port via Ship.home, direct, one)</text>

  <text class="name strong" x="12" y="224">name</text>
  <text x="84" y="224">a field of Port: the walk stops here</text>
  <text x="84" y="242">the final field <tspan class="name">Port.name</tspan>, and the target <tspan class="name">Port.name</tspan></text>

  <!-- the words that are no fields: a transform from the field's registry, a lookup from the transform's -->
  <rect class="ground" x="0.5" y="272.5" width="645" height="128" rx="4"/>
  <text class="name strong" x="12" y="294">build_lookup</text>
  <text class="quiet small" x="130" y="294">the last two are no fields, and are found in registries</text>

  <text class="name strong" x="12" y="322">lower</text>
  <text x="84" y="322">no field of Port: found through <tspan class="name">try_transform</tspan></text>
  <text x="84" y="340">a transform: <tspan class="name">Lower(Col(fleet_port, fleet.Port.name))</tspan></text>

  <text class="name strong" x="12" y="366">exact</text>
  <text x="84" y="366">the last word: found through <tspan class="name">get_lookup</tspan></text>
  <text x="84" y="384">a lookup: <tspan class="name">Exact(Lower(...),</tspan> the value<tspan class="name">)</tspan></text>

  <!-- what the three methods report of this name -->
  <text class="name" x="0" y="428">solve_lookup_type</text>
  <text class="name" x="160" y="428">(['lower', 'exact'], ['ship', 'home', 'name'], False)</text>
  <text class="quiet small" x="160" y="444">the words that are lookups, the words that are fields</text>

  <text class="name" x="0" y="470">setup_joins</text>
  <text x="160" y="470"><tspan class="name">crew_sailor</tspan> → <tspan class="name">fleet_ship</tspan> → <tspan class="name">fleet_port</tspan></text>
  <text class="quiet small" x="160" y="486">one <tspan class="name small">Join</tspan> for each <tspan class="name small">PathInfo</tspan>, from the base table</text>

  <text class="name" x="0" y="512">trim_joins</text>
  <text x="160" y="512">nothing taken back: <tspan class="name">Port.name</tspan> is not a key <tspan class="name">fleet_ship</tspan> holds</text>
</svg>
