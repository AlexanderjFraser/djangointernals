<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 821 381">
  <!-- two halves: on the left what one filter leaves on the query, on the right what the compiler
       does with it; the query crosses from the one to the other when the queryset is evaluated.
       Both halves stand on one grid of rows 22 apart, from 52. -->
  <text class="strong" x="0" y="14">Building, on the <tspan class="name strong">Query</tspan></text>
  <text class="strong" x="392" y="14">Compiling, in the <tspan class="name strong">SQLCompiler</tspan></text>

  <!-- the left half: the filter, and what its name and value become -->
  <rect class="ground" x="0.5" y="28.5" width="352" height="225" rx="4"/>
  <text class="name" x="12" y="52">QuerySet.filter(ship__home__name='Bergen')</text>
  <text x="30" y="74">the name, walked through the models → <tspan class="name">Join</tspan>, <tspan class="name">Join</tspan></text>
  <text x="30" y="96">the name and the value → a <tspan class="name">Lookup</tspan></text>

  <!-- what the query holds, kept from one method to the next -->
  <rect class="mark-box" x="12.5" y="117.5" width="328" height="124" rx="4"/>
  <text class="strong" x="24" y="140">the query holds</text>
  <text class="name" x="24" y="162">alias_map</text>
  <text x="114" y="162">the joins</text>
  <text class="name" x="24" y="184">where</text>
  <text x="114" y="184">the where tree of lookups</text>
  <text class="quiet small" x="24" y="206">and what the queryset's other methods leave:</text>
  <text x="24" y="228">the ordering, still a name; the limit, two numbers</text>

  <!-- the crossing: when the queryset is evaluated, the query makes its compiler -->
  <path class="mark-line" d="M340.5 179.5 H372.5 V69 H382.5"/>
  <polygon class="head mark" points="392.5,69 382.5,64 382.5,74"/>

  <!-- the right half: the compiler's calls, with the clause each one writes -->
  <rect class="ground" x="392.5" y="28.5" width="428" height="351" rx="4"/>
  <text x="405" y="52">the <tspan class="name">QuerySet</tspan> is evaluated</text>
  <text x="423" y="74"><tspan class="name">Query.get_compiler</tspan> → a <tspan class="name">SQLCompiler</tspan></text>
  <text class="name" x="423" y="96">SQLCompiler.as_sql</text>
  <text class="name" x="441" y="118">pre_sql_setup</text>
  <text class="name" x="459" y="140">get_select</text>
  <text x="629" y="140"><tspan class="name">SELECT</tspan> …</text>
  <text class="name" x="459" y="162">get_order_by</text>
  <text x="629" y="162"><tspan class="name">ORDER BY</tspan> …</text>
  <text class="name" x="459" y="184">split_having_qualify</text>
  <text x="629" y="184"><tspan class="name">WHERE</tspan> from <tspan class="name">HAVING</tspan></text>
  <text class="name" x="459" y="206">get_group_by</text>
  <text x="629" y="206"><tspan class="name">GROUP BY</tspan> …</text>
  <text class="name" x="441" y="228">get_from_clause</text>
  <text x="629" y="228"><tspan class="name">FROM</tspan>, the alias map</text>
  <text class="name" x="441" y="250">compile(where)</text>
  <text x="629" y="250"><tspan class="name">WHERE</tspan>, each <tspan class="name">Lookup.as_sql</tspan></text>

  <!-- what the compiler makes -->
  <rect class="box" x="404.5" y="268.5" width="404" height="50" rx="4"/>
  <text class="strong" x="417" y="290">the statement and its parameters</text>
  <text class="quiet small" x="417" y="308"><tspan class="name small">SELECT</tspan>, <tspan class="name small">FROM</tspan>, <tspan class="name small">WHERE</tspan>, <tspan class="name small">GROUP BY</tspan>, <tspan class="name small">HAVING</tspan>, <tspan class="name small">ORDER BY</tspan>, the limit</text>

  <!-- and runs it -->
  <text class="name" x="423" y="341">SQLCompiler.execute_sql</text>
  <text x="629" y="341">runs it on a cursor</text>
  <text class="name" x="423" y="363">SQLCompiler.results_iter</text>
  <text x="629" y="363">the rows, converters applied</text>
</svg>
