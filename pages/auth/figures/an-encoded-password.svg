<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 265">
  <!-- the string whole, broken where its third and fourth parts meet; the "$" it is cut at in the accent -->
  <rect class="ground" x="0.5" y="0.5" width="367" height="50" rx="4"/>
  <text class="name" x="12" y="20">pbkdf2_sha256<tspan class="mark">$</tspan>1800000<tspan class="mark">$</tspan>RVCWTsBrKg4J3kzFwrSy5d<tspan class="mark">$</tspan></text>
  <text class="name" x="12" y="40">KqCZK8R3DfgljJNA8oepLrkWFx3pyG0THfvfixWEQ7k=</text>

  <!-- the string cut at the "$": each part stands where it stood in the string -->
  <rect class="box" x="0.5" y="70.5" width="125" height="28" rx="4"/>
  <text class="name" x="12" y="89">pbkdf2_sha256</text>
  <text x="140" y="89">the algorithm: <tspan class="name">identify_hasher</tspan> finds the hasher by it</text>

  <rect class="box" x="109.5" y="108.5" width="79" height="28" rx="4"/>
  <text class="name" x="121.3" y="127">1800000</text>
  <text x="203" y="127">the iterations: <tspan class="name">must_update</tspan> compares them with the hasher’s</text>

  <rect class="box" x="171.5" y="146.5" width="196" height="28" rx="4"/>
  <text class="name" x="183.7" y="165">RVCWTsBrKg4J3kzFwrSy5d</text>
  <text x="382" y="165">the salt: 22 characters that</text>
  <text x="382" y="183"><tspan class="name">salt()</tspan> draws for 128 bits</text>

  <rect class="box" x="0.5" y="202.5" width="367" height="28" rx="4"/>
  <text class="name" x="12" y="221">KqCZK8R3DfgljJNA8oepLrkWFx3pyG0THfvfixWEQ7k=</text>
  <text x="382" y="221">the derived key: PBKDF2 with SHA-256,</text>
  <text x="382" y="239">32 bytes in base64, which <tspan class="name">verify</tspan> makes</text>
  <text x="382" y="257">again from the password and compares</text>
</svg>
