<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 425">
  <!-- the handler -->
  <rect class="ground" x="0.5" y="0.5" width="645" height="369" rx="4"/>
  <text class="name" x="12" y="21">BaseHandler._get_response</text>
  <text class="quiet small" x="220" y="21">resolves the path, then calls what the URLconf holds</text>

  <!-- the decorators' wrappers -->
  <rect class="box" x="14.5" y="32.5" width="617" height="325" rx="4"/>
  <text class="strong" x="26" y="53">the decorators' wrappers</text>
  <text class="quiet small" x="204" y="53">on the view, made at import; the one written first is outermost</text>

  <!-- the view -->
  <rect class="ground" x="28.5" y="64.5" width="589" height="281" rx="4"/>
  <text class="strong" x="40" y="85">the view</text>
  <text class="quiet small" x="108" y="85">a function or other callable, or the function as_view returned</text>

  <!-- an instance: a class-based view only -->
  <rect class="box dashed" x="42.5" y="96.5" width="561" height="237" rx="4"/>
  <text class="strong" x="54" y="117">an instance of the class</text>
  <text class="quiet small" x="228" y="117">made by that function, for this request alone</text>
  <text class="name" x="54" y="143">View.setup</text>
  <text class="quiet small" x="170" y="143">keeps the request and the view's arguments on the instance</text>
  <text class="name" x="54" y="167">View.dispatch</text>
  <text class="quiet small" x="170" y="167">picks the method named for the request's method</text>

  <!-- the handler method -->
  <rect class="mark-box" x="56.5" y="182.5" width="533" height="139" rx="4"/>
  <text class="name" x="68" y="203">get, post, ...</text>
  <text x="190" y="203">the project's code, or a generic view's</text>

  <!-- in a generic view: the small methods the handler method is made of -->
  <rect class="ground dashed" x="70.5" y="214.5" width="505" height="95" rx="4"/>
  <text class="quiet small" x="82" y="235">in a generic view, small methods that a subclass can replace one at a time:</text>
  <text class="quiet small" x="82" y="253">these three are what DetailView's get calls</text>
  <rect class="box" x="82.5" y="265.5" width="102" height="32" rx="4"/>
  <text class="name" x="94" y="287">get_object</text>
  <rect class="box" x="196.5" y="265.5" width="149" height="32" rx="4"/>
  <text class="name" x="208" y="287">get_context_data</text>
  <rect class="box" x="357.5" y="265.5" width="165" height="32" rx="4"/>
  <text class="name" x="369" y="287">render_to_response</text>

  <!-- the closing lines -->
  <text class="quiet small" x="0" y="395">The response travels back out through the same layers.</text>
  <text class="quiet small" x="0" y="413">A function view has only the first three.</text>
</svg>
