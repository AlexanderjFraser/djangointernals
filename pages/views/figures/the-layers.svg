<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 338">
  <!-- the handler -->
  <rect class="ground" x="0.5" y="0.5" width="645" height="300" rx="4"/>
  <text class="name" x="12" y="21">BaseHandler._get_response</text>
  <text class="quiet small" x="220" y="21">resolves the path, then calls what the URLconf holds</text>

  <!-- the decorators' wrappers -->
  <rect class="box" x="14" y="32" width="618" height="256" rx="4"/>
  <text class="strong" x="26" y="53">the decorators' wrappers</text>
  <text class="quiet small" x="204" y="53">made at import; the one written first is outermost</text>

  <!-- the view -->
  <rect class="ground" x="28" y="64" width="590" height="212" rx="4"/>
  <text class="strong" x="40" y="85">the view</text>
  <text class="quiet small" x="108" y="85">a function of the project's, or the function as_view returned</text>

  <!-- an instance: a class-based view only -->
  <rect class="box dashed" x="42" y="96" width="562" height="168" rx="4"/>
  <text class="strong" x="54" y="117">an instance of the class</text>
  <text class="quiet small" x="228" y="117">made by that function, for this request alone</text>
  <text class="name" x="54" y="143">View.setup</text>
  <text class="quiet small" x="170" y="143">keeps the request and the path's arguments on the instance</text>
  <text class="name" x="54" y="167">View.dispatch</text>
  <text class="quiet small" x="170" y="167">picks the method named for the request's method</text>

  <!-- the handler method -->
  <rect class="mark-box" x="56" y="182" width="534" height="68" rx="4"/>
  <text class="name" x="68" y="205">get, post, ...</text>
  <text x="190" y="205">the project's code, or a generic view's</text>
  <text class="quiet small" x="68" y="233">The response it returns travels back out through the same layers.</text>

  <text class="quiet small" x="0" y="326">A function view has the three outer layers only. The dashed layer and what is inside it belong to a class-based view.</text>
</svg>
