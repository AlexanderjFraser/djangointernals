<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 656 461">
  <!-- a middleware of the chain -->
  <rect class="ground" x="0.5" y="0.5" width="655" height="460" rx="4"/>
  <text class="strong" x="12" y="21">a middleware of the chain</text>
  <text class="name" x="12" y="47">process_request</text>
  <text class="name" x="12" y="448">process_response</text>

  <!-- the handler -->
  <rect class="box" x="14.5" y="62.5" width="627" height="364" rx="4"/>
  <text class="name" x="26" y="83">BaseHandler._get_response</text>
  <text class="quiet small" x="254" y="83">resolves the path</text>
  <text x="26" y="109">the chain's <tspan class="name">process_view</tspan> hooks</text>

  <!-- the wrapper the decorator made -->
  <rect class="mark-box" x="28.5" y="124.5" width="599" height="210" rx="4"/>
  <text class="strong" x="40" y="145">the wrapper the decorator made</text>
  <text class="quiet small" x="254" y="145">calls the hooks of the instance made for this view</text>

  <rect class="ground" x="40.5" y="158.5" width="150" height="32" rx="4"/>
  <text class="name" x="52" y="180">process_request</text>
  <rect class="ground" x="40.5" y="202.5" width="150" height="32" rx="4"/>
  <text class="name" x="52" y="224">process_view</text>
  <path class="line" d="M236 162.5 H242 V230.5 H236"/>
  <text class="quiet small" x="254" y="192">either one answers: its response is returned at once,</text>
  <text class="quiet small" x="254" y="210">and process_response is not called</text>

  <rect class="ground" x="40.5" y="246.5" width="150" height="32" rx="4"/>
  <text x="52" y="268">the view</text>
  <text class="quiet small" x="254" y="258">it raises: process_exception; if that gives no response,</text>
  <text class="quiet small" x="254" y="276">the exception goes on, out of the wrapper</text>

  <rect class="ground" x="40.5" y="290.5" width="150" height="32" rx="4"/>
  <text class="name" x="52" y="312">process_response</text>
  <text class="quiet small" x="254" y="302">for a template response: process_template_response, then</text>
  <text class="quiet small" x="254" y="320">process_response registered on it as a callback</text>

  <!-- the handler renders the template response -->
  <rect class="ground" x="28.5" y="358.5" width="599" height="56" rx="4"/>
  <text class="name" x="40" y="392">SimpleTemplateResponse.render</text>
  <rect class="box dashed" x="282.5" y="370.5" width="150" height="32" rx="4"/>
  <text class="name" x="294" y="392">process_response</text>
  <text class="quiet small" x="448" y="382">the handler renders the template</text>
  <text class="quiet small" x="448" y="400">response, and the callback runs</text>

  <!-- process_response, for a template response, out of the wrapper to the render -->
  <path class="mark-line dashed" d="M115.5 322.5 V346.5 H357.5 V360.5"/>
  <polygon class="head mark" points="357.5,370.5 352.5,360.5 362.5,360.5"/>
</svg>
