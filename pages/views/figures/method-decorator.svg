<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 773 324">
  <!-- what the figure follows -->
  <text x="0" y="15"><tspan class="name">method_decorator(announced, name="dispatch")</tspan> on the class Births</text>

  <!-- once, as the class is made: the rows run one above the next, and a row indented under another runs inside it -->
  <rect class="ground" x="0.5" y="40.5" width="374" height="283" rx="4"/>
  <text x="12" y="62"><tspan class="strong">once</tspan><tspan class="quiet" dx="10">as the module that defines Births is imported</tspan></text>

  <text class="name" x="12" y="96">method_decorator(announced, name="dispatch")</text>
  <text x="12" y="130"><tspan class="name">_multi_decorate</tspan><tspan class="quiet" dx="12">makes the replacement for </tspan><tspan class="name quiet">dispatch</tspan></text>
  <path class="line" d="M20 138 V238"/>
  <text class="name" x="40" y="164">_update_method_wrapper</text>
  <path class="line" d="M48 172 V238"/>
  <rect class="mark-box" x="56.5" y="177.5" width="216" height="32" rx="4"/>
  <text x="68" y="198">announced applied to a stand-in</text>
  <text x="68" y="232">its attributes copied onto the replacement</text>
  <text x="12" y="266">the replacement set on Births as <tspan class="name">dispatch</tspan></text>

  <!-- at every request, in the place of dispatch; the row of the accent is the left's, so that the two applications stand side by side -->
  <rect class="box" x="398.5" y="40.5" width="374" height="283" rx="4"/>
  <text x="410" y="62"><tspan class="strong">at every request</tspan><tspan class="quiet" dx="10">in the place of </tspan><tspan class="name quiet">dispatch</tspan><tspan class="quiet">,</tspan></text>
  <text class="quiet" x="410" y="80">inside the function <tspan class="name">as_view</tspan> returned, after <tspan class="name">View.setup</tspan></text>

  <text x="410" y="130">the wrapper <tspan class="name">method_decorator</tspan> made</text>
  <path class="line" d="M418 138 V306"/>
  <text x="438" y="164"><tspan class="name">View.dispatch</tspan>, bound to the instance, in a partial</text>
  <rect class="mark-box" x="426.5" y="177.5" width="216" height="32" rx="4"/>
  <text x="438" y="198">announced applied to the partial</text>
  <text x="438" y="232">the wrapper announced made, called</text>
  <path class="line" d="M446 240 V306"/>
  <text class="name" x="466" y="266">View.dispatch(request)</text>
  <path class="line" d="M474 274 V306"/>
  <text class="name" x="494" y="300">Births.get(request)</text>
</svg>
