<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 318">
  <!-- once -->
  <rect class="ground" x="0.5" y="0.5" width="645" height="106" rx="4"/>
  <text class="strong" x="12" y="22">Once, when the URLconf's module is imported</text>
  <text class="name" x="12" y="52">Colophon.as_view()</text>
  <path class="line" d="M162 48 H196"/>
  <polygon class="head" points="206,48 196,43 196,53"/>
  <rect class="mark-box" x="212" y="32" width="150" height="32" rx="4"/>
  <text class="name" x="224" y="52">a function, view</text>
  <text class="quiet small" x="374" y="46">view.view_class = Colophon</text>
  <text class="quiet small" x="374" y="62">view.view_initkwargs = {}</text>
  <text class="name" x="12" y="90">path("colophon/", view)</text>
  <text class="quiet small" x="304" y="90">the URLconf holds the function, not the class</text>

  <!-- each request -->
  <rect class="box" x="0.5" y="122" width="645" height="184" rx="4"/>
  <text class="strong" x="12" y="144">Each request for /colophon/</text>
  <text class="quiet small" x="12" y="172">the handler calls it</text>
  <text class="name" x="244" y="172">view(request)</text>
  <path class="line" d="M252 180 V284"/>

  <!-- the same function, called for every request -->
  <path class="mark-line" d="M287 64 V146"/>
  <polygon class="head mark" points="287,156 282,146 292,146"/>
  <text class="name" x="266" y="196">Colophon(**initkwargs)</text>
  <text class="quiet small" x="12" y="196">a new instance, with the arguments set on it</text>
  <text class="name" x="266" y="222">View.setup(request)</text>
  <text class="quiet small" x="12" y="222">it gets request, args, kwargs, and head</text>
  <text class="name" x="266" y="248">View.dispatch(request)</text>
  <text class="quiet small" x="12" y="248">"GET" leads to the instance's get</text>
  <text class="name" x="280" y="274">Colophon.get(request)</text>
  <text class="quiet small" x="12" y="274">returns the response</text>
</svg>
