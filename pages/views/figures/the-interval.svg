<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 248">
  <text class="quiet small" x="0" y="12">The request is for /archive/2026/3/, and the clock stands at 10 April 2026, 09:00.</text>

  <!-- the month, as an interval -->
  <rect class="mark-box" x="108" y="62" width="238" height="24" rx="2"/>
  <text class="quiet small" x="113" y="56">included</text>
  <text class="quiet small" x="341" y="56" text-anchor="end">excluded</text>

  <!-- the axis and its marks -->
  <path class="line" d="M0 74 H646"/>
  <path class="line" d="M108 44 V92 M346 44 V92 M577 44 V92"/>
  <text class="small" x="108" y="38" text-anchor="middle">1 March</text>
  <text class="small" x="346" y="38" text-anchor="middle">1 April</text>
  <text class="small" x="577" y="38" text-anchor="middle">1 May</text>
  <path class="mark-line dashed" d="M418 44 V92"/>
  <text class="small mark" x="424" y="38">now: 10 April</text>

  <!-- the articles -->
  <circle class="head" cx="92" cy="74" r="4"/>
  <circle class="head mark" cx="123" cy="74" r="4"/>
  <circle class="head mark" cx="208" cy="74" r="4"/>
  <circle class="head mark" cx="315" cy="74" r="4"/>
  <circle class="head" cx="354" cy="74" r="4"/>
  <circle class="head" cx="382" cy="74" r="4"/>
  <circle class="head" cx="580" cy="74" r="4"/>
  <text class="quiet small" x="98" y="108" text-anchor="end">27 Feb</text>
  <text class="quiet small" x="123" y="108" text-anchor="middle">3</text>
  <text class="quiet small" x="208" y="108" text-anchor="middle">14</text>
  <text class="quiet small" x="315" y="108" text-anchor="middle">28</text>
  <text class="quiet small" x="354" y="108" text-anchor="middle">2</text>
  <text class="quiet small" x="382" y="108" text-anchor="middle">5</text>
  <text class="quiet small" x="584" y="108">after now</text>

  <!-- what is asked of the database -->
  <text class="strong small" x="0" y="144">the month's articles</text>
  <text class="small" x="148" y="144">published >= 1 March  and  published &lt; 1 April  and  published &lt;= now</text>
  <text class="name small" x="0" y="170">previous_month</text>
  <text class="small" x="148" y="170">the latest article before 1 March is that of 27 February: so, 1 February</text>
  <text class="name small" x="0" y="196">next_month</text>
  <text class="small" x="148" y="196">the earliest article from 1 April up to now is that of 2 April: so, 1 April</text>
  <text class="quiet small" x="0" y="232">For /archive/2026/4/ the search for a next month finds nothing: the one later article is dated after now.</text>
</svg>
