<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 236">
  <!-- GET -->
  <text class="strong" x="0" y="27">GET</text>
  <path class="line" d="M38 22 H52"/>
  <polygon class="head" points="62,22 52,17 52,27"/>
  <rect class="box" x="66" y="0.5" width="196" height="44" rx="4"/>
  <text class="name" x="78" y="19">get_form</text>
  <text class="quiet small" x="78" y="36">a form with no data: not bound</text>
  <path class="line" d="M262 22 H290"/>
  <polygon class="head" points="300,22 290,17 290,27"/>
  <rect class="ground" x="304" y="0.5" width="341" height="44" rx="4"/>
  <text class="strong" x="316" y="19">200</text>
  <text class="quiet small" x="316" y="36">the page, with the empty form</text>

  <!-- between the two requests -->
  <path class="line dashed" d="M16 36 V84"/>
  <polygon class="head" points="16,94 11,84 21,84"/>
  <text class="quiet small" x="30" y="72">the reader fills the form in, and the browser posts it</text>

  <!-- POST -->
  <text class="strong" x="0" y="123">POST</text>
  <path class="line" d="M44 118 H52"/>
  <polygon class="head" points="62,118 52,113 52,123"/>
  <rect class="box" x="66" y="96" width="196" height="44" rx="4"/>
  <text class="name" x="78" y="115">get_form</text>
  <text class="quiet small" x="78" y="132">POST and FILES in it: bound</text>
  <path class="line" d="M262 118 H290"/>
  <polygon class="head" points="300,118 290,113 290,123"/>
  <rect class="mark-box" x="304" y="96" width="96" height="44" rx="4"/>
  <text class="name" x="318" y="123">is_valid</text>

  <!-- no -->
  <path class="line" d="M400 118 H428"/>
  <polygon class="head" points="438,118 428,113 428,123"/>
  <text class="small" x="408" y="110">no</text>
  <rect class="ground" x="442" y="96" width="203" height="44" rx="4"/>
  <text class="name" x="454" y="115">form_invalid</text>
  <text class="quiet small" x="454" y="132">200, the page again, with errors</text>

  <!-- yes -->
  <path class="line" d="M352 140 V172"/>
  <polygon class="head" points="352,182 347,172 357,172"/>
  <text class="small" x="362" y="164">yes</text>
  <rect class="ground" x="304" y="186" width="341" height="44" rx="4"/>
  <text class="name" x="316" y="205">form_valid</text>
  <text class="quiet small" x="316" y="222">302, to the address get_success_url gives</text>
</svg>
