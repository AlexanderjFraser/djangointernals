<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 744 714">
  <!-- the two columns: the tests, and where a request leaves -->
  <text class="strong" x="0" y="14"><tspan class="name">CsrfViewMiddleware.process_view</tspan>, its tests from the top</text>
  <text class="strong" x="482" y="14">where a request leaves</text>

  <!-- the three groups of tests -->
  <rect class="box" x="0.5" y="36.5" width="436" height="178" rx="4"/>
  <rect class="box" x="0.5" y="238.5" width="436" height="146" rx="4"/>
  <rect class="box" x="0.5" y="408.5" width="436" height="210" rx="4"/>

  <!-- the request's way down: past every test, and into the foot -->
  <path class="mark-line" d="M12 26 V658.5 H22.5"/>
  <polygon class="head mark" points="32.5,658.5 22.5,653.5 22.5,663.5"/>

  <!-- let through -->
  <text class="strong" x="32" y="58">let through</text>
  <rect class="ground" x="32.5" y="74.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="106.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="138.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="170.5" width="392" height="32"/>
  <text x="44" y="95">already marked <tspan class="name">"csrf_processing_done"</tspan></text>
  <text x="44" y="127">the view marked <tspan class="name">csrf_exempt</tspan></text>
  <text x="44" y="159">a safe method: <tspan class="name">"GET"</tspan>, <tspan class="name">"HEAD"</tspan>, <tspan class="name">"OPTIONS"</tspan>, <tspan class="name">"TRACE"</tspan></text>
  <text x="44" y="191">the test client's <tspan class="name">"_dont_enforce_csrf_checks"</tspan></text>

  <path class="line" d="M424.5 90.5 H462 M424.5 122.5 H462 M424.5 154.5 H462 M424.5 186.5 H462"/>
  <polygon class="head" points="472,90.5 462,85.5 462,95.5"/>
  <polygon class="head" points="472,122.5 462,117.5 462,127.5"/>
  <polygon class="head" points="472,154.5 462,149.5 462,159.5"/>
  <polygon class="head" points="472,186.5 462,181.5 462,191.5"/>
  <text x="482" y="95">on to the view</text>
  <text x="482" y="127">on to the view, not marked</text>
  <text x="482" y="159"><tspan class="name">_accept</tspan>: marked, on to the view</text>
  <text x="482" y="191"><tspan class="name">_accept</tspan>: marked, on to the view</text>

  <!-- the origin, by one header or none -->
  <text class="strong" x="32" y="260">the origin, by one header or none</text>
  <rect class="ground" x="32.5" y="276.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="308.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="340.5" width="392" height="32"/>
  <text x="44" y="297">an Origin header, which <tspan class="name">_origin_verified</tspan> does not accept</text>
  <text x="44" y="329">no Origin, a secure request: <tspan class="name">_check_referer</tspan> refuses</text>
  <text x="44" y="361">no Origin, plain HTTP: <tspan class="quiet">no header read, on to the token</tspan></text>

  <path class="line" d="M424.5 292.5 H462 M424.5 324.5 H462"/>
  <polygon class="head" points="472,292.5 462,287.5 462,297.5"/>
  <polygon class="head" points="472,324.5 462,319.5 462,329.5"/>
  <text x="482" y="297"><tspan class="name">_reject</tspan>: <tspan class="name">REASON_BAD_ORIGIN</tspan></text>
  <text x="482" y="329"><tspan class="name">_reject</tspan>: one of the four Referer reasons</text>

  <!-- the token: _check_token -->
  <text class="strong" x="32" y="430">the token: <tspan class="name">_check_token</tspan></text>
  <rect class="ground" x="32.5" y="446.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="478.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="510.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="542.5" width="392" height="32"/>
  <rect class="ground" x="32.5" y="574.5" width="392" height="32"/>
  <text x="44" y="467">the cookie malformed</text>
  <text x="44" y="499">no secret</text>
  <text x="44" y="531">no token in <tspan class="name">"csrfmiddlewaretoken"</tspan>, no X-CSRFToken</text>
  <text x="44" y="563">the token malformed</text>
  <text x="44" y="595">a token that does not match the secret</text>

  <path class="line" d="M424.5 462.5 H462 M424.5 494.5 H462 M424.5 526.5 H462 M424.5 558.5 H462 M424.5 590.5 H462"/>
  <polygon class="head" points="472,462.5 462,457.5 462,467.5"/>
  <polygon class="head" points="472,494.5 462,489.5 462,499.5"/>
  <polygon class="head" points="472,526.5 462,521.5 462,531.5"/>
  <polygon class="head" points="472,558.5 462,553.5 462,563.5"/>
  <polygon class="head" points="472,590.5 462,585.5 462,595.5"/>
  <text x="482" y="467"><tspan class="name">_reject</tspan>: a malformed cookie</text>
  <text x="482" y="499"><tspan class="name">_reject</tspan>: <tspan class="name">REASON_NO_CSRF_COOKIE</tspan></text>
  <text x="482" y="531"><tspan class="name">_reject</tspan>: <tspan class="name">REASON_CSRF_TOKEN_MISSING</tspan></text>
  <text x="482" y="563"><tspan class="name">_reject</tspan>: a malformed token</text>
  <text x="482" y="595"><tspan class="name">_reject</tspan>: incorrect</text>

  <!-- the foot: every test passed -->
  <rect class="mark-box" x="32.5" y="642.5" width="392" height="32" rx="4"/>
  <text x="44" y="663">every test passed</text>
  <path class="mark-line" d="M424.5 658.5 H462"/>
  <polygon class="head mark" points="472,658.5 462,653.5 462,663.5"/>
  <text class="strong" x="482" y="663"><tspan class="name">_accept</tspan>: marked, on to the view</text>

  <!-- what _reject is -->
  <text x="0" y="708"><tspan class="name">_reject</tspan>: the failure view's 403 in the view's place, the reason logged</text>
</svg>
