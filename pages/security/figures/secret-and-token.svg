<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 508">
  <!-- the secret; every 32-character string that stands for it is set in the right-hand column, at x 287 -->
  <text text-anchor="end" x="262" y="34">the secret, 32 characters,</text>
  <text text-anchor="end" x="262" y="52">as the cookie <tspan class="name">"csrftoken"</tspan> holds it</text>
  <rect class="mark-box" x="274.5" y="24.5" width="274" height="30" rx="4"/>
  <text class="name mark" x="287" y="44"><tspan class="strong">jHE</tspan>M6ZJGBXWNDhtKs8o0B3aPSl8RkMbM</text>

  <!-- get_token: the mask and the cipher, worked for the first three characters -->
  <text x="0" y="90"><tspan class="name">get_token</tspan>: a new mask of 32, then the secret enciphered with it, character by character</text>
  <text class="quiet small" x="12" y="114">index in <tspan class="name small">CSRF_ALLOWED_CHARS</tspan>:  secret + mask, modulo 62  →  cipher</text>

  <text class="name" x="12" y="136">j</text><text class="name" text-anchor="end" x="44" y="136">9</text>
  <text class="quiet" x="58" y="136">+</text>
  <text class="name" x="80" y="136">1</text><text class="name" text-anchor="end" x="112" y="136">53</text>
  <text class="quiet" x="126" y="136">=</text>
  <text class="name" text-anchor="end" x="160" y="136">62</text>
  <text class="name quiet" x="172" y="136">% 62 =</text>
  <text class="name" text-anchor="end" x="246" y="136">0</text>
  <text class="quiet" x="260" y="136">→</text>
  <text class="name" x="287" y="136">a</text>

  <text class="name" x="12" y="156">H</text><text class="name" text-anchor="end" x="44" y="156">33</text>
  <text class="quiet" x="58" y="156">+</text>
  <text class="name" x="80" y="156">N</text><text class="name" text-anchor="end" x="112" y="156">39</text>
  <text class="quiet" x="126" y="156">=</text>
  <text class="name" text-anchor="end" x="160" y="156">72</text>
  <text class="name quiet" x="172" y="156">% 62 =</text>
  <text class="name" text-anchor="end" x="246" y="156">10</text>
  <text class="quiet" x="260" y="156">→</text>
  <text class="name" x="287" y="156">k</text>

  <text class="name" x="12" y="176">E</text><text class="name" text-anchor="end" x="44" y="176">30</text>
  <text class="quiet" x="58" y="176">+</text>
  <text class="name" x="80" y="176">m</text><text class="name" text-anchor="end" x="112" y="176">12</text>
  <text class="quiet" x="126" y="176">=</text>
  <text class="name" text-anchor="end" x="160" y="176">42</text>
  <text class="quiet" x="260" y="176">→</text>
  <text class="name" x="287" y="176">Q</text>

  <text class="quiet small" x="12" y="196">… and so for all 32</text>

  <!-- the first page's token: the mask, then the cipher -->
  <text x="0" y="232">the token, 64 characters, which the page carries: the mask, then the cipher</text>
  <rect class="box" x="0.5" y="242.5" width="548" height="30" rx="4"/>
  <path class="line" d="M274.5 243 V272"/>
  <text class="name" x="12" y="262"><tspan class="strong">1Nm</tspan>cViBOKVbkf6i9stwgax435vdf56cH</text>
  <text class="name" x="287" y="262"><tspan class="strong">akQ</tspan>OR7akbIXXIdBJKrK6Bq4INGbWfIdj</text>
  <text class="quiet small" x="12" y="290">the mask</text>
  <text class="quiet small" x="287" y="290">the cipher</text>

  <!-- the second page's token: another mask, another cipher, the same secret -->
  <text x="0" y="326">a second page, the same secret: another mask, another token</text>
  <rect class="box" x="0.5" y="336.5" width="548" height="30" rx="4"/>
  <path class="line" d="M274.5 337 V366"/>
  <text class="name" x="12" y="356">3z0Y2ZsH86iPp2DJjYfaZZbjG6c5dXJ4</text>
  <text class="name" x="287" y="356">c6uAYO1dzT4sS9WjBWt0qSbYohaMnzKG</text>

  <!-- the way back: the first token's cipher unmasked -->
  <text x="0" y="404">on the way back, the cipher unmasked: cipher − mask</text>

  <text class="name" x="12" y="428">a</text><text class="name" text-anchor="end" x="44" y="428">0</text>
  <text class="quiet" x="58" y="428">−</text>
  <text class="name" x="80" y="428">1</text><text class="name" text-anchor="end" x="112" y="428">53</text>
  <text class="quiet" x="126" y="428">=</text>
  <text class="name" text-anchor="end" x="168" y="428">-53</text>
  <text class="quiet" x="260" y="428">→</text>
  <text class="name" x="287" y="428">j</text>

  <text class="name" x="12" y="448">k</text><text class="name" text-anchor="end" x="44" y="448">10</text>
  <text class="quiet" x="58" y="448">−</text>
  <text class="name" x="80" y="448">N</text><text class="name" text-anchor="end" x="112" y="448">39</text>
  <text class="quiet" x="126" y="448">=</text>
  <text class="name" text-anchor="end" x="168" y="448">-29</text>
  <text class="quiet" x="260" y="448">→</text>
  <text class="name" x="287" y="448">H</text>

  <text class="name" x="12" y="468">Q</text><text class="name" text-anchor="end" x="44" y="468">42</text>
  <text class="quiet" x="58" y="468">−</text>
  <text class="name" x="80" y="468">m</text><text class="name" text-anchor="end" x="112" y="468">12</text>
  <text class="quiet" x="126" y="468">=</text>
  <text class="name" text-anchor="end" x="168" y="468">30</text>
  <text class="quiet" x="260" y="468">→</text>
  <text class="name" x="287" y="468">E</text>

  <!-- the secret again, as unmasking gives it back -->
  <text text-anchor="end" x="262" y="500">compared with the cookie's secret: equal</text>
  <rect class="mark-box" x="274.5" y="476.5" width="274" height="30" rx="4"/>
  <text class="name mark" x="287" y="496"><tspan class="strong">jHE</tspan>M6ZJGBXWNDhtKs8o0B3aPSl8RkMbM</text>
</svg>
