<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 549 538">
  <!-- the grid: the mask's column from x 0.5, the cipher's from x 274.5; every 32-character string
       that stands for the secret is set in the cipher's column, its characters over the cipher's;
       28 between groups -->

  <!-- the secret, as the cookie holds it -->
  <text text-anchor="end" x="262" y="14"><tspan class="strong">the secret</tspan>, 32 characters,</text>
  <text text-anchor="end" x="262" y="32">as the cookie <tspan class="name">"csrftoken"</tspan> holds it</text>
  <rect class="mark-box" x="274.5" y="4.5" width="274" height="32" rx="4"/>
  <text class="name mark" x="287" y="25.5"><tspan class="strong">Wa5</tspan>HXK02yi3hnlnmwAsz2KkEba0UQOLl</text>

  <!-- get_token: the secret enciphered with the mask, worked for the first three characters -->
  <text x="0" y="74"><tspan class="name strong">get_token</tspan>: a new mask of 32, then the secret enciphered with it, character by character</text>
  <text class="quiet" x="12" y="98">index in <tspan class="name">CSRF_ALLOWED_CHARS</tspan>:  secret + mask, modulo 62  →  cipher</text>

  <text class="name" x="12" y="120">W</text><text class="name" text-anchor="end" x="44" y="120">48</text>
  <text class="quiet" x="56" y="120">+</text>
  <text class="name" x="76" y="120">Z</text><text class="name" text-anchor="end" x="108" y="120">51</text>
  <text class="quiet" x="120" y="120">=</text>
  <text class="name" text-anchor="end" x="164" y="120">99</text>
  <text class="name quiet" x="176" y="120">% 62</text>
  <text class="quiet" x="216" y="120">=</text>
  <text class="name" text-anchor="end" x="250" y="120">37</text>
  <text class="quiet" x="262" y="120">→</text>
  <text class="name" x="287" y="120">L</text>

  <text class="name" x="12" y="140">a</text><text class="name" text-anchor="end" x="44" y="140">0</text>
  <text class="quiet" x="56" y="140">+</text>
  <text class="name" x="76" y="140">X</text><text class="name" text-anchor="end" x="108" y="140">49</text>
  <text class="quiet" x="120" y="140">=</text>
  <text class="name" text-anchor="end" x="164" y="140">49</text>
  <text class="quiet" x="262" y="140">→</text>
  <text class="name" x="287" y="140">X</text>

  <text class="name" x="12" y="160">5</text><text class="name" text-anchor="end" x="44" y="160">57</text>
  <text class="quiet" x="56" y="160">+</text>
  <text class="name" x="76" y="160">F</text><text class="name" text-anchor="end" x="108" y="160">31</text>
  <text class="quiet" x="120" y="160">=</text>
  <text class="name" text-anchor="end" x="164" y="160">88</text>
  <text class="name quiet" x="176" y="160">% 62</text>
  <text class="quiet" x="216" y="160">=</text>
  <text class="name" text-anchor="end" x="250" y="160">26</text>
  <text class="quiet" x="262" y="160">→</text>
  <text class="name" x="287" y="160">A</text>

  <text class="quiet" x="12" y="180">… and so for all 32</text>

  <!-- the first page's token: the mask, then the cipher -->
  <text x="0" y="222"><tspan class="strong">the first page's token</tspan>, 64 characters: the mask, then the cipher</text>
  <rect class="box" x="0.5" y="234.5" width="548" height="32" rx="4"/>
  <path class="line" d="M274.5 235 V266"/>
  <text class="name" x="12" y="255.5"><tspan class="strong">ZXF</tspan>PaDbxyWpP0nBMEUVVsqFISmqZ3uLe</text>
  <text class="name" x="287" y="255.5"><tspan class="strong">LXA</tspan>mXd1pW4iWdyOY0kdkk0PcTmgJJ8mp</text>
  <text class="quiet" x="12" y="286">the mask</text>
  <text class="quiet" x="287" y="286">the cipher</text>

  <!-- the second page's token, a day later: another mask, another cipher, the same secret -->
  <text x="0" y="328"><tspan class="strong">the second page's</tspan>, a day later, from the same secret: another mask, another cipher</text>
  <rect class="box" x="0.5" y="340.5" width="548" height="32" rx="4"/>
  <path class="line" d="M274.5 341 V372"/>
  <text class="name" x="12" y="361.5">W62ZAgGzrFZWbZD7VNRgdDEMVXuDyLTd</text>
  <text class="name" x="287" y="361.5">I6XwnQwrPNS3oaQjhd9F5dOgWXknepuo</text>

  <!-- the way back: the first token's cipher unmasked, worked for the same three characters -->
  <text x="0" y="410"><tspan class="strong">on the way back</tspan>, the first token's cipher unmasked: cipher − mask</text>

  <text class="name" x="12" y="432">L</text><text class="name" text-anchor="end" x="44" y="432">37</text>
  <text class="quiet" x="56" y="432">−</text>
  <text class="name" x="76" y="432">Z</text><text class="name" text-anchor="end" x="108" y="432">51</text>
  <text class="quiet" x="120" y="432">=</text>
  <text class="name" text-anchor="end" x="164" y="432">-14</text>
  <text class="quiet" x="262" y="432">→</text>
  <text class="name" x="287" y="432">W</text>

  <text class="name" x="12" y="452">X</text><text class="name" text-anchor="end" x="44" y="452">49</text>
  <text class="quiet" x="56" y="452">−</text>
  <text class="name" x="76" y="452">X</text><text class="name" text-anchor="end" x="108" y="452">49</text>
  <text class="quiet" x="120" y="452">=</text>
  <text class="name" text-anchor="end" x="164" y="452">0</text>
  <text class="quiet" x="262" y="452">→</text>
  <text class="name" x="287" y="452">a</text>

  <text class="name" x="12" y="472">A</text><text class="name" text-anchor="end" x="44" y="472">26</text>
  <text class="quiet" x="56" y="472">−</text>
  <text class="name" x="76" y="472">F</text><text class="name" text-anchor="end" x="108" y="472">31</text>
  <text class="quiet" x="120" y="472">=</text>
  <text class="name" text-anchor="end" x="164" y="472">-5</text>
  <text class="quiet" x="262" y="472">→</text>
  <text class="name" x="287" y="472">5</text>

  <!-- the secret again, as either token unmasked gives it back -->
  <text text-anchor="end" x="262" y="515"><tspan class="strong">either token unmasked</tspan>:</text>
  <text text-anchor="end" x="262" y="533">the cookie's secret</text>
  <rect class="mark-box" x="274.5" y="504.5" width="274" height="32" rx="4"/>
  <text class="name mark" x="287" y="525.5"><tspan class="strong">Wa5</tspan>HXK02yi3hnlnmwAsz2KkEba0UQOLl</text>
</svg>
