<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 792 501">
  <!-- the request, and the two passes: in down the left, out up the right -->
  <text x="80" y="14">GET https://harbour.example/berths/, from a browser with no cookie</text>
  <text class="strong" x="80" y="40">the way in, outermost first</text>
  <text class="strong" x="412" y="40">the way out, innermost first</text>

  <!-- the four layers, outermost first, and the centre of the chain inside them -->
  <rect class="ground" x="0.5" y="56.5" width="791" height="444" rx="4"/>
  <rect class="box" x="12.5" y="130.5" width="767" height="358" rx="4"/>
  <rect class="ground" x="24.5" y="204.5" width="743" height="272" rx="4"/>
  <rect class="box" x="36.5" y="260.5" width="719" height="204" rx="4"/>
  <rect class="mark-box" x="48.5" y="316.5" width="695" height="136" rx="4"/>

  <!-- SecurityMiddleware -->
  <text class="name" x="80" y="78">SecurityMiddleware</text>
  <text x="80" y="96">the request is secure: no redirect</text>
  <text x="412" y="96">Strict-Transport-Security, X-Content-Type-Options,</text>
  <text x="412" y="114">Referrer-Policy, Cross-Origin-Opener-Policy</text>

  <!-- CsrfViewMiddleware -->
  <text class="name" x="80" y="152">CsrfViewMiddleware</text>
  <text x="80" y="170">looks for the browser's CSRF secret</text>
  <text x="80" y="188">in its cookie: there is none</text>
  <text x="412" y="170">the secret in the cookie csrftoken, and Vary: Cookie</text>

  <!-- XFrameOptionsMiddleware -->
  <text class="name" x="80" y="226">XFrameOptionsMiddleware</text>
  <text x="80" y="244">no <tspan class="name">process_request</tspan></text>
  <text x="412" y="244">X-Frame-Options: DENY</text>

  <!-- ContentSecurityPolicyMiddleware -->
  <text class="name" x="80" y="282">ContentSecurityPolicyMiddleware</text>
  <text x="80" y="300">gives the request a nonce, not yet made</text>
  <text x="412" y="300">Content-Security-Policy, naming the nonce</text>

  <!-- the centre of the chain: the check before the view, then the view -->
  <text class="strong" x="80" y="338">at the centre of the chain</text>
  <rect class="ground" x="80.5" y="354.5" width="300" height="86" rx="4"/>
  <text class="name" x="92" y="376">CsrfViewMiddleware.process_view</text>
  <text x="92" y="394"><tspan class="name">"GET"</tspan> is a safe method:</text>
  <text x="92" y="412">accepted unchecked</text>
  <rect class="ground" x="412.5" y="354.5" width="300" height="86" rx="4"/>
  <text x="424" y="376">the view berths renders the template:</text>
  <text x="424" y="394"><tspan class="name">{% csrf_token %}</tspan> makes the secret</text>
  <text x="552" y="412">and the page's token</text>
  <text x="424" y="430"><tspan class="name">{% csp_nonce_attr %}</tspan> makes the nonce</text>

  <!-- the request's path: down through each layer to the centre, across it, and up and out -->
  <path class="line" d="M60 4 V397.5 H70.5"/>
  <polygon class="head" points="80.5,397.5 70.5,392.5 70.5,402.5"/>
  <path class="line" d="M380.5 397.5 H402.5"/>
  <polygon class="head" points="412.5,397.5 402.5,392.5 402.5,402.5"/>
  <path class="line" d="M712.5 397.5 H732 V14"/>
  <polygon class="head" points="732,4 727,14 737,14"/>
</svg>
