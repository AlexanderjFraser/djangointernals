<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 735 438">
  <!-- the call, and the string it returned, whole -->
  <text x="0" y="14"><tspan class="name">signing.dumps({"berth": 4, "ship": "Endeavour"}, salt="harbour.berths")</tspan> returned</text>
  <rect class="ground" x="0.5" y="28.5" width="734" height="32" rx="4"/>
  <text class="name" x="12" y="49.5">eyJiZXJ0aCI6NCwic2hpcCI6IkVuZGVhdm91ciJ9<tspan class="strong">:</tspan>1xGBt2<tspan class="strong">:</tspan>47wJSFtm65vWL2pHocxqabmba8NeN5ousKdlcRR2x9s</text>

  <!-- the string cut at its separators: each part stands under where it stood in the string -->
  <rect class="box" x="0.5" y="84.5" width="336" height="32" rx="4"/>
  <text class="name" x="12" y="105.5">eyJiZXJ0aCI6NCwic2hpcCI6IkVuZGVhdm91ciJ9</text>
  <text x="350" y="105.5">the JSON, in URL-safe base64</text>
  <text class="name" x="350" y="123.5">{"berth":4,"ship":"Endeavour"}</text>

  <text class="name strong" x="324" y="146.5">:</text>
  <text class="quiet" x="350" y="146.5">the separator</text>

  <rect class="box" x="319.5" y="164.5" width="71" height="32" rx="4"/>
  <text class="name" x="331.8" y="185.5">1xGBt2</text>
  <text x="404" y="185.5">the time of signing, in base 62</text>
  <text x="404" y="203.5"><tspan class="name">1791795600</tspan> seconds: 2026-10-12 09:00:00 UTC</text>

  <text class="name strong" x="378.6" y="226.5">:</text>
  <text class="quiet" x="404" y="226.5">the separator</text>

  <rect class="mark-box" x="374.5" y="244.5" width="360" height="32" rx="4"/>
  <text class="name mark" x="386.4" y="265.5">47wJSFtm65vWL2pHocxqabmba8NeN5ousKdlcRR2x9s</text>
  <text x="361" y="265.5" text-anchor="end">the signature, in URL-safe base64</text>

  <!-- what the signature is computed from: everything before the last separator, under its key -->
  <text class="strong" x="0" y="310.5">the signature is an HMAC with SHA-256</text>
  <text class="quiet" x="12" y="328.5">of</text>
  <text x="44" y="328.5">everything before the last <tspan class="name">":"</tspan></text>
  <rect class="box" x="0.5" y="340.5" width="390" height="32" rx="4"/>
  <text class="name" x="12" y="361.5">eyJiZXJ0aCI6NCwic2hpcCI6IkVuZGVhdm91ciJ9:1xGBt2</text>
  <text class="quiet" x="12" y="392.5">key</text>
  <text x="44" y="392.5">from <tspan class="name">"harbour.berths"</tspan> + <tspan class="name">"signer"</tspan> and <tspan class="name">SECRET_KEY</tspan></text>
  <path class="mark-line" d="M390.5 356.5 H554.5 V286.5"/>
  <polygon class="head mark" points="554.5,276.5 549.5,286.5 559.5,286.5"/>

  <!-- the compressed form -->
  <text class="quiet" x="0" y="432.5">compressed, the JSON would have a <tspan class="name">"."</tspan> in front of its base64, inside what is signed</text>
</svg>
