<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 486">
  <!-- seven stages of ModelBase.__new__, top to bottom, with the point where an abstract class leaves -->
  <text class="strong" x="0" y="14">ModelBase.__new__, stage by stage</text>

  <rect class="ground" x="0.5" y="28.5" width="645" height="48" rx="4"/>
  <text class="mark strong" x="14" y="57">1</text>
  <text x="40" y="57">the bare class</text>
  <text class="small" x="226" y="49"><tspan class="name">type.__new__</tspan>, with the attributes that are</text>
  <text class="small" x="226" y="65">not held back</text>

  <rect class="ground" x="0.5" y="84.5" width="645" height="48" rx="4"/>
  <text class="mark strong" x="14" y="113">2</text>
  <text x="40" y="113">the options</text>
  <text class="small" x="226" y="105">an <tspan class="name">Options</tspan>, made from Meta and the app's label,</text>
  <text class="small" x="226" y="121">installed as <tspan class="name">_meta</tspan></text>

  <rect class="ground" x="0.5" y="140.5" width="645" height="48" rx="4"/>
  <text class="mark strong" x="14" y="169">3</text>
  <text x="40" y="169">the exception classes</text>
  <text class="small" x="226" y="161"><tspan class="name">DoesNotExist</tspan>, <tspan class="name">MultipleObjectsReturned</tspan>, <tspan class="name">NotUpdated</tspan></text>
  <text class="quiet small" x="226" y="177">not for an abstract class</text>

  <rect class="ground" x="0.5" y="196.5" width="645" height="48" rx="4"/>
  <text class="mark strong" x="14" y="225">4</text>
  <text x="40" y="225">the body's attributes</text>
  <text class="small" x="226" y="217">each field and manager is handed the class,</text>
  <text class="small" x="226" y="233">in the order the body wrote them</text>

  <rect class="ground" x="0.5" y="252.5" width="645" height="48" rx="4"/>
  <text class="mark strong" x="14" y="281">5</text>
  <text x="40" y="281">the bases</text>
  <text class="small" x="226" y="273">a proxy is set up; a link is made to a parent that is not</text>
  <text class="small" x="226" y="289">abstract; an abstract base's fields are copied</text>

  <!-- an abstract class leaves here -->
  <path class="mark-line dashed" d="M0 320 H646"/>
  <text class="mark small" x="226" y="338">an abstract class is returned here</text>

  <rect class="box" x="0.5" y="352.5" width="645" height="48" rx="4"/>
  <text class="mark strong" x="14" y="381">6</text>
  <text class="name" x="40" y="381">ModelBase._prepare</text>
  <text class="small" x="226" y="373">a primary key if none was declared, a manager if none</text>
  <text class="small" x="226" y="389">was declared, and the signal <tspan class="name">class_prepared</tspan></text>

  <rect class="box" x="0.5" y="408.5" width="645" height="48" rx="4"/>
  <text class="mark strong" x="14" y="437">7</text>
  <text class="name" x="40" y="437">Apps.register_model</text>
  <text class="small" x="226" y="429">the class is entered in the registry, and what was</text>
  <text class="small" x="226" y="445">waiting for it runs</text>

  <text class="quiet small" x="0" y="478">An abstract class has no third stage, and none after the fifth.</text>
</svg>
