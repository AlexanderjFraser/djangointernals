<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 568">
  <!-- the call, the set of excluded names down the left as it grows, the four steps down the right, and how the call ends -->
  <text class="name" x="0" y="14">Model.full_clean(<tspan class="mark">exclude=None</tspan>, validate_unique=True, validate_constraints=True)</text>

  <!-- the set: one band that is a strip wider after each addition; the widest is drawn first and the narrowest over it -->
  <rect class="mark-box" x="0.5" y="388.5" width="96" height="144" rx="4"/>
  <rect class="mark-box" x="0.5" y="252.5" width="64" height="280" rx="4"/>
  <rect class="mark-box" x="0.5" y="30.5" width="32" height="502" rx="4"/>

  <!-- how the set starts -->
  <path class="mark-line" d="M43 42 H138"/>
  <polygon class="head mark" points="33,42 43,37 43,47"/>
  <text x="148" y="46"><tspan class="mark strong">The set of excluded names</tspan> starts as the argument, or empty.</text>

  <!-- step 1, which is handed the set -->
  <rect class="ground" x="148.5" y="60.5" width="497" height="96" rx="4"/>
  <text class="strong" x="162" y="84">1</text>
  <text class="name" x="184" y="84">Model.clean_fields</text>
  <text class="small" x="184" y="104">each field not passed over cleans its value, and the result is put on the instance</text>
  <text class="small" x="184" y="122">a foreign key asks the database whether the row it points at exists</text>
  <text class="quiet small" x="184" y="142">errors:</text>
  <text class="quiet small" x="226" y="142">by field name</text>
  <path class="mark-line" d="M33 80 H138"/>
  <polygon class="head mark" points="148,80 138,75 138,85"/>

  <!-- step 2, which is not -->
  <rect class="ground" x="148.5" y="164.5" width="497" height="78" rx="4"/>
  <text class="strong" x="162" y="188">2</text>
  <text class="name" x="184" y="188">Model.clean</text>
  <text class="small" x="184" y="208">does nothing unless the model overrides it; runs whether or not step 1 found errors</text>
  <text class="quiet small" x="184" y="228">errors:</text>
  <text class="quiet small" x="226" y="228">by field name, or under <tspan class="name">"__all__"</tspan></text>
  <text class="quiet small" x="46" y="188">not handed</text>
  <text class="quiet small" x="46" y="204">to step 2</text>

  <!-- the set grows -->
  <path class="mark-line" d="M75 264 H138"/>
  <polygon class="head mark" points="65,264 75,259 75,269"/>
  <text x="148" y="268">every field name with an error so far is added to the set</text>

  <!-- step 3 -->
  <rect class="ground" x="148.5" y="282.5" width="497" height="96" rx="4"/>
  <text class="strong" x="162" y="306">3</text>
  <text class="name" x="184" y="306">Model.validate_unique</text>
  <text class="small" x="184" y="326">unique fields, <tspan class="name">unique_together</tspan> and the checks by date:</text>
  <text class="small" x="184" y="344">one query for each check that is made</text>
  <text class="quiet small" x="184" y="364">errors:</text>
  <text class="quiet small" x="226" y="364">by field name, or under <tspan class="name">"__all__"</tspan> for a check of several fields</text>
  <path class="mark-line" d="M65 302 H138"/>
  <polygon class="head mark" points="148,302 138,297 138,307"/>

  <!-- the set grows again -->
  <path class="mark-line" d="M107 400 H138"/>
  <polygon class="head mark" points="97,400 107,395 107,405"/>
  <text x="148" y="404">every field name with an error so far is added to the set</text>

  <!-- step 4 -->
  <rect class="ground" x="148.5" y="418.5" width="497" height="114" rx="4"/>
  <text class="strong" x="162" y="442">4</text>
  <text class="name" x="184" y="442">Model.validate_constraints</text>
  <text class="small" x="184" y="462">each constraint of the model and of its parents is asked to test the instance,</text>
  <text class="small" x="184" y="480">which takes one query at most, and none if a field it tests is excluded</text>
  <text class="quiet small" x="184" y="500">errors:</text>
  <text class="quiet small" x="226" y="500">under <tspan class="name">"__all__"</tspan>; by field name where a unique constraint</text>
  <text class="quiet small" x="226" y="518">on one field answers with the code <tspan class="name">"unique"</tspan></text>
  <path class="mark-line" d="M97 438 H138"/>
  <polygon class="head mark" points="148,438 138,433 138,443"/>

  <!-- the end of the call -->
  <text x="0" y="558">If any step found an error: raise <tspan class="name">ValidationError</tspan>, with the errors of all four by name.</text>
</svg>
