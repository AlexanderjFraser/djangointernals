<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 629">
  <!-- a sequence down the page, from the ORM to the database; each layer a box, the arrow between
       two layers at the left, labelled where it is a lookup or a call. Django's layers are filled,
       what stands above and below them is page-coloured -->

  <!-- the ORM -->
  <rect class="ground" x="0.5" y="0.5" width="645" height="56" rx="4"/>
  <text class="strong" x="14" y="23">the ORM</text>
  <text x="14" y="43">a statement with <tspan class="name">"%s"</tspan> for each parameter, and Python values</text>

  <path class="line" d="M40 57 V76.5"/>
  <polygon class="head" points="40,86.5 35,76.5 45,76.5"/>

  <!-- the handler -->
  <rect class="box" x="0.5" y="86.5" width="645" height="56" rx="4"/>
  <text class="name strong" x="14" y="109">django.db.connections</text>
  <text x="14" y="129">a <tspan class="name">ConnectionHandler</tspan>: a connection per alias, per thread, made on first use</text>

  <path class="line" d="M40 143 V162.5"/>
  <polygon class="head" points="40,172.5 35,162.5 45,162.5"/>
  <text class="name" x="56" y="162">["default"]</text>

  <!-- the connection, which the figure is about -->
  <rect class="mark-box" x="0.5" y="172.5" width="645" height="132" rx="4"/>
  <text x="14" y="195"><tspan class="strong">the connection</tspan>: the backend's <tspan class="name">DatabaseWrapper</tspan><tspan class="quiet"> (<tspan class="name">BaseDatabaseWrapper</tspan> underneath)</tspan></text>

  <!-- its helper objects, in the source's order, three to a line -->
  <text class="name" x="28" y="223">.ops</text>
  <text class="name" x="114" y="223">.features</text>
  <text class="name" x="200" y="223">.introspection</text>
  <text class="name" x="28" y="243">.creation</text>
  <text class="name" x="114" y="243">.client</text>
  <text class="name" x="200" y="243">.validation</text>
  <path class="line" d="M322 211 V247"/>
  <text x="334" y="233">made with the connection</text>

  <!-- the driver's connection -->
  <text class="name" x="28" y="271">.connection</text>
  <text x="334" y="271">the driver's connection:</text>
  <text x="334" y="291"><tspan class="name">None</tspan> until something first needs it</text>

  <path class="line" d="M40 305 V324.5"/>
  <polygon class="head" points="40,334.5 35,324.5 45,324.5"/>
  <text class="name" x="56" y="324">cursor()</text>

  <!-- Django's cursor -->
  <rect class="box" x="0.5" y="334.5" width="645" height="56" rx="4"/>
  <text x="14" y="357"><tspan class="strong">Django's cursor</tspan>: <tspan class="name">CursorWrapper</tspan></text>
  <text x="14" y="377">refuses a statement in a broken transaction; execute wrappers; errors translated</text>

  <path class="line" d="M40 391 V410.5"/>
  <polygon class="head" points="40,420.5 35,410.5 45,410.5"/>

  <!-- the backend's own cursor, where the backend has one: dashed, as not every backend does -->
  <rect class="box dashed" x="0.5" y="420.5" width="645" height="56" rx="4"/>
  <text x="14" y="443"><tspan class="strong">the backend's own cursor class</tspan>, where it has one</text>
  <text x="14" y="463">on SQLite and Oracle, Django's <tspan class="name">"%s"</tspan> rewritten as the driver's placeholders</text>

  <path class="line" d="M40 477 V496.5"/>
  <polygon class="head" points="40,506.5 35,496.5 45,496.5"/>

  <!-- the driver's cursor -->
  <rect class="ground" x="0.5" y="506.5" width="645" height="56" rx="4"/>
  <text class="strong" x="14" y="529">the driver's cursor</text>
  <text x="14" y="549">its own placeholders</text>

  <path class="line" d="M40 563 V582.5"/>
  <polygon class="head" points="40,592.5 35,582.5 45,582.5"/>

  <!-- the database -->
  <rect class="ground" x="0.5" y="592.5" width="645" height="36" rx="4"/>
  <text class="strong" x="14" y="615">the database</text>
</svg>
