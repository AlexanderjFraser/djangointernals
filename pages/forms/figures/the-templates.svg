<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 664">
  <!-- the title and the key: an arrow is a template an object hands to the form's renderer, a dashed box an include -->
  <text class="strong" x="0" y="14"><tspan class="name">str(form)</tspan> for a <tspan class="name">BerthForm</tspan></text>
  <path class="mark-line" d="M14 37.5 H42"/>
  <polygon class="head mark" points="52,37.5 42,32.5 42,42.5"/>
  <text x="80" y="42">the object hands the template to the form's renderer</text>
  <rect class="ground dashed" x="0.5" y="54.5" width="66" height="24" rx="4"/>
  <text class="quiet" x="12" y="71">include</text>
  <text x="80" y="71">an <tspan class="name">{% include %}</tspan>, found by the renderer's engine alone</text>

  <!-- each box is a template's rendering, with what it renders inside it; the objects at the left,
       the templates in one column at the right -->

  <!-- the form's template -->
  <rect class="ground" x="0.5" y="96.5" width="645" height="567" rx="4"/>
  <text class="name" x="12" y="116">BerthForm</text>
  <path class="mark-line" d="M270 111.5 H284"/>
  <polygon class="head mark" points="294,111.5 284,106.5 284,116.5"/>
  <text class="name" x="304" y="116">"django/forms/div.html"</text>

  <!-- the form's errors -->
  <rect class="box" x="12.5" y="129.5" width="621" height="77" rx="4"/>
  <text x="24" y="149"><tspan class="name">ErrorList</tspan>, the form's</text>
  <path class="mark-line" d="M270 144.5 H284"/>
  <polygon class="head mark" points="294,144.5 284,139.5 284,149.5"/>
  <text class="name" x="304" y="149">"django/forms/errors/list/default.html"</text>
  <rect class="ground dashed" x="24.5" y="162.5" width="597" height="32" rx="4"/>
  <text class="quiet" x="36" y="182">include</text>
  <text class="name" x="304" y="182">"django/forms/errors/list/ul.html"</text>

  <!-- for each field, the field's template -->
  <text x="24" y="228">for each field, <tspan class="name">ship</tspan>, <tspan class="name">tonnage</tspan> and <tspan class="name">arrives</tspan>:</text>
  <rect class="box" x="12.5" y="238.5" width="621" height="413" rx="4"/>
  <text class="name" x="24" y="258">BoundField</text>
  <path class="mark-line" d="M270 253.5 H284"/>
  <polygon class="head mark" points="294,253.5 284,248.5 284,258.5"/>
  <text class="name" x="304" y="258">"django/forms/field.html"</text>

  <!-- the label, which the form renders -->
  <rect class="ground" x="24.5" y="271.5" width="597" height="95" rx="4"/>
  <text class="name" x="36" y="291">BerthForm</text>
  <text class="quiet small" x="36" y="309">for <tspan class="name small">BoundField.label_tag</tspan></text>
  <path class="mark-line" d="M270 286.5 H284"/>
  <polygon class="head mark" points="294,286.5 284,281.5 284,291.5"/>
  <text class="name" x="304" y="291">"django/forms/label.html"</text>
  <rect class="box dashed" x="36.5" y="322.5" width="573" height="32" rx="4"/>
  <text class="quiet" x="48" y="342">include</text>
  <text class="name" x="304" y="342">"django/forms/attrs.html"</text>

  <!-- the field's errors -->
  <rect class="ground" x="24.5" y="374.5" width="597" height="95" rx="4"/>
  <text x="36" y="394"><tspan class="name">ErrorList</tspan>, the field's</text>
  <path class="mark-line" d="M270 389.5 H284"/>
  <polygon class="head mark" points="294,389.5 284,384.5 284,394.5"/>
  <text class="name" x="304" y="394">"django/forms/errors/list/default.html"</text>
  <text class="quiet small" x="304" y="412">even when empty</text>
  <rect class="box dashed" x="36.5" y="425.5" width="573" height="32" rx="4"/>
  <text class="quiet" x="48" y="445">include</text>
  <text class="name" x="304" y="445">"django/forms/errors/list/ul.html"</text>

  <!-- the widget, one template for each of the three -->
  <rect class="ground" x="24.5" y="477.5" width="597" height="162" rx="4"/>
  <text x="36" y="497">the widget</text>
  <text class="quiet small" x="106" y="497"><tspan class="name small">ship</tspan>, a <tspan class="name small">TextInput</tspan></text>
  <path class="mark-line" d="M270 492.5 H284"/>
  <polygon class="head mark" points="294,492.5 284,487.5 284,497.5"/>
  <text class="name" x="304" y="497">"django/forms/widgets/text.html"</text>
  <text class="quiet small" x="106" y="517"><tspan class="name small">tonnage</tspan>, a <tspan class="name small">NumberInput</tspan></text>
  <path class="mark-line" d="M270 512.5 H284"/>
  <polygon class="head mark" points="294,512.5 284,507.5 284,517.5"/>
  <text class="name" x="304" y="517">"django/forms/widgets/number.html"</text>
  <text class="quiet small" x="106" y="537"><tspan class="name small">arrives</tspan>, a <tspan class="name small">DateInput</tspan></text>
  <path class="mark-line" d="M270 532.5 H284"/>
  <polygon class="head mark" points="294,532.5 284,527.5 284,537.5"/>
  <text class="name" x="304" y="537">"django/forms/widgets/date.html"</text>
  <rect class="box dashed" x="36.5" y="550.5" width="573" height="77" rx="4"/>
  <text class="quiet" x="48" y="570">include</text>
  <text class="name" x="304" y="570">"django/forms/widgets/input.html"</text>
  <rect class="ground dashed" x="48.5" y="583.5" width="549" height="32" rx="4"/>
  <text class="quiet" x="60" y="603">include</text>
  <text class="name" x="304" y="603">"django/forms/widgets/attrs.html"</text>
</svg>
