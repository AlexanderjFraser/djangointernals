<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 646 318">
  <!-- three columns: a check is registered, run and reported; the third ends one of three ways -->
  <text class="strong" x="0" y="14">registered</text>
  <text class="quiet small" x="0" y="32">as modules are imported,</text>
  <text class="quiet small" x="0" y="48">and in AppConfig.ready</text>

  <text class="strong" x="230" y="14">run</text>
  <text class="name small" x="230" y="32">CheckRegistry.run_checks</text>

  <text class="strong" x="460" y="14">reported</text>
  <text class="name small" x="460" y="32">BaseCommand.check</text>

  <!-- the two sets -->
  <rect class="ground" x="0" y="64" width="186" height="40" rx="4"/>
  <text class="name" x="10" y="89">registered_checks</text>
  <rect class="ground" x="0" y="114" width="186" height="58" rx="4"/>
  <text class="name" x="10" y="138">deployment_checks</text>
  <text class="quiet small" x="10" y="158">joined only for --deploy</text>

  <path class="line" d="M186 118 H220"/>
  <polygon class="head" points="230,118 220,113 220,123"/>

  <!-- the selection, and the calls -->
  <rect class="box" x="230" y="64" width="186" height="240" rx="4"/>
  <text x="240" y="88">with tags</text>
  <text class="quiet small" x="240" y="106">the checks that carry</text>
  <text class="quiet small" x="240" y="122">one of them</text>
  <text x="240" y="148">with databases, no tags</text>
  <text class="quiet small" x="240" y="166">all of them</text>
  <text x="240" y="192">with neither</text>
  <text class="quiet small" x="240" y="210">all but those tagged</text>
  <text class="quiet small" x="240" y="226">database</text>
  <path class="line dashed" d="M240 242 H406"/>
  <text class="quiet small" x="240" y="266">each is called, and returns</text>
  <text class="quiet small" x="240" y="282">CheckMessage objects</text>

  <path class="line" d="M416 184 H450"/>
  <polygon class="head" points="460,184 450,179 450,189"/>

  <!-- what becomes of a message -->
  <rect class="ground" x="460" y="64" width="186" height="72" rx="4"/>
  <text x="470" y="90">silenced by its id</text>
  <text class="quiet small" x="470" y="112">counted, and not shown</text>

  <rect class="box" x="460" y="148" width="186" height="72" rx="4"/>
  <text x="470" y="174">below the fail level</text>
  <text class="quiet small" x="470" y="196">printed; the command goes on</text>

  <rect class="mark-box" x="460" y="232" width="186" height="72" rx="4"/>
  <text x="470" y="258">the fail level or above</text>
  <text class="quiet small" x="470" y="280">the command does not run</text>
</svg>
